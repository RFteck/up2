          <input type="file" id="pg-foto" accept="image/*" multiple />
          <div id="pg-fotos-preview" style="display:flex;gap:10px;flex-wrap:wrap;width:100%;">
            ${((Array.isArray(state.novaPerguntaFotos)?state.novaPerguntaFotos:[]).length ? state.novaPerguntaFotos : fotosDaPergunta(editando)).map((foto,j)=>`<div data-foto-index="${j}" style="position:relative;"><img class="foto-preview" src="${foto}" alt="Prévia da foto ${j+1}" /><button type="button" class="btn ghost small pg-remover-foto" data-foto-index="${j}" style="margin-top:6px;">Remover</button></div>`).join('')}
          </div>
        </div>
      </div>

      <div id="editor-tipo-pergunta"></div>

      <div style="display:flex;gap:10px;">
        <button class="btn pine" type="submit">${editando?'Salvar alterações':'Adicionar pergunta'}</button>
        ${editando?'<button class="btn ghost" type="button" id="btn-cancelar-edicao">Cancelar</button>':''}
      </div>
    </form>

    <div class="card">
      ${perguntas.length===0?`<div class="empty-state">Nenhuma pergunta cadastrada para "${esc(simuladoAtual?.titulo||'')}".</div>`:
        perguntas.map((p,i)=>`
        <div class="list-row">
          <div class="info">
            <h4>${i+1}. ${esc(p.enunciado)}</h4>
            <p>${p.descritor?`<span class="badge on" style="margin-right:6px;">Descritor: ${esc(p.descritor)}</span>`:'<span class="muted">Sem descritor</span>'}${p.habilidade?`<span class="badge" style="margin-right:6px;background:var(--accent-tint);color:var(--accent);">Habilidade: ${esc(p.habilidade)}</span>`:''}${p.textoApoio?` · <span class="badge" style="background:var(--accent-tint);color:var(--accent);">Texto de apoio</span>`:''} · <span class="badge off">${esc(rotuloTipoPergunta(p.tipo||'multipla'))}</span> · resposta correta: ${p.tipo==='texto'?'texto':p.tipo==='associacao'?'associação':p.tipo==='ordenacao'?'ordem definida':p.tipo==='multipla_selecao'?(p.respostasCorretas||[]).map(i=>String.fromCharCode(65+Number(i))).join(', ')||'—':p.tipo==='verdadeiro_falso'?(Number(p.respostaCorreta)===0?'Verdadeiro':'Falso'):String.fromCharCode(65+(p.respostaCorreta??0))}</p>
          </div>
          <div class="row-actions">
            <button class="btn ghost small" data-action="edit-pergunta" data-id="${p.id}">Editar</button>
            <button class="btn danger small" data-action="del-pergunta" data-id="${p.id}">Excluir</button>
          </div>
        </div>
      `).join('')}
    </div>
    ` : `<div class="empty-state">Cadastre um simulado primeiro na aba "Simulados".</div>`}
  `;

  const select = document.getElementById('select-simulado-perguntas');
  if (select) select.addEventListener('change', ()=>{
    state.perguntasFiltroSimuladoId = select.value;
    state.editingPerguntaId = null;
    state.novaPerguntaFotos = null;
    render();
  });

  let rteEnun=null, rteApoio=null;
  if (document.getElementById('rte-enunciado')){
    const ta=document.getElementById('pg-enunciado'), tb=document.getElementById('pg-texto-apoio');
    rteEnun=criarEditorRico(document.getElementById('rte-enunciado'),{html:htmlRico(editando?.enunciado,editando?.enunciadoHtml),placeholder:'Digite aqui a pergunta.',altura:70,onChange:a=>{ta.value=a.innerText.trim();}});
    rteApoio=criarEditorRico(document.getElementById('rte-apoio'),{html:htmlRico(editando?.textoApoio,editando?.textoApoioHtml),placeholder:'Cole ou digite aqui o texto que o aluno deverá ler antes da pergunta.',altura:110,onChange:a=>{tb.value=a.innerText.trim();}});
  }
  const fotoInput = document.getElementById('pg-foto');
  const fotosPreview = document.getElementById('pg-fotos-preview');
  const fotosAtuais = fotosDaPergunta(editando);
  if (state.novaPerguntaFotos === null) state.novaPerguntaFotos = [...fotosAtuais];
  const atualizarPreviewsFotos = ()=>{
    if(!fotosPreview)return;
    fotosPreview.innerHTML = state.novaPerguntaFotos.map((foto,j)=>`<div data-foto-index="${j}" style="position:relative;"><img class="foto-preview" src="${foto}" alt="Prévia da foto ${j+1}" /><button type="button" class="btn ghost small pg-remover-foto" data-foto-index="${j}" style="margin-top:6px;">Remover</button></div>`).join('');
    fotosPreview.querySelectorAll('.pg-remover-foto').forEach(btn=>btn.addEventListener('click',()=>{
      state.novaPerguntaFotos.splice(Number(btn.dataset.fotoIndex),1);
      atualizarPreviewsFotos();
    }));
  };
  atualizarPreviewsFotos();
  if (fotoInput) fotoInput.addEventListener('change', async ()=>{
    const arquivos = Array.from(fotoInput.files || []).filter(file=>file.type.startsWith('image/'));
    if (!arquivos.length) return;
    try{
      const novas = await Promise.all(arquivos.map(file=>comprimirImagem(file)));
      state.novaPerguntaFotos.push(...novas);
      atualizarPreviewsFotos();
      fotoInput.value = '';
    }catch(err){ console.error(err); toast('Não foi possível carregar uma ou mais imagens.'); }
  });

  const tipoSelect=document.getElementById('pg-tipo');
  const tipoEditor=document.getElementById('editor-tipo-pergunta');
  const MAX_ALTERNATIVAS_MULTIPLA=10;
  let extraAlternativasMultipla=0;
  function renderEditorTipo(manterValoresDigitados){
    if(!tipoEditor)return;
    const tipo=tipoSelect.value;
    if(tipo==='multipla'){
      const camposAtuais=manterValoresDigitados ? [...tipoEditor.querySelectorAll('[id^="pg-opcao-"]')].sort((a,b)=>Number(a.id.split('-').pop())-Number(b.id.split('-').pop())).map(el=>el.value) : null;
      const correntaDigitada=manterValoresDigitados ? Number(tipoEditor.querySelector('input[name="pg-correta"]:checked')?.value) : NaN;
      const ops=camposAtuais || (Array.isArray(editando?.opcoes)?editando.opcoes:[]);
      const correntaSalva=(editando?.tipo||'multipla')==='multipla' ? Number(editando?.respostaCorreta) : NaN;
      const correntaAtual=Number.isFinite(correntaDigitada) ? correntaDigitada : correntaSalva;
      const qtdCampos=Math.min(MAX_ALTERNATIVAS_MULTIPLA, Math.max(4, ops.filter(o=>o&&String(o).trim()).length, Number.isFinite(correntaAtual)?correntaAtual+1:0, 4+extraAlternativasMultipla));
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Alternativas — marque a correta</label>
        ${[...Array(qtdCampos).keys()].map(i=>`<div class="opcao-row">
          <span class="letra">${String.fromCharCode(65+i)})</span>
          <input type="radio" name="pg-correta" value="${i}" ${correntaAtual===i?'checked':(i===0&&!Number.isFinite(correntaAtual)?'checked':'')} />
          <input type="text" id="pg-opcao-${i}" placeholder="Alternativa ${String.fromCharCode(65+i)}" value="${esc(ops[i]||'')}" required />
        </div>`).join('')}
        ${qtdCampos<MAX_ALTERNATIVAS_MULTIPLA ? '<button type="button" id="btn-add-alternativa" class="btn ghost small" style="margin-top:8px;">+ Adicionar alternativa</button>' : `<small class="muted">Limite de ${MAX_ALTERNATIVAS_MULTIPLA} alternativas atingido.</small>`}
      </div>`;
      const btnAddAlternativa=document.getElementById('btn-add-alternativa');
      if(btnAddAlternativa) btnAddAlternativa.addEventListener('click', ()=>{
        extraAlternativasMultipla++;
        renderEditorTipo(true);
      });
    }else if(tipo==='texto'){
      const aceitas=Array.isArray(editando?.respostasAceitas)&&editando.respostasAceitas.length ? editando.respostasAceitas : [editando?.respostaTexto||''];
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Resposta correta</label>
        <textarea id="pg-resposta-texto" class="texto-resposta" placeholder="Ex.: Vitória&#10;Vitória - ES&#10;vitória">${esc(aceitas.join('\n'))}</textarea>
        <small class="muted">Você pode colocar várias respostas aceitas, uma por linha. A correção ignora maiúsculas, acentos e espaços extras.</small>
      </div>`;
    }else if(tipo==='verdadeiro_falso'){
      const rc=Number(editando?.respostaCorreta||0);
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Resposta correta</label>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <label class="opcao"><input type="radio" name="pg-vf" value="0" ${rc===0?'checked':''}/> Verdadeiro</label>
          <label class="opcao"><input type="radio" name="pg-vf" value="1" ${rc===1?'checked':''}/> Falso</label>
        </div>
      </div>`;
    }else if(tipo==='vf_afirmacoes'){
      let lista = manterValoresDigitados && tipoEditor.querySelector('.vf-ed-row')
        ? [...tipoEditor.querySelectorAll('.vf-ed-row')].map(r=>({texto:r.querySelector('input[type=text]').value, correta:Number(r.querySelector('input[type=radio]:checked')?.value ?? 0)}))
        : (Array.isArray(editando?.afirmacoes)&&editando.afirmacoes.length ? editando.afirmacoes.map(a=>({texto:a.texto,correta:Number(a.correta)})) : Array.from({length:4},()=>({texto:'',correta:0})));
      if (tipoEditor.dataset.vfAdd){ lista.push({texto:'',correta:0}); delete tipoEditor.dataset.vfAdd; }
      if (tipoEditor.dataset.vfDel!==undefined && tipoEditor.dataset.vfDel!==''){ lista.splice(Number(tipoEditor.dataset.vfDel),1); delete tipoEditor.dataset.vfDel; }
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Afirmações — marque se cada uma é verdadeira (V) ou falsa (F)</label>
        ${lista.map((a,i)=>`<div class="opcao-row vf-ed-row">
          <span class="letra">${i+1})</span>
          <input type="text" placeholder="Digite a afirmação ${i+1}" value="${esc(a.texto||'')}" />
          <label class="vf-radio"><input type="radio" name="vf-ed-${i}" value="0" ${Number(a.correta)===0?'checked':''}/> V</label>
          <label class="vf-radio"><input type="radio" name="vf-ed-${i}" value="1" ${Number(a.correta)===1?'checked':''}/> F</label>
          ${lista.length>2?`<button type="button" class="btn ghost small" data-vf-del="${i}" title="Remover">✕</button>`:''}
        </div>`).join('')}
        ${lista.length<10?'<button type="button" id="btn-add-afirmacao" class="btn ghost small" style="margin-top:8px;">+ Adicionar afirmação</button>':'<small class="muted">Limite de 10 afirmações.</small>'}
        <small class="muted" style="display:block;margin-top:6px;">O aluno marca V ou F em cada afirmação e só acerta a questão se acertar todas.</small>
      </div>`;
      document.getElementById('btn-add-afirmacao')?.addEventListener('click',()=>{ tipoEditor.dataset.vfAdd='1'; renderEditorTipo(true); });
      tipoEditor.querySelectorAll('[data-vf-del]').forEach(b=>b.addEventListener('click',()=>{ tipoEditor.dataset.vfDel=b.dataset.vfDel; renderEditorTipo(true); }));
    }else if(tipo==='multipla_selecao'){
      const ops=Array.isArray(editando?.opcoes)?editando.opcoes:[];
      const corretas=Array.isArray(editando?.respostasCorretas)?editando.respostasCorretas.map(Number):[];
      const maxCorreta=corretas.length?Math.max(...corretas):-1;
      const qtdCampos=Math.max(4, ops.filter(o=>o&&String(o).trim()).length, maxCorreta+1);
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Alternativas — marque todas as corretas</label>
        ${[...Array(qtdCampos).keys()].map(i=>`<div class="opcao-row">
          <span class="letra">${String.fromCharCode(65+i)})</span>
          <input type="checkbox" name="pg-correta-multi" value="${i}" ${(editando?.tipo==='multipla_selecao'&&corretas.includes(i))?'checked':''} />
          <input type="text" id="pg-opcao-${i}" placeholder="Alternativa ${String.fromCharCode(65+i)}" value="${esc(ops[i]||'')}" required />
        </div>`).join('')}
        ${qtdCampos>4 ? '<small class="muted">Esta pergunta já tinha mais de 4 alternativas. Novas perguntas usam A a D por padrão.</small>' : '<small class="muted">O aluno só acerta a questão selecionando exatamente as alternativas marcadas aqui.</small>'}
      </div>`;
    }else if(tipo==='ordenacao'){
      const itens=Array.isArray(editando?.itens)&&editando.itens.length ? editando.itens : ['','','',''];
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Itens — digite já na ordem correta (do 1º ao último)</label>
        ${itens.map((val,i)=>`<div class="opcao-row">
          <span class="letra">${i+1}º</span>
          <input type="text" id="pg-item-${i}" placeholder="Item ${i+1}" value="${esc(val||'')}" required />
        </div>`).join('')}
        <small class="muted">O aluno verá os itens embaralhados e precisará reorganizá-los nesta mesma sequência.</small>
      </div>`;
    }else{
      const pares=Array.isArray(editando?.pares)&&editando.pares.length ? editando.pares : Array.from({length:4},()=>({esquerda:'',direita:'',correta:0}));
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Associação — ligue cada bloco à sua respectiva localidade</label>
        <div class="matching-row" style="font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);"><strong>Bloco / item</strong><strong>Localidade / correspondência</strong></div>
        ${[0,1,2,3].map(i=>{
          const par=pares[i]||{esquerda:'',direita:'',correta:0};
          return `<div class="matching-row">
            <input type="text" id="pg-esq-${i}" placeholder="Ex.: Amazônia" value="${esc(par.esquerda||'')}" required />
            <input type="text" id="pg-dir-${i}" placeholder="Ex.: Região Norte" value="${esc(par.direita||'')}" required />
          </div>`;
        }).join('')}
        <div class="field" style="margin-top:12px;">
          <label class="field-label">Correspondências corretas</label>
          ${[0,1,2,3].map(i=>`<div class="matching-grid">
            <span class="matching-label">Item ${i+1}</span>
            <select id="pg-corr-${i}">
              ${[0,1,2,3].map(j=>`<option value="${j}" ${Number(pares[i]?.correta??i)===j?'selected':''}>Localidade ${j+1}</option>`).join('')}
            </select>
          </div>`).join('')}
        </div>
        <small class="muted">Exemplo: bloco “Amazônia” → “Região Norte”. No aluno, as opções aparecerão em menus para ligar cada bloco à sua correspondência.</small>
      </div>`;
    }
  }
  tipoSelect?.addEventListener('change', ()=>{ extraAlternativasMultipla=0; renderEditorTipo(); });
  renderEditorTipo();

  function sincronizarMetadadosResultado(perguntaId, descritor, habilidade){
    state.resultados = state.resultados.map(r=>{
      if(!Array.isArray(r.detalhes)) return r;
      let mudou=false;
      const detalhes=r.detalhes.map(d=>{
        if(d.perguntaId!==perguntaId) return d;
        if((d.descritor||'')===descritor && (d.habilidade||'')===habilidade) return d;
        mudou=true;
        return {...d, descritor, habilidade};
      });
      return mudou ? {...r, detalhes} : r;
    });
  }

  const form = document.getElementById('form-pergunta');
  if (form) form.querySelectorAll('input[type="text"], input[type="number"]').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if (e.key === 'Enter') e.preventDefault();
    });
  });
  if (form) form.addEventListener('submit', async e=>{
    e.preventDefault();
    const enunciado = (rteEnun?rteEnun.getTexto():document.getElementById('pg-enunciado').value).trim();
    const tipo = tipoSelect.value;
    const descritor = document.getElementById('pg-descritor').value.trim();
    const habilidade = document.getElementById('pg-habilidade')?.value.trim() || '';
    const textoApoio = (rteApoio?rteApoio.getTexto():(document.getElementById('pg-texto-apoio')?.value||'')).trim();
    const enunciadoHtml = rteEnun ? rteEnun.getHtml() : '';
    const textoApoioHtml = (rteApoio && textoApoio) ? rteApoio.getHtml() : '';
    if (!enunciado) { toast('Escreva o enunciado da pergunta antes de salvar.'); return; }
    const fotos = Array.isArray(state.novaPerguntaFotos) ? [...state.novaPerguntaFotos] : fotosDaPergunta(editando);
    const payload = {simuladoId:state.perguntasFiltroSimuladoId,enunciado,enunciadoHtml,textoApoio,textoApoioHtml,tipo,descritor,habilidade,fotos,foto:fotos[0]||'',criadoEm:editando?.criadoEm||Date.now()};
    if(tipo==='multipla'){
      const camposOpcao=[...form.querySelectorAll('[id^="pg-opcao-"]')].sort((a,b)=>Number(a.id.split('-').pop())-Number(b.id.split('-').pop()));
      const opcoes=camposOpcao.map(el=>el.value.trim());
      const correta=Number(form.querySelector('input[name="pg-correta"]:checked')?.value);
      if(opcoes.some(o=>!o) || !Number.isFinite(correta)) return;
      Object.assign(payload,{opcoes,respostaCorreta:correta});
    }else if(tipo==='texto'){
      const respostasAceitas=document.getElementById('pg-resposta-texto').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      if(!respostasAceitas.length)return;
      Object.assign(payload,{opcoes:[],respostaTexto:respostasAceitas[0],respostasAceitas,respostaCorreta:null});
    }else if(tipo==='verdadeiro_falso'){
      const correta=Number(form.querySelector('input[name="pg-vf"]:checked')?.value);
      if(!Number.isFinite(correta))return;
      Object.assign(payload,{opcoes:['Verdadeiro','Falso'],respostaCorreta:correta});
    }else if(tipo==='vf_afirmacoes'){
      const afirmacoes=[...form.querySelectorAll('.vf-ed-row')].map(r=>({texto:r.querySelector('input[type=text]').value.trim(),correta:Number(r.querySelector('input[type=radio]:checked')?.value ?? 0)})).filter(a=>a.texto);
      if(afirmacoes.length<2){ toast('Escreva ao menos 2 afirmações.'); return; }
      Object.assign(payload,{opcoes:[],afirmacoes,respostaCorreta:null});
    }else if(tipo==='multipla_selecao'){
      const camposOpcao=[...form.querySelectorAll('[id^="pg-opcao-"]')].sort((a,b)=>Number(a.id.split('-').pop())-Number(b.id.split('-').pop()));
      const opcoes=camposOpcao.map(el=>el.value.trim());
      const respostasCorretas=[...form.querySelectorAll('input[name="pg-correta-multi"]:checked')].map(el=>Number(el.value));
      if(opcoes.some(o=>!o) || !respostasCorretas.length){ toast('Marque ao menos uma alternativa correta.'); return; }
      Object.assign(payload,{opcoes,respostasCorretas,respostaCorreta:null});
    }else if(tipo==='ordenacao'){
      const itens=[0,1,2,3].map(i=>document.getElementById(`pg-item-${i}`).value.trim());
      if(itens.some(x=>!x))return;
      Object.assign(payload,{opcoes:[],itens,respostaCorreta:null});
    }else{
      const pares=[0,1,2,3].map(i=>({
        esquerda:document.getElementById(`pg-esq-${i}`).value.trim(),
        direita:document.getElementById(`pg-dir-${i}`).value.trim(),
        correta:Number(document.getElementById(`pg-corr-${i}`).value)
      }));
      if(pares.some(x=>!x.esquerda||!x.direita||!Number.isFinite(x.correta)))return;
      Object.assign(payload,{opcoes:[],pares,respostaCorreta:null});
    }
    if (state.editingPerguntaId){
      const pergunta=state.perguntas.find(p=>p.id===state.editingPerguntaId);
      if(!pergunta)return;
      Object.assign(pergunta,payload);
      sincronizarMetadadosResultado(pergunta.id, descritor, habilidade);
      state.editingPerguntaId=null;
    }else{
      state.perguntas.push({id:uid(),...payload});
    }
    state.novaPerguntaFotos=null;
    await salvarDados();
    render();
  });

  const cancelBtn = document.getElementById('btn-cancelar-edicao');
  if (cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingPerguntaId=null; state.novaPerguntaFotos=null; render(); });

  content.querySelectorAll('[data-action="edit-pergunta"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.editingPerguntaId = el.dataset.id; state.novaPerguntaFotos = null; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  });
  content.querySelectorAll('[data-action="del-pergunta"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.id;
      if (!confirm('Excluir esta pergunta? Ela também deixará de aparecer nos relatórios.')) return;
      state.perguntas = state.perguntas.filter(p=>p.id!==id);
      
      state.resultados = state.resultados.map(r=>{
        if(!Array.isArray(r.detalhes)) return r;
        const detalhes=r.detalhes.filter(d=>d.perguntaId!==id);
        const acertos=somaPontos(detalhes);
        const total=detalhes.length;
        return {...r,detalhes,acertos,total,nota:total?Number((acertos/total*10).toFixed(1)):0};
      });
      salvarDados();
      toast('Pergunta excluída.');
      render();
    });
  });
}

function notaClasse(nota){ const n=Number(nota)||0; return n>=7?'alta':n>=5?'media':'baixa'; }
function letraOpcao(i){ return String.fromCharCode(65+Number(i)); }
function pctCor(p){ return p==null?'var(--ink-soft)':corPorDificuldade(p); }

function tentativasConsideradas(resultados, modo){
  if(modo==='todas') return resultados;
  const por=new Map();
  resultados.forEach(r=>{
    const atual=por.get(r.alunoId);
    if(!atual){ por.set(r.alunoId,r); return; }
    const melhor = modo==='ultima' ? (r.data||0)>(atual.data||0) : (Number(r.nota)||0)>(Number(atual.nota)||0);
    if(melhor) por.set(r.alunoId,r);
  });
  return [...por.values()];
}
function detalheDaPergunta(r, perguntaId){ return (r.detalhes||[]).find(d=>d.perguntaId===perguntaId); }

function rotuloRespostaCurto(p, d){
  const tipo=p.tipo||'multipla';
  const r=d.respostaAluno;
  if(r===undefined||r===null||r==='') return 'em branco';
  if(tipo==='multipla'){ const i=Number(r); return letraOpcao(i)+') '+String(p.opcoes?.[i]||''); }
  if(tipo==='verdadeiro_falso') return Number(r)===0?'Verdadeiro':'Falso';
  if(tipo==='vf_afirmacoes') return Array.isArray(r)?r.map(v=>v===0?'V':v===1?'F':'–').join(' '):'em branco';
  if(tipo==='multipla_selecao') return Array.isArray(r)&&r.length ? r.map(Number).sort().map(letraOpcao).join(', ') : 'em branco';
  if(tipo==='texto') return String(r);
  if(tipo==='ordenacao') return 'ordem incorreta';
  return 'associação incorreta';
}

function dadosSimuladoResultados(){
  const sim=state.simulados.find(s=>s.id===state.resultadosFiltroSimuladoId);
  if(!sim) return null;
  const perguntas=perguntasDoSimulado(sim.id);
  const todas=resultadosDoRelatorioAtual(state.resultadosFiltroTurmaId).filter(r=>r.simuladoId===sim.id);
  const validas=todas.filter(r=>!r.trocaAba);
  const consideradas=tentativasConsideradas(validas, state.resultadosConsiderar||'todas');
  return {sim, perguntas, todas, validas, consideradas, encerradasPorAba: todas.length-validas.length};
}
function estatisticaPergunta(p, consideradas){
  const respostas=consideradas.map(r=>({r, d:detalheDaPergunta(r,p.id)})).filter(x=>x.d);
  const total=respostas.length;
  const acertos=Math.round(respostas.reduce((a,x)=>a+pontosDe(x.d),0)*100)/100;
  return {p, respostas, total, acertos, pct: total?Math.round(acertos/total*100):null};
}

function distribuicaoPergunta(s){
  const p=s.p, tipo=p.tipo||'multipla', total=s.total;
  const pctDe=n=>total?Math.round(n/total*100):0;
  const linha=(letra,txt,n,certa)=>`<div class="opt-row ${certa?'certa':''}"><span class="opt-letra">${letra}</span><span class="opt-txt">${txt}${certa?' <span class="badge on">Correta</span>':''}</span><span class="opt-bar"><span style="width:${pctDe(n)}%"></span></span><span class="opt-num">${n} · ${pctDe(n)}%</span></div>`;
  if(tipo==='multipla'||tipo==='verdadeiro_falso'){
    const opcoes=tipo==='verdadeiro_falso'?['Verdadeiro','Falso']:(Array.isArray(p.opcoes)?p.opcoes:[]);
    const cont=opcoes.map(()=>0); let branco=0;
    s.respostas.forEach(x=>{
      const r=x.d.respostaAluno;
      if(r===undefined||r===null||r==='') branco++;
      else if(cont[Number(r)]!==undefined) cont[Number(r)]++;
    });
    const correta=Number(p.respostaCorreta);
    return opcoes.map((op,i)=>linha(tipo==='verdadeiro_falso'?(i===0?'V':'F'):letraOpcao(i), esc(op), cont[i], i===correta)).join('')
      + (branco?linha('–','<span class="muted">Em branco</span>',branco,false):'');
  }
  if(tipo==='vf_afirmacoes'){
    const af=Array.isArray(p.afirmacoes)?p.afirmacoes:[];
    return `<p class="muted" style="font-size:12.5px;margin:0 0 6px;">Quantos alunos acertaram cada afirmação (a questão só conta como certa com todas corretas).</p>`
      + af.map((a,i)=>{ const n=s.respostas.filter(x=>Array.isArray(x.d.respostaAluno)&&Number(x.d.respostaAluno[i])===Number(a.correta)&&(x.d.respostaAluno[i]===0||x.d.respostaAluno[i]===1)).length;
        return linha(Number(a.correta)===0?'V':'F', esc(a.texto), n, true); }).join('');
  }
  if(tipo==='multipla_selecao'){
    const opcoes=Array.isArray(p.opcoes)?p.opcoes:[]; const certas=(p.respostasCorretas||[]).map(Number);
    const cont=opcoes.map(()=>0);
    s.respostas.forEach(x=>{ (Array.isArray(x.d.respostaAluno)?x.d.respostaAluno:[]).map(Number).forEach(i=>{ if(cont[i]!==undefined) cont[i]++; }); });
    return `<p class="muted" style="font-size:12.5px;margin:0 0 6px;">Quantos alunos marcaram cada alternativa. A questão só conta como certa com exatamente as corretas marcadas.</p>`
      + opcoes.map((op,i)=>linha(letraOpcao(i), esc(op), cont[i], certas.includes(i))).join('');
  }
  if(tipo==='texto'){
    const grupos=new Map();
    s.respostas.forEach(x=>{
      const bruto=String(x.d.respostaAluno??'').trim()||'(em branco)';
      const k=normalizarRespostaTexto(bruto)||'(em branco)';
      const g=grupos.get(k)||{txt:bruto,n:0,ok:!!x.d.acertou};
      g.n++; grupos.set(k,g);
    });
    const lista=[...grupos.values()].sort((a,b)=>b.n-a.n).slice(0,10);
    const esperado=(Array.isArray(p.respostasAceitas)&&p.respostasAceitas.length?p.respostasAceitas:[p.respostaTexto||'']).join(' / ');
    return `<p class="muted" style="font-size:12.5px;margin:0 0 6px;">Resposta esperada: <strong>${esc(esperado)}</strong></p>`
      + lista.map(g=>linha(g.ok?'✓':'✕', esc(g.txt), g.n, g.ok)).join('');
  }
  if(tipo==='ordenacao'){
    return `<p class="muted" style="font-size:12.5px;margin:0 0 6px;">Ordem correta:</p><ol style="margin:0;padding-left:20px;">${(p.itens||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`;
  }
  if(tipo==='associacao'){
    const pares=Array.isArray(p.pares)?p.pares:[];
    return `<p class="muted" style="font-size:12.5px;margin:0 0 6px;">Associações corretas:</p>`+pares.map(par=>`<div style="padding:3px 0;"><strong>${esc(par.esquerda)}</strong> → ${esc(pares[Number(par.correta)]?.direita||'')}</div>`).join('');
  }
  return '';
}

  return `<details class="q-card" id="q-card-${s.num-1}" style="--q-cor:${cor}">

        <span class="q-bar"><span style="width:${s.pct||0}%;background:${cor}"></span></span>

    </summary>
    <div class="q-corpo">
      ${p.textoApoio?`<div class="texto-apoio">${htmlRico(p.textoApoio,p.textoApoioHtml)}</div>`:''}
      ${p.enunciadoHtml?`<div class="rte-out" style="margin:0 0 10px;">${htmlRico(p.enunciado,p.enunciadoHtml)}</div>`:''}
      ${foto?`<div class="question-photo"><img src="${foto}" alt="Imagem da questão ${s.num}" /></div>`:''}
      ${s.total?distribuicaoPergunta(s):'<p class="muted">Ninguém respondeu esta questão ainda.</p>'}
      <div class="q-who">

        <div><h5>Erraram ou acertaram em parte (${errados.length})</h5><div class="chips">${errados.length?errados.map(x=>chip(x,'no')).join(''):'<span class="muted">Ninguém</span>'}</div></div>
      </div>
    </div>
  </details>`;
}

function limparTentativaSalva(alunoId, simuladoId){
  try{
    const salvo=JSON.parse(localStorage.getItem('estadoSite')||'null');
    if(salvo && salvo.quizSimuladoId===simuladoId){
      Object.assign(salvo,{quizSimuladoId:null,quizRespostas:{},quizPerguntaIds:[],quizFimEm:null,quizIniciadoEm:null,quizOrdemOpcoes:{},quizResultado:null});
      localStorage.setItem('estadoSite',JSON.stringify(salvo));
    }
  }catch(_){ }
  if(state.alunoAuthed?.id===alunoId && state.quizSimuladoId===simuladoId){
    Object.assign(state,{quizSimuladoId:null,quizRespostas:{},quizPerguntaIds:[],quizFimEm:null,quizIniciadoEm:null,quizOrdemOpcoes:{},quizResultado:null});
  }
}
async function excluirTentativaPorId(id, modo){
  const r=state.resultados.find(x=>x.id===id);
  if(!r) return;
  const msg = modo==='reset'
    ? `Resetar a tentativa de ${r.alunoNome} no simulado "${r.simuladoTitulo}"? O registro será removido e o aluno poderá tentar de novo, se houver tentativas disponíveis.`
    : `Excluir permanentemente a tentativa de ${r.alunoNome} no simulado "${r.simuladoTitulo}"?`;
  if(!confirm(msg)) return;
  state.resultados=state.resultados.filter(x=>x.id!==id);
  limparTentativaSalva(r.alunoId,r.simuladoId);
  await salvarDados();
  render();
}

    <div class="card res-toolbar no-print">
      <div class="field"><label class="field-label" for="res-turma">Turma</label>
        <select id="res-turma"><option value="todas" ${state.resultadosFiltroTurmaId==='todas'?'selected':''}>Todas as turmas</option>${state.turmas.map(t=>`<option value="${t.id}" ${t.id===state.resultadosFiltroTurmaId?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></div>
      ${view!=='aluno'?`<div class="field"><label class="field-label" for="res-simulado">Simulado</label>
        <select id="res-simulado">${precisaSimulado?'':`<option value="todos" ${state.resultadosFiltroSimuladoId==='todos'?'selected':''}>Todos os simulados</option>`}${sims.length===0&&precisaSimulado?'<option value="">Nenhum simulado</option>':''}${sims.map(s=>`<option value="${s.id}" ${s.id===state.resultadosFiltroSimuladoId?'selected':''}>${esc(s.titulo)} · ${esc(s.conteudo||'Geral')}</option>`).join('')}</select></div>`:''}
      ${precisaSimulado?`<div class="field"><label class="field-label" for="res-considerar">Tentativas consideradas</label>
        <select id="res-considerar"><option value="todas" ${state.resultadosConsiderar==='todas'?'selected':''}>Todas as tentativas</option><option value="ultima" ${state.resultadosConsiderar==='ultima'?'selected':''}>Última de cada aluno</option><option value="melhor" ${state.resultadosConsiderar==='melhor'?'selected':''}>Melhor de cada aluno</option></select></div>`:''}
    </div>
    <div class="subtabs no-print" style="margin-bottom:18px;">${views.map(v=>`<button type="button" data-rview="${v.id}" class="${view===v.id?'active':''}">${v.label}</button>`).join('')}</div>
    <div id="resultados-inner"></div>`;

  const salvarPref=()=>{
    if(papelAtual()==='professor'&&state.professorAuthed){
      state.preferenciasProfessores=state.preferenciasProfessores||{};
      state.preferenciasProfessores[state.professorAuthed.id]={...(state.preferenciasProfessores[state.professorAuthed.id]||{}),resultadosFiltroTurmaId:state.resultadosFiltroTurmaId};
      salvarDados();
    }
  };
  document.getElementById('res-turma').addEventListener('change',e=>{ state.resultadosFiltroTurmaId=e.target.value; state.resultadosFiltroAlunoId=null; salvarPref(); render(); });
  document.getElementById('res-simulado')?.addEventListener('change',e=>{ state.resultadosFiltroSimuladoId=e.target.value; render(); });
  document.getElementById('res-considerar')?.addEventListener('change',e=>{ state.resultadosConsiderar=e.target.value; render(); });
  content.querySelectorAll('[data-rview]').forEach(b=>b.addEventListener('click',()=>{ state.resultadosView=b.dataset.rview; render(); }));

  const inner=document.getElementById('resultados-inner');
  if(view==='aluno') renderResultadosPorAluno(inner);
  else if(view==='geral') renderResultadosGeral(inner);
  else if(view==='tentativas') renderResultadosTentativas(inner);
  else if(view==='mapa') renderResultadosMapa(inner);
  else renderResultadosPorPergunta(inner);
}


function barraPct(p, altura){
  return `<span class="mini-bar" style="${altura?'height:'+altura+'px;':''}"><span style="width:${Math.max(0,Math.min(100,p))}%;background:${pctCor(p)}"></span></span>`;
}
function renderResultadosGeral(content){
  const filtro = state.resultadosFiltroSimuladoId;
  const filtroTurma = state.resultadosFiltroTurmaId;
  let resultados = resultadosDoRelatorioAtual('todas').filter(r=>!r.trocaAba);
  if (filtroTurma!=='todas') {
    const idsTurma = new Set(alunosFiltradosPorTurma(filtroTurma).map(a=>a.id));
    resultados = resultados.filter(r=>idsTurma.has(r.alunoId));
  }
  if (filtro!=='todos') resultados = resultados.filter(r=>r.simuladoId===filtro);
  if (!resultados.length){ content.innerHTML = emptyReport('Ainda não há resultados com estes filtros. Quando os alunos concluírem um simulado, o resumo aparece aqui.'); return; }

  const pergMapa = new Map(state.perguntas.map(p=>[p.id,p]));
  const simMapa = new Map(state.simulados.map(s=>[s.id,s]));
  const pct = (a,t)=> t? Math.round(a/t*100) : 0;
  const agg = agregarResultados(resultados);
  const totalAc = resultados.reduce((a,r)=>a+r.acertos,0), totalQ = resultados.reduce((a,r)=>a+r.total,0);
  const media = pct(totalAc,totalQ);
  const alunos = Object.entries(agg.porAluno).map(([id,v])=>({id,nome:v.nome,tent:v.tentativas,pct:pct(v.acertos,v.total),nota:v.total? v.acertos/v.total*10:0})).sort((a,b)=>b.pct-a.pct||a.nome.localeCompare(b.nome,'pt-BR'));
  const precisamAjuda = alunos.filter(a=>a.pct<50).sort((a,b)=>a.pct-b.pct);
  const destaques = alunos.filter(a=>a.pct>=70).slice(0,5);
  const perguntas = Object.entries(agg.porPergunta).map(([k,v])=>({...v, pid:k.split('||')[0], acerto:pct(v.total-v.erros,v.total)})).sort((a,b)=>a.acerto-b.acerto);
  const criticas = perguntas.filter(p=>p.acerto<50);
  const status = media>=70 ? {txt:'Bom desempenho',cls:'ok',msg:'A maior parte dos acertos está acima do esperado.'}
               : media>=50 ? {txt:'Desempenho médio',cls:'med',msg:'Há espaço para melhorar — veja abaixo onde estão os erros.'}
               : {txt:'Precisa de atenção',cls:'baixo',msg:'Muitos erros. Vale revisar o conteúdo com a turma.'};
  const sims = Object.entries(agg.porSimulado).map(([id,v])=>({id,titulo:v.titulo,tent:v.tentativas,pct:pct(v.acertos,v.total),conteudo:simMapa.get(id)?.conteudo||''})).sort((a,b)=>a.pct-b.pct);
  const habilidades = Object.entries(agg.porHabilidade).filter(([h])=>h!=='Sem habilidade').map(([h,v])=>({h,erro:pct(v.erros,v.total),n:v.total})).filter(x=>x.erro>0).sort((a,b)=>b.erro-a.erro).slice(0,8);
  const descritores = Object.entries(agg.porDescritor).filter(([d])=>d!=='Sem descritor').map(([d,v])=>({d,acerto:pct(v.total-v.erros,v.total),n:v.total})).sort((a,b)=>a.acerto-b.acerto);

  const PESO={muito_facil:1,facil:2,medio:3,dificil:4,muito_dificil:5};
  const ROT={muito_facil:'Muito fácil',facil:'Fácil',medio:'Médio',dificil:'Difícil',muito_dificil:'Muito difícil'};
  const avaliados = resultados.filter(r=>r.avaliacao&&r.avaliacao.dificuldade);
  const comentarios = avaliados.filter(r=>r.avaliacao.comentario).sort((a,b)=>(b.avaliacao.enviadaEm||0)-(a.avaliacao.enviadaEm||0)).slice(0,6);

  content.innerHTML = `
    <div class="ger-hero ${status.cls}">
      <div class="ger-anel" style="--p:${media}"><b>${media}%</b><small>de acertos</small></div>
      <div class="ger-hero-txt">
        <h3>${status.txt}</h3>
        <p>${status.msg}</p>
        <div class="ger-nums">
          <span><b>${alunos.length}</b> aluno(s)</span><span><b>${resultados.length}</b> tentativa(s)</span>
          <span><b>${perguntas.length}</b> pergunta(s) analisadas</span>${criticas.length?`<span class="alerta"><b>${criticas.length}</b> com menos de 50% de acerto</span>`:''}
        </div>
      </div>
    </div>
    <div class="ger-legenda no-print"><span><i style="background:var(--alert)"></i> abaixo de 50%</span><span><i style="background:var(--ochre)"></i> 50% a 69%</span><span><i style="background:var(--pine)"></i> 70% ou mais</span></div>

    <div class="ger-sec"><h3>Perguntas que mais precisam de atenção</h3><p>As questões com menor % de acerto. Clique para ver, pergunta por pergunta, o que os alunos marcaram.</p></div>
    <div class="card ger-card">
      ${perguntas.slice(0,6).map(p=>`<button type="button" class="ger-linha" data-ir-sim="${pergMapa.get(p.pid)?.simuladoId||''}">
        <span class="ger-enun">${esc(p.enunciado)}${p.descritor?` <span class="badge on">${esc(p.descritor)}</span>`:''}</span>
        ${barraPct(p.acerto)}<span class="ger-pct" style="color:${pctCor(p.acerto)}">${p.acerto}%</span><span class="ger-sub">${p.total-p.erros}/${p.total}</span>
      </button>`).join('')}
    </div>

    <div class="ger-sec"><h3>Alunos</h3><p>Quem precisa de ajuda e quem está se destacando (média de acertos em todas as tentativas).</p></div>
    <div class="ger-duas">
      <div class="card ger-card ger-caixa baixo"><h4>Precisam de ajuda <small>(abaixo de 50%)</small></h4>
        ${precisamAjuda.length?precisamAjuda.map(a=>`<div class="ger-aluno"><span>${esc(a.nome)}</span><b style="color:var(--alert)">${a.pct}%</b></div>`).join(''):'<p class="muted" style="margin:6px 0 0;">Nenhum aluno abaixo de 50%. Ótimo sinal!</p>'}
      </div>
      <div class="card ger-card ger-caixa ok"><h4>Destaques <small>(70% ou mais)</small></h4>
        ${destaques.length?destaques.map(a=>`<div class="ger-aluno"><span>${esc(a.nome)}</span><b style="color:var(--pine)">${a.pct}%</b></div>`).join(''):'<p class="muted" style="margin:6px 0 0;">Ainda ninguém chegou a 70%.</p>'}
      </div>
    </div>
    <details class="ger-todos card ger-card"><summary>Ver ranking completo (${alunos.length})</summary>
      ${alunos.map((a,i)=>`<div class="ger-linha estatica"><span class="ger-pos">${i+1}º</span><span class="ger-enun">${esc(a.nome)} <small class="muted">· ${a.tent} tentativa(s)</small></span>${barraPct(a.pct)}<span class="ger-pct" style="color:${pctCor(a.pct)}">${a.pct}%</span><span class="ger-sub">nota ${a.nota.toFixed(1)}</span></div>`).join('')}
    </details>

    <div class="ger-sec"><h3>Por simulado</h3><p>Média de acertos de cada simulado. Clique para abrir pergunta por pergunta.</p></div>
    <div class="card ger-card">
      ${sims.map(s=>`<button type="button" class="ger-linha" data-ir-sim="${s.id}"><span class="ger-enun">${esc(s.titulo)}${s.conteudo?` <small class="muted">· ${esc(s.conteudo)}</small>`:''}</span>${barraPct(s.pct)}<span class="ger-pct" style="color:${pctCor(s.pct)}">${s.pct}%</span><span class="ger-sub">${s.tent} tentativa(s)</span></button>`).join('')}
    </div>

    ${(habilidades.length||descritores.length)?`
    <div class="ger-sec"><h3>Habilidades e descritores</h3><p>Mostra em quais conteúdos a turma mais erra, para você planejar a revisão.</p></div>
    <div class="ger-duas">
      <div class="card ger-card ger-caixa"><h4>Habilidades com mais erros</h4>
        ${habilidades.length?habilidades.map(h=>`<div class="ger-linha estatica"><span class="ger-enun">${esc(h.h)}</span>${barraPct(100-h.erro)}<span class="ger-pct" style="color:${pctCor(100-h.erro)}">${100-h.erro}%</span></div>`).join(''):'<p class="muted">Sem habilidades cadastradas nas perguntas.</p>'}
      </div>
      <div class="card ger-card ger-caixa"><h4>Descritores (do mais difícil ao mais fácil)</h4>
        ${descritores.length?descritores.slice(0,8).map(h=>`<div class="ger-linha estatica"><span class="ger-enun">${esc(h.d)}</span>${barraPct(h.acerto)}<span class="ger-pct" style="color:${pctCor(h.acerto)}">${h.acerto}%</span></div>`).join(''):'<p class="muted">Sem descritores cadastrados nas perguntas.</p>'}
      </div>
    </div>`:''}

    ${avaliados.length?`
    <div class="ger-sec"><h3>O que os alunos acharam</h3><p>${avaliados.length} de ${resultados.length} tentativa(s) foram avaliadas pelos alunos.</p></div>
    <div class="card ger-card">
      ${Object.keys(PESO).map(k=>{const q=avaliados.filter(r=>r.avaliacao.dificuldade===k).length;return `<div class="ger-linha estatica"><span class="ger-enun">${ROT[k]}</span><span class="mini-bar"><span style="width:${pct(q,avaliados.length)}%;background:var(--ochre)"></span></span><span class="ger-pct">${q}</span></div>`;}).join('')}
      ${comentarios.length?`<div class="ger-coment">${comentarios.map(r=>`<blockquote><p>“${esc(r.avaliacao.comentario)}”</p><small>${esc(r.alunoNome)} · ${esc(r.simuladoTitulo)}</small></blockquote>`).join('')}</div>`:''}
    </div>`:''}
  `;
  content.querySelectorAll('[data-ir-sim]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.irSim; if(!id) return;
    state.resultadosFiltroSimuladoId=id; state.resultadosView='questoes'; render();
  }));
}

function renderResultadosPorAluno(content){
  if (!state.resultadosFiltroAlunoId && state.alunos.length){
    state.resultadosFiltroAlunoId = state.alunos[0].id;
  }
  const alunosResultados = alunosFiltradosPorTurma(state.resultadosFiltroTurmaId);
  if (!state.resultadosFiltroAlunoId || !alunosResultados.some(a=>a.id===state.resultadosFiltroAlunoId)) state.resultadosFiltroAlunoId = alunosResultados[0]?.id || null;
  const aluno = alunosResultados.find(a=>a.id===state.resultadosFiltroAlunoId);
  const simIds = simuladoIdsVisiveis();
  const resultados = aluno ? state.resultados.filter(r=>r.alunoId===aluno.id && simIds.has(r.simuladoId)) : [];

  content.innerHTML = `
    <div class="grid-2">
        <div class="field" style="max-width:360px;">
      <label class="field-label">Selecionar aluno</label>
      <select id="select-aluno-resultados">
        ${alunosResultados.length===0?'<option value="">Nenhum aluno cadastrado</option>':''}
        ${alunosResultados.map(a=>`<option value="${a.id}" ${a.id===state.resultadosFiltroAlunoId?'selected':''}>${esc(a.nome)}</option>`).join('')}
      </select>
    </div></div>
    <div id="aluno-resultados-body"></div>
  `;

  const turmaSelect = document.getElementById('select-turma-resultados-aluno');
  if (turmaSelect) turmaSelect.addEventListener('change', ()=>{ state.resultadosFiltroTurmaId=turmaSelect.value; state.resultadosFiltroAlunoId=null; render(); });
  const select = document.getElementById('select-aluno-resultados');
  if (select) select.addEventListener('change', ()=>{
    state.resultadosFiltroAlunoId = select.value;
    render();
  });

  const body = document.getElementById('aluno-resultados-body');
  if (!aluno){
    body.innerHTML = `<div class="empty-state">Cadastre um aluno na aba "Alunos" para ver os resultados dele aqui.</div>`;
    return;
  }
  if (resultados.length === 0){
    body.innerHTML = `<div class="empty-state">${esc(aluno.nome)} ainda não fez nenhum simulado.</div>`;
    return;
  }

  const totalTentativas = resultados.length;
  const mediaAcertos = (resultados.reduce((acc,r)=>acc + (r.total? r.acertos/r.total : 0),0) / totalTentativas * 100);
  const baixoDesempenho = totalTentativas>0 && mediaAcertos < 50;

  const simuladosParaLiberar = simuladosVisiveis().filter(s=>s.maxTentativas>0);
  const extrasDoAluno = aluno.tentativasExtras || {};

  const porSimulado = {};
  resultados.forEach(r=>{
    if (!porSimulado[r.simuladoId]) porSimulado[r.simuladoId] = {titulo:r.simuladoTitulo, tentativas:[]};
    porSimulado[r.simuladoId].tentativas.push(r);
  });
  const simuladosResumo = Object.values(porSimulado).map(s=>{
    const ordenadas = [...s.tentativas].sort((a,b)=>b.data-a.data);
    const ultima = ordenadas[0];
    const melhor = [...s.tentativas].sort((a,b)=> (b.acertos/b.total) - (a.acertos/a.total))[0];
    return {titulo:s.titulo, qtd:s.tentativas.length, ultima, melhor};
  });

  const porDescritor = {};
  const porHabilidade = {};
  resultados.forEach(r=>{
    (r.detalhes||[]).forEach(d=>{
      const desc = d.descritor || 'Sem descritor';
      const hab = d.habilidade || 'Sem habilidade';
      if (!porDescritor[desc]) porDescritor[desc] = {erros:0, total:0};
      porDescritor[desc].total++; porDescritor[desc].erros+=1-pontosDe(d);
      if (!porHabilidade[hab]) porHabilidade[hab] = {erros:0,total:0};
      porHabilidade[hab].total++; porHabilidade[hab].erros+=1-pontosDe(d);
    });
  });
  const descritoresOrdenados = Object.entries(porDescritor)
    .map(([desc,v])=>({desc, ...v, pct: v.total? Math.round(v.erros/v.total*100):0}))
    .filter(d=>d.erros>0)
    .sort((a,b)=>b.pct-a.pct || b.erros-a.erros);

  body.innerHTML = `
    ${baixoDesempenho ? `<div class="card" style="padding:12px 18px;margin-bottom:14px;background:var(--alert-tint);border-color:var(--alert);">
      <strong style="color:var(--alert);">Desempenho baixo</strong>
      <span style="font-size:13px;"> — a média de acertos de ${esc(aluno.nome)} está em ${mediaAcertos.toFixed(0)}%, abaixo de 50%. Vale a pena um acompanhamento próximo.</span>
    </div>` : ''}
    <div class="stat-cards">
      <div class="card stat-card"><div class="num">${totalTentativas}</div><div class="lbl">Tentativas</div></div>
      <div class="card stat-card" style="${baixoDesempenho?'background:var(--alert-tint);':''}"><div class="num" style="${baixoDesempenho?'color:var(--alert);':''}">${mediaAcertos.toFixed(0)}%</div><div class="lbl">Média de acertos</div></div>
      <div class="card stat-card"><div class="num">${descritoresOrdenados.length}</div><div class="lbl">Descritores com erro</div></div>
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Liberar tentativa extra</h2></div>
    <div class="card" style="padding:16px 18px;margin-bottom:24px;">
      <p class="muted" style="font-size:12.5px;margin:0 0 10px;">Libera +1 tentativa somente para ${esc(aluno.nome)}, sem alterar o limite dos demais alunos.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
        <div class="field" style="max-width:320px;margin:0;">
          <label class="field-label">Simulado</label>
          <select id="select-simulado-tentativa-extra">
            ${simuladosParaLiberar.length===0?'<option value="">Nenhum simulado com limite de tentativas</option>':''}
            ${simuladosParaLiberar.map(s=>{
              const feitas = tentativasDoAluno(aluno.id, s.id);
              const extra = Number(extrasDoAluno[s.id])||0;
              return `<option value="${s.id}">${esc(s.titulo)} (${feitas}/${s.maxTentativas + extra} usadas${extra?`, +${extra} extra`:''})</option>`;
            }).join('')}
          </select>
        </div>
        <button class="btn pine" id="btn-liberar-tentativa-extra" type="button" ${simuladosParaLiberar.length===0?'disabled':''}>Liberar +1 tentativa</button>
      </div>
    </div>

    <div class="ger-sec"><h3>Simulados feitos por ${esc(aluno.nome)}</h3><p>Resumo por simulado. Abaixo, abra cada tentativa para ver o que ele acertou e errou.</p></div>
    <div class="card ger-card" style="margin-bottom:24px;">
      ${simuladosResumo.map(s=>{const p=s.melhor.total?Math.round(s.melhor.acertos/s.melhor.total*100):0;return `<div class="ger-linha estatica"><span class="ger-enun">${esc(s.titulo)} <small class="muted">· ${s.qtd} tentativa(s) · última em ${new Date(s.ultima.data).toLocaleDateString('pt-BR')}</small></span>${barraPct(p)}<span class="ger-pct" style="color:${pctCor(p)}">${p}%</span><span class="ger-sub">melhor: ${fmtPts(s.melhor.acertos)}/${s.melhor.total}</span></div>`;}).join('')}
    </div>

    <div class="section-head"><h2>Desempenho de ${esc(aluno.nome)} por descritor</h2></div>
    <div class="card" style="padding:18px;margin-bottom:24px;">
      ${blocosDescritores(Object.entries(porDescritor).map(([nome,v])=>({nome,erros:v.erros,total:v.total})))}
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Habilidades com mais dificuldade</h2></div>
    <div class="card" style="padding:8px 18px;margin-bottom:24px;">${rankingList(Object.entries(porHabilidade).map(([hab,v])=>({label:hab,value:v.total?Math.round(v.erros/v.total*100):0})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value),{color:'var(--accent)',emptyMsg:'Nenhum erro registrado — ótimo desempenho!'})}</div>

    <div class="ger-sec"><h3>Tentativas, pergunta por pergunta</h3><p>Clique numa tentativa para ver cada questão: ✓ acertou, ✕ errou (com a resposta dada e a correta).</p></div>
    <div class="card" style="padding:0;overflow:hidden;">
      ${[...resultados].sort((a,b)=>b.data-a.data).map(r=>`
        <details class="tent">
          <summary>
            <span class="tent-info"><h4>${esc(r.simuladoTitulo)}${r.trocaAba?' <span class="badge off">Saiu da aba</span>':''}</h4><p>${new Date(r.data).toLocaleString('pt-BR')} · ${fmtPts(r.acertos)}/${r.total} acertos</p></span>
            <span class="nota-pill ${notaClasse(r.nota)}">${Number(r.nota||0).toFixed(1)}</span>
          </summary>
          <div class="tent-body">
            ${(r.detalhes||[]).map((d,i)=>`<div class="tent-q"><p><span class="ico ${pontosDe(d)>=1?'ok':(pontosDe(d)>0?'par':'no')}">${pontosDe(d)>=1?'✓':(pontosDe(d)>0?'½':'✕')}</span><strong>${i+1}. ${esc(d.enunciado)}</strong></p>${(r.trocaAba||d.acertou)?'':resumoRespostaErro(d)}</div>`).join('')||'<p class="muted">Sem detalhes registrados.</p>'}
          </div>
        </details>`).join('')}
    </div>
  `;

  const btnLiberar = document.getElementById('btn-liberar-tentativa-extra');
  if (btnLiberar) btnLiberar.addEventListener('click', async ()=>{
    const simId = document.getElementById('select-simulado-tentativa-extra')?.value;
    const sim = state.simulados.find(s=>s.id===simId);
    if (!sim) return;
    if (!aluno.tentativasExtras) aluno.tentativasExtras = {};
    aluno.tentativasExtras[sim.id] = (Number(aluno.tentativasExtras[sim.id])||0) + 1;
    try{
      await salvarDados();
      toast(`+1 tentativa liberada para ${aluno.nome} em "${sim.titulo}".`);
      render();
    }catch(err){ console.error(err); toast('Não foi possível liberar a tentativa.'); }
  });
}

function agregarResultados(resultados){
  const porDescritor = {};
  const porHabilidade = {};
  const porPergunta = {};
  const porAluno = {};
  const porSimulado = {};
  const porMateriaAluno = {};
  const simMapa = new Map(state.simulados.map(s=>[s.id,s]));
  const pergMapa = new Map(state.perguntas.map(p=>[p.id,p]));
  resultados.forEach(r=>{
    if (!porAluno[r.alunoId]) porAluno[r.alunoId] = {nome:r.alunoNome, acertos:0, total:0, tentativas:0};
    porAluno[r.alunoId].acertos += r.acertos;
    porAluno[r.alunoId].total += r.total;
    porAluno[r.alunoId].tentativas++;
    const materia=simMapa.get(r.simuladoId)?.conteudo || 'Geral';
    if(!porMateriaAluno[materia])porMateriaAluno[materia]={};
    if(!porMateriaAluno[materia][r.alunoId])porMateriaAluno[materia][r.alunoId]={nome:r.alunoNome,acertos:0,total:0};
    porMateriaAluno[materia][r.alunoId].acertos+=r.acertos;
    porMateriaAluno[materia][r.alunoId].total+=r.total;
    if (!porSimulado[r.simuladoId]) porSimulado[r.simuladoId] = {titulo:r.simuladoTitulo, acertos:0, total:0, tentativas:0};
    porSimulado[r.simuladoId].acertos += r.acertos;
    porSimulado[r.simuladoId].total += r.total;
    porSimulado[r.simuladoId].tentativas++;
    (r.detalhes||[]).forEach(d=>{
      const p=pergMapa.get(d.perguntaId);
      const desc = p?.descritor || d.descritor || 'Sem descritor';
      const hab = p?.habilidade || d.habilidade || 'Sem habilidade';
      if (!porDescritor[desc]) porDescritor[desc] = {erros:0, total:0};
      porDescritor[desc].total++; porDescritor[desc].erros+=1-pontosDe(d);
      if (!porHabilidade[hab]) porHabilidade[hab] = {erros:0, total:0};
      porHabilidade[hab].total++; porHabilidade[hab].erros+=1-pontosDe(d);
      const key = d.perguntaId + '||' + d.enunciado;
      if (!porPergunta[key]) porPergunta[key] = {enunciado:p?.enunciado || d.enunciado, descritor:p?.descritor || d.descritor || '', habilidade:p?.habilidade || d.habilidade || '', erros:0, total:0};
      porPergunta[key].total++; porPergunta[key].erros+=1-pontosDe(d);
    });
  });
  return {porDescritor, porHabilidade, porPergunta, porAluno, porSimulado, porMateriaAluno};
}

function emptyReport(msg){
  return `<div class="empty-state">${esc(msg)}</div>`;
}

function corPorDificuldade(valor, modo='acerto'){
  const v = modo==='erro' ? (100-valor) : valor;
  if (v < 50) return 'var(--alert)';
  if (v < 70) return 'var(--ochre)';
  return 'var(--pine)';
}

function chartBarVertical(items, opts={}){
  if (!items.length) return emptyReport(opts.emptyMsg || 'Sem dados suficientes ainda.');
  const unit = opts.unit ?? '%';
  const max = opts.max ?? 100;
  const color = opts.color ?? 'var(--pine)';
  return `<div class="chart-bars-wrap" data-chart-scroll>
    <div class="chart-scroll-hint"><span>role para o lado para ver mais</span><span class="arrow">→</span></div>
    <div class="chart-bars">
    ${items.map(it=>{
      const pct = max ? Math.max(2, Math.round((it.value/max)*100)) : 0;
      const cor = it.color || (opts.colorize ? corPorDificuldade(it.value, opts.colorizeModo||'acerto') : color);
      const amostra = it.count!=null ? `<div class="chart-bar-n">n=${it.count}</div>` : '';
      const rotuloCompleto = it.title || it.label;
      return `
      <div class="chart-bar-col" title="${esc(rotuloCompleto)}: ${it.value}${unit}${it.count!=null?` (${it.count} resposta(s))`:''}">
        <div class="chart-bar-value">${it.value}${unit}</div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="height:${pct}%;background:${cor}"></div></div>
        ${amostra}
        <div class="chart-bar-label" data-full-label="${esc(rotuloCompleto)}">${esc(it.label)}</div>
      </div>`;
    }).join('')}
    </div>
  </div>`;
}

function svgLineChart(pontos){
  if (!pontos.length) return emptyReport('Sem dados suficientes ainda.');
  const w = 680, h = 240, padL = 40, padR = 16, padT = 16, padB = 34;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const n = pontos.length;
  const stepX = n>1 ? innerW/(n-1) : 0;
  const coords = pontos.map((p,i)=>{
    const x = padL + stepX*i;
    const y = padT + innerH - (Math.max(0,Math.min(100,p.value))/100)*innerH;
    return {x, y, ...p};
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${coords[coords.length-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${coords[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
  const grid = [0,25,50,75,100].map(v=>{
    const y = padT + innerH - (v/100)*innerH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--paper-line)" stroke-width="1"/><text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--ink-soft)" font-family="monospace">${v}</text>`;
  }).join('');
  const skip = Math.max(1, Math.ceil(n/12));
  const labels = coords.map((c,i)=> (i%skip===0 || i===n-1) ? `<text x="${c.x.toFixed(1)}" y="${h-10}" font-size="9" text-anchor="middle" fill="var(--ink-soft)" font-family="monospace">${esc(c.label)}</text>` : '').join('');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="var(--pine-dark)"><title>${esc(c.label)}: ${c.value}%</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    ${grid}
    <path d="${areaD}" fill="var(--pine-tint)" stroke="none" opacity="0.6"/>
    <path d="${pathD}" fill="none" stroke="var(--pine)" stroke-width="2.5"/>
    ${dots}
    ${labels}
  </svg>`;
}

function rankingList(items, opts={}){
  if (!items.length) return emptyReport(opts.emptyMsg || 'Sem dados suficientes ainda.');
  const unit = opts.unit ?? '%';
  const color = opts.color ?? 'var(--alert)';
  return items.map((it,i)=>`
    <div class="rank-row">
      <div class="rank-pos">${i+1}º</div>
      <div class="rank-info">
        <div class="rank-label" title="${esc(it.title||it.label)}">${esc(it.label)}${it.count!=null?` <span class="rank-n">(${it.count} resposta(s))</span>`:''}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${it.value}%;background:${it.color || (opts.colorize?corPorDificuldade(it.value,opts.colorizeModo||'erro'):color)}"></div></div>
      </div>
      <div class="rank-value">${it.value}${unit}</div>
    </div>
  `).join('');
}

(function(){
  function alvoEditavel(el){
    return el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.isContentEditable);
  }
  ['copy','cut'].forEach(evt=>{
    document.addEventListener(evt, e=>{
      if(!alvoEditavel(e.target)){ e.preventDefault(); }
    });
  });
  document.addEventListener('contextmenu', e=>{
    if(!alvoEditavel(e.target)){ e.preventDefault(); }
  });
  document.addEventListener('selectstart', e=>{
    if(!alvoEditavel(e.target)){ e.preventDefault(); }
  });
  document.addEventListener('keydown', e=>{
    const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey) && (k==='c'||k==='x'||k==='u'||k==='s') && !alvoEditavel(e.target)){
      e.preventDefault();
    }
  });
})();

(function(){
  function abrirLightbox(src, alt){
    const overlay=document.createElement('div');
    overlay.className='fx-lightbox';
    overlay.innerHTML=`<button type="button" class="fx-lightbox-close" aria-label="Fechar">✕</button><img src="${src}" alt="${esc(alt||'')}" />`;
    function fechar(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e){ if(e.key==='Escape') fechar(); }
    overlay.addEventListener('click', e=>{ if(e.target===overlay) fechar(); });
    overlay.querySelector('.fx-lightbox-close').addEventListener('click', fechar);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  }
  document.addEventListener('click', e=>{
    const img=e.target.closest('.question-photo img');
    if(img) abrirLightbox(img.src, img.alt);
  });
})();

const FEATURE_KEY = 'recursosSiteV1';
let fxAnotacoesAberta = false;
function featureData(){ try{return JSON.parse(localStorage.getItem(FEATURE_KEY)||'{}')}catch{return {}} }
function saveFeatureData(d){localStorage.setItem(FEATURE_KEY,JSON.stringify(d))}
function alunoAtualId(){return state.alunoAuthed?.id||null}
function escapeHtml(v){return esc(v==null?'':String(v))}

const _simuladoPodeSerIniciadoOriginal = simuladoPodeSerIniciado;
simuladoPodeSerIniciado = function(simulado, aluno){
  const r = _simuladoPodeSerIniciadoOriginal(simulado, aluno);
  if(!r.ok) return r;
  if(simulado && simulado.codigoAcesso){
    const chave='codigo_'+simulado.id;
    const d=featureData();
    if(d[chave]!==simulado.codigoAcesso){
      const digitado=prompt('Código de acesso do simulado:');
      if(digitado===null) return {ok:false,motivo:'Acesso cancelado.'};
      if(digitado.trim()!==simulado.codigoAcesso) return {ok:false,motivo:'Código de acesso incorreto.'};
      d[chave]=digitado.trim(); saveFeatureData(d);
    }
  }
  return r;
};

const _renderAlunoOriginal = renderAluno;
renderAluno = function(){
  _renderAlunoOriginal();
  if(!state.alunoAuthed || state.quizSimuladoId || state.quizResultado) return;
  const aluno=state.alunos.find(a=>a.id===state.alunoAuthed.id);
  if(!aluno) return;
  const meus=state.resultados.filter(r=>r.alunoId===aluno.id);
  const media=meus.length ? (meus.reduce((a,r)=>a+(Number(r.nota)||0),0)/meus.length).toFixed(1) : '—';
  const painel=document.createElement('div');
  painel.className='card'; painel.style.cssText='margin-top:18px;padding:18px;';
  painel.innerHTML=`<div class="section-head"><div><h2 style="font-size:17px;margin:0">Meu desempenho</h2><p class="muted" style="margin:4px 0 0">Seu histórico de atividades</p></div></div>
  <div class="stat-cards" style="margin:0 0 16px"><div class="card stat-card"><div class="num">${meus.length}</div><div class="lbl">Simulados concluídos</div></div><div class="card stat-card"><div class="num">${media}</div><div class="lbl">Média</div></div><div class="card stat-card"><div class="num">${meus.length?Math.max(...meus.map(r=>Number(r.nota)||0)).toFixed(1):'—'}</div><div class="lbl">Maior nota</div></div></div>
  <div class="field"><label class="field-label">Histórico</label><select id="aluno-historico"><option value="">Selecione um simulado</option>${meus.map(r=>`<option value="${r.id}">${escapeHtml(r.simuladoTitulo)} — ${Number(r.nota||0).toFixed(1)}</option>`).join('')}</select></div>
  <div id="aluno-historico-detalhe" style="margin-top:12px"></div>`;
  app.appendChild(painel);
  const sel=painel.querySelector('#aluno-historico');
  sel.addEventListener('change',()=>{
    const r=state.resultados.find(x=>x.id===sel.value); const box=painel.querySelector('#aluno-historico-detalhe');
    if(!r){box.innerHTML='';return}
    if(r.trocaAba){
      box.innerHTML=`<div class="card" style="padding:14px"><strong>${escapeHtml(r.simuladoTitulo)}</strong><p class="muted">${fmtPts(r.acertos)}/${r.total} acertos · nota ${Number(r.nota||0).toFixed(1)}</p><span class="muted">Este simulado foi finalizado automaticamente por troca de aba. Todas as questões foram consideradas erradas e a revisão não fica disponível.</span></div>`;
      return;
    }
    const erros=(r.detalhes||[]).filter(d=>!d.acertou);
    box.innerHTML=`<div class="card" style="padding:14px"><strong>${escapeHtml(r.simuladoTitulo)}</strong><p class="muted">${fmtPts(r.acertos)}/${r.total} acertos · nota ${Number(r.nota||0).toFixed(1)}</p>${erros.length?`<details><summary>Revisar ${erros.length} questão(ões) errada(s)</summary><div style="margin-top:10px">${erros.map((d,i)=>`<div style="padding:10px 0;border-top:1px solid var(--paper-line)"><strong>${i+1}. ${escapeHtml(d.enunciado)}</strong>${resumoRespostaErro(d)}</div>`).join('')}</div></details>`:'<span class="muted">Nenhum erro neste resultado.</span>'}</div>`;
  });

  const errosPorDescritor={};
  meus.forEach(res=>{
    (res.detalhes||[]).forEach(dd=>{
      if(dd.acertou) return;
      const chave=dd.descritor||dd.habilidade||null;
      if(!chave) return;
      if(!errosPorDescritor[chave]) errosPorDescritor[chave]={count:0, habilidade:dd.habilidade||''};
      errosPorDescritor[chave].count++;
    });
  });
  const topErros=Object.entries(errosPorDescritor).sort((a,b)=>b[1].count-a[1].count).slice(0,5);
  const dicasCard=document.createElement('div');
  dicasCard.className='card'; dicasCard.style.cssText='margin-top:16px;padding:18px;';
  dicasCard.innerHTML = topErros.length ? `
    <div class="section-head"><div><h2 style="font-size:17px;margin:0">Dicas de estudo</h2><p class="muted" style="margin:4px 0 0">Baseado nos seus erros mais frequentes</p></div></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
      ${topErros.map(([chave,info])=>`<div style="padding:10px 12px;border:1px solid var(--paper-line);border-radius:10px;background:var(--paper-card);">
        <strong style="font-size:13.5px;">${escapeHtml(chave)}</strong>
        <p class="muted" style="margin:4px 0 0;font-size:12.5px;">${info.count} erro(s) registrado(s)${info.habilidade&&info.habilidade!==chave?' · '+escapeHtml(info.habilidade):''} — vale revisar esse conteúdo antes do próximo simulado.</p>
      </div>`).join('')}
    </div>` : `
    <div class="section-head"><h2 style="font-size:17px;margin:0">Dicas de estudo</h2></div>
    <p class="muted">Ainda não há erros suficientes registrados para gerar dicas — continue assim!</p>`;
  app.appendChild(dicasCard);
};

const _renderQuizResultadoOriginal = renderQuizResultado;
renderQuizResultado = function(){
  _renderQuizResultadoOriginal();
  document.getElementById('fx-comparativo-turma')?.remove();
  const r = state.quizResultado;
  if(!r || r.trocaAba) return;
  const heroCard = document.querySelector('.result-hero');
  if(!heroCard) return;
  const turmasComSimulado = turmasDoAluno(r.alunoId).filter(t=>Array.isArray(t.simuladoIds) && t.simuladoIds.includes(r.simuladoId));
  const turmasRelevantes = turmasComSimulado.length ? turmasComSimulado : turmasDoAluno(r.alunoId);
  if(!turmasRelevantes.length) return;
  const idsColegas = new Set();
  turmasRelevantes.forEach(t=>(t.alunoIds||[]).forEach(id=>idsColegas.add(id)));
  const resultadosTurma = state.resultados.filter(x=>x.simuladoId===r.simuladoId && idsColegas.has(x.alunoId) && !x.trocaAba);
  if(resultadosTurma.length<2) return;
  const mediaTurma = resultadosTurma.reduce((a,x)=>a+(Number(x.nota)||0),0)/resultadosTurma.length;
  const minhaNota = Number(r.nota||0);
  const div=document.createElement('div');
  div.id='fx-comparativo-turma';
  div.className='card'; div.style.cssText='margin-bottom:18px;padding:16px;';
  div.innerHTML = `<h3 style="margin:0 0 6px;font-size:15px;">Como você ficou em relação à turma</h3>
    <p class="muted" style="margin:0;">Sua nota: <strong>${minhaNota.toFixed(1)}</strong> · Média da turma: <strong>${mediaTurma.toFixed(1)}</strong> (${resultadosTurma.length} tentativa(s))</p>
    <p class="muted" style="margin:6px 0 0;">${minhaNota>=mediaTurma ? 'Você ficou na média ou acima da média da turma neste simulado.' : 'Você ficou um pouco abaixo da média da turma — vale revisar os pontos errados abaixo.'}</p>`;
  heroCard.insertAdjacentElement('afterend', div);
};

let fxAudioCtx=null;
function fxGetAudioCtx(){
  try{
    if(!fxAudioCtx) fxAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(fxAudioCtx.state==='suspended') fxAudioCtx.resume();
    return fxAudioCtx;
  }catch(e){ return null; }
}
function fxTocarBip(vezes=1){
  for(let i=0;i<vezes;i++){
    setTimeout(()=>{
      const ctx=fxGetAudioCtx(); if(!ctx) return;
      try{
        const osc=ctx.createOscillator(); const gain=ctx.createGain();
        osc.type='sine'; osc.frequency.value = i%2===0?880:660;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.32);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+0.34);
      }catch(e){}
    }, i*380);
  }
}
function fxMontarMapaQuestoes(marcadas){
  document.getElementById('fx-mapa-perguntas')?.remove();
  const header=document.getElementById('quiz-header');
  if(!header) return;
  let perguntas = perguntasDoSimulado(state.quizSimuladoId);
  if (state.quizPerguntaIds.length){
    const mapaP=new Map(perguntas.map(p=>[p.id,p]));
    perguntas=state.quizPerguntaIds.map(id=>mapaP.get(id)).filter(Boolean);
  }
  if(!perguntas.length) return;
  const mapa=document.createElement('div');
  mapa.id='fx-mapa-perguntas';
  mapa.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;';
  mapa.innerHTML = perguntas.map((p,idx)=>{
    const respondida = respostaPreenchidaPergunta(p, state.quizRespostas[p.id]);
    const marcada = marcadas.has(p.id);
    let bg='var(--paper-line)', cor='var(--ink-soft)';
    if(respondida){ bg='var(--pine)'; cor='#fff'; }
    if(marcada){ bg='var(--ochre)'; cor='#fff'; }
    return `<button type="button" class="fx-mapa-item" data-idx="${idx}" title="Questão ${idx+1}${marcada?' · marcada para revisar':''}${respondida?' · respondida':' · pendente'}" style="width:32px;height:32px;border-radius:8px;border:1px solid var(--paper-line);background:${bg};color:${cor};font-size:12px;font-weight:700;cursor:pointer;flex:none;">${idx+1}</button>`;
  }).join('');
  header.appendChild(mapa);
  mapa.querySelectorAll('.fx-mapa-item').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cards=document.querySelectorAll('.question-card');
      const alvo=cards[Number(btn.dataset.idx)];
      if(alvo) alvo.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}
function fxImpedirCopiaEnunciados(){
  document.querySelectorAll('#quiz-questions .enunciado, #quiz-questions .texto-apoio').forEach(el=>{
    el.style.userSelect='none';
    el.style.webkitUserSelect='none';
    el.oncopy=e=>{ e.preventDefault(); toast('Cópia desabilitada durante o simulado.'); };
    el.oncut=e=>{ e.preventDefault(); };
    el.oncontextmenu=e=>{ e.preventDefault(); };
  });
}
let fxAlertaSonoroIntervalId=null;
let fxAlertaSonoroDisparados=new Set();
let fxAlertaSonoroTentativa=null;
function fxLigarAlertaSonoro(){
  if(fxAlertaSonoroIntervalId){ clearInterval(fxAlertaSonoroIntervalId); fxAlertaSonoroIntervalId=null; }
  if(!state.quizSimuladoId || !state.quizFimEm) return;
  if(fxAlertaSonoroTentativa!==state.quizIniciadoEm){ fxAlertaSonoroDisparados=new Set(); fxAlertaSonoroTentativa=state.quizIniciadoEm; }
  const limiares=[{seg:300,msg:'⏰ Faltam 5 minutos para o fim do simulado.',bips:1},{seg:60,msg:'⏰ Falta 1 minuto para o fim do simulado!',bips:2},{seg:10,msg:'⏰ Últimos segundos!',bips:3}];
  const checar=()=>{
    if(!state.quizFimEm){ clearInterval(fxAlertaSonoroIntervalId); fxAlertaSonoroIntervalId=null; return; }
    const restanteSeg=Math.round((state.quizFimEm-Date.now())/1000);
    limiares.forEach(l=>{
      if(restanteSeg<=l.seg && restanteSeg>l.seg-2 && !fxAlertaSonoroDisparados.has(l.seg)){
        fxAlertaSonoroDisparados.add(l.seg);
        fxTocarBip(l.bips);
        toast(l.msg);
      }
    });
    if(restanteSeg<=0){ clearInterval(fxAlertaSonoroIntervalId); fxAlertaSonoroIntervalId=null; }
  };
  checar();
  fxAlertaSonoroIntervalId=setInterval(checar,1000);
}

const _renderQuizOriginal = renderQuiz;
renderQuiz = function(){
  _renderQuizOriginal();
  document.getElementById('fx-anotacoes-btn')?.remove();
  document.getElementById('fx-anotacoes-painel')?.remove();
  if(!state.quizSimuladoId) {
    fxAnotacoesAberta = false;
    if(fxAlertaSonoroIntervalId){ clearInterval(fxAlertaSonoroIntervalId); fxAlertaSonoroIntervalId=null; }
    return;
  }
  const d=featureData(); const key='marcadas_'+alunoAtualId()+'_'+state.quizSimuladoId; const marcadas=new Set(d[key]||[]);
  fxMontarMapaQuestoes(marcadas);
  fxImpedirCopiaEnunciados();
  fxLigarAlertaSonoro();
  document.querySelectorAll('.question-card').forEach(card=>{
    const texto=card.querySelector('.enunciado'); if(!texto) return;
    const num=card.querySelector('.qnum'); const idx=Number((num?.textContent.match(/Questão (\d+)/)||[])[1]||0)-1;
    const qid=state.quizPerguntaIds[idx]; if(!qid) return;
    const marcadaAgora=marcadas.has(qid);
    card.classList.toggle('marcada', marcadaAgora);
    const b=document.createElement('button'); b.type='button'; b.className='btn ghost small btn-marcar'; b.style.marginBottom='10px'; b.textContent=marcadaAgora?'★ Desmarcar revisão':'☆ Marcar para revisar';
    b.onclick=()=>{
      const dd=featureData();const kk=key;const a=new Set(dd[kk]||[]);
      if(a.has(qid)) a.delete(qid); else a.add(qid);
      dd[kk]=[...a]; saveFeatureData(dd);
      const ativa=a.has(qid);
      b.textContent=ativa?'★ Desmarcar revisão':'☆ Marcar para revisar';
      card.classList.toggle('marcada', ativa);
    };
    texto.insertAdjacentElement('beforebegin',b);
  });

  const notaKey = 'anotacoes_'+alunoAtualId()+'_'+state.quizSimuladoId;
  const notaSalva = featureData()[notaKey] || '';
  const notasBtn = document.createElement('button');
  notasBtn.type = 'button';
  notasBtn.id = 'fx-anotacoes-btn';
  notasBtn.textContent = 'Anotações';
  notasBtn.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:40;padding:10px 16px;border-radius:999px;border:1px solid var(--paper-line);background:var(--pine);color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--shadow-lg);';
  document.body.appendChild(notasBtn);

  const notasPainel = document.createElement('div');
  notasPainel.id = 'fx-anotacoes-painel';
  notasPainel.style.cssText = 'position:fixed;right:18px;bottom:70px;z-index:40;width:min(320px,calc(100vw - 36px));background:var(--paper-card);border:1px solid var(--paper-line);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px;display:'+(fxAnotacoesAberta?'block':'none')+';';
  notasPainel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <strong style="font-size:13px;">Minhas anotações</strong>
      <button type="button" id="fx-anotacoes-fechar" style="background:none;border:none;cursor:pointer;font-size:16px;line-height:1;color:var(--ink-soft);">✕</button>
    </div>
    <textarea id="fx-anotacoes-texto" placeholder="Rascunhos, cálculos, lembretes..." style="width:100%;min-height:140px;resize:vertical;border:1px solid var(--paper-line);border-radius:8px;padding:8px;font-family:inherit;font-size:13px;">${escapeHtml(notaSalva)}</textarea>
    <small class="muted" style="display:block;margin-top:6px;">Só você vê isso. Não é enviado como resposta e fica salvo neste aparelho.</small>
  `;
  document.body.appendChild(notasPainel);

  notasBtn.addEventListener('click', ()=>{
    fxAnotacoesAberta = !fxAnotacoesAberta;
    notasPainel.style.display = fxAnotacoesAberta ? 'block' : 'none';
  });
  notasPainel.querySelector('#fx-anotacoes-fechar').addEventListener('click', ()=>{
    fxAnotacoesAberta = false;
    notasPainel.style.display = 'none';
  });
  const notasTextarea = notasPainel.querySelector('#fx-anotacoes-texto');
  notasTextarea.addEventListener('input', ()=>{
    const dd = featureData();
    dd[notaKey] = notasTextarea.value;
    saveFeatureData(dd);
  });
};

const _renderTeacherSimuladosOriginal = renderTeacherSimulados;
renderTeacherSimulados = function(content){
  _renderTeacherSimuladosOriginal(content);

  const orfas = state.perguntas.filter(p => !state.simulados.some(s => s.id === p.simuladoId));
  if (!orfas.length) return;

  const card = document.createElement('div');
  card.className = 'card';
  card.style.cssText = 'margin-top:16px;padding:18px;border:1px dashed var(--ochre);';
  card.innerHTML = `
    <div class="section-head" style="margin-bottom:10px;">
      <div>
        <h2 style="font-size:17px;margin:0;">Perguntas órfãs (${orfas.length})</h2>
        <p class="muted" style="margin:4px 0 0;">Perguntas cujo simulado original não existe mais. Selecione as que quiser e recrie um simulado com elas.</p>
      </div>
    </div>
    <div style="margin-bottom:10px;">
      <button type="button" class="btn ghost small" id="fx-orfa-marcar-todas">Marcar todas</button>
      <button type="button" class="btn ghost small" id="fx-orfa-desmarcar-todas">Desmarcar todas</button>
    </div>
    <div id="fx-orfas-lista" style="display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;margin-bottom:14px;padding-right:4px;">
      ${orfas.map(p => `
        <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:7px 9px;border:1px solid var(--paper-line);border-radius:8px;background:var(--paper-card);">
          <input type="checkbox" class="fx-orfa-check" value="${p.id}" checked style="margin-top:3px;flex:none;" />
          <span>${esc((p.enunciado || '(sem enunciado)').slice(0,140))}</span>
        </label>`).join('')}
    </div>
    <div class="grid-2" style="margin-bottom:12px;">
      <div class="field"><label class="field-label">Título do novo simulado</label><input type="text" id="fx-orfa-titulo" placeholder="Ex.: Simulado recuperado" /></div>
      <div class="field"><label class="field-label">Conteúdo</label><input type="text" id="fx-orfa-conteudo" placeholder="Ex.: Geral" /></div>
    </div>
    <button class="btn pine" type="button" id="fx-orfa-criar">Criar simulado com as selecionadas</button>
  `;
  content.appendChild(card);

  card.querySelector('#fx-orfa-marcar-todas').addEventListener('click', () => {
    card.querySelectorAll('.fx-orfa-check').forEach(el => el.checked = true);
  });
  card.querySelector('#fx-orfa-desmarcar-todas').addEventListener('click', () => {
    card.querySelectorAll('.fx-orfa-check').forEach(el => el.checked = false);
  });

  card.querySelector('#fx-orfa-criar').addEventListener('click', async () => {
    const ids = [...card.querySelectorAll('.fx-orfa-check:checked')].map(el => el.value);
    if (!ids.length) { toast('Selecione ao menos uma pergunta.'); return; }
    const titulo = card.querySelector('#fx-orfa-titulo').value.trim() || 'Simulado recuperado';
    const conteudo = card.querySelector('#fx-orfa-conteudo').value.trim() || 'Geral';
    const papel = papelAtual();
    const professorId = (papel === 'professor' && state.professorAuthed) ? state.professorAuthed.id : null;
    const novoId = uid();
    state.simulados.unshift({
      id: novoId, titulo, descricao: '', conteudo, instrucoes: '', valorTotal: 10, ativo: true,
      criadoEm: Date.now(), tempoMin: 0, maxTentativas: 1, abertura: null, encerramento: null,
      aleatorio: true, finalizarAoSair: false, professorId
    });
    state.perguntas.forEach(p => { if (ids.includes(p.id)) p.simuladoId = novoId; });
    try {
      await salvarDados();
      toast(`Simulado "${titulo}" criado com ${ids.length} pergunta(s).`);
      render();
    } catch (err) {
      console.error(err);
      toast('Não foi possível criar o simulado.');
    }
  });
};

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js">
<title>UP · Área da Gestão</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236b4a2e'/%3E%3Cstop offset='1' stop-color='%238a6a43'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='32' fill='url(%23g)'/%3E%3Cpath d='M16 16v17c0 12 7 18 16 18s16-6 16-18V16h-8v16c0 7-3 10-8 10s-8-3-8-10V16z' fill='white'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1C2B39;
    --ink-soft:#3E4E5C;
    --paper:#EDEBDD;
    --paper-card:#F7F5EA;
    --paper-line:#D8D4C0;
    --pine:#2F6B5E;
    --pine-dark:#20463D;
    --pine-tint:#DCE7E1;
    --ochre:#C88A3D;
    --ochre-tint:#F3E3CB;
    --water:#3E6E8C;
    --water-tint:#DDE7ED;
    --alert:#B23B3B;
    --alert-tint:#F2DBD8;
    --white:#FFFFFF;
    --accent:#8B7CD8;
    --accent-tint:#E7E3F7;
    --radius:10px;
    --shadow: 0 1px 2px rgba(28,43,57,.06), 0 6px 18px rgba(28,43,57,.08);
    --shadow-lg: 0 4px 10px rgba(28,43,57,.07), 0 16px 34px rgba(28,43,57,.11);
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  ::selection{background:var(--accent-tint);color:var(--ink);}

  body, .question-card, .enunciado, .option, main#app{
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
  }
  input, textarea, [contenteditable="true"]{
    -webkit-user-select:text; -moz-user-select:text; user-select:text;
  }

  .brand-logo{
    display:block;
    height:40px;
    width:auto;
    filter:drop-shadow(0 2px 5px rgba(28,43,57,.18));
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 14% -6%, rgba(139,124,216,.10), transparent 42%),
      radial-gradient(circle at 100% 4%, rgba(200,138,61,.09), transparent 38%),
      repeating-radial-gradient(circle at 12% -10%, transparent 0 46px, rgba(47,107,94,.07) 47px 48px, transparent 49px 94px),
      repeating-radial-gradient(circle at 108% 10%, transparent 0 60px, rgba(200,138,61,.07) 61px 62px, transparent 63px 122px);
    background-attachment:fixed;
  }

  a{color:inherit;}

  header.site{
    padding:22px clamp(16px,4vw,48px) 0;
    max-width:1140px;
    margin:0 auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:16px;
    background:linear-gradient(135deg, var(--paper-card), var(--paper));
    border:1px solid var(--paper-line);
    border-radius:16px;
    padding:12px 20px;
    box-shadow:var(--shadow);
  }
  .brand svg{flex:none;}
  .brand .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    background:linear-gradient(90deg,var(--pine),var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:700;
    margin:0 0 2px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(24px,3.2vw,34px);
    margin:0;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .brand .prof{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin:22px 0 0;
    border-bottom:1px solid var(--paper-line);
  }
  nav.tabs button{
    font-family:var(--font-mono);
    font-size:12.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:none;
    border:none;
    padding:11px 16px;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    top:1px;
    border-bottom:2px solid transparent;
    border-radius:8px 8px 0 0;
    transition:background .15s ease, color .15s ease;
  }
  nav.tabs button.active{
    color:var(--pine-dark);
    border-bottom-color:var(--pine);
    font-weight:700;
    background:rgba(47,107,94,.08);
  }
  nav.tabs button:hover{color:var(--pine-dark);background:rgba(47,107,94,.06);}


  .organized-nav{
    display:flex;
    align-items:stretch;
    gap:8px;
    flex-wrap:wrap;
    padding:10px;
    background:rgba(247,245,234,.72);
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:var(--shadow);
    position:sticky;
    top:10px;
    z-index:20;
    backdrop-filter:blur(10px);
  }
  .nav-group{
    display:flex;
    align-items:center;
    gap:4px;
    padding:3px;
    border:1px solid rgba(216,212,192,.75);
    border-radius:10px;
    background:rgba(255,255,255,.38);
  }
  .nav-group-title{
    display:none;
  }
  .organized-nav button{
    white-space:nowrap;
    border-radius:8px;
    padding:9px 12px;
  }
  .organized-nav button.active{
    box-shadow:0 2px 7px rgba(28,43,57,.10);
  }
  @media (max-width:820px){
    .organized-nav{
      position:static;
      overflow-x:auto;
      flex-wrap:nowrap;
      align-items:stretch;
    }
    .nav-group{
      flex:0 0 auto;
    }
  }
  @media (max-width:560px){
    .organized-nav{
      margin-left:-4px;
      margin-right:-4px;
      padding:7px;
    }
    .organized-nav button{
      font-size:11px;
      padding:8px 10px;
    }
  }

  main#app{
    max-width:1100px;
    margin:0 auto;
    padding:28px clamp(16px,4vw,48px) 80px;
  }

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .section-head h2{
    font-family:var(--font-display);
    font-size:22px;
    margin:0;
    font-weight:600;
  }
  .muted{color:var(--ink-soft);}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:100px;
    font-weight:700;
  }
  .badge.on{background:var(--pine-tint);color:var(--pine-dark);}
  .badge.off{background:#E7E4D6;color:var(--ink-soft);}
  .badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}

  button.btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--white);
    padding:9px 16px;
    border-radius:9px;
    cursor:pointer;
    transition:transform .12s ease, opacity .15s ease, box-shadow .15s ease;
  }
  button.btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 12px rgba(28,43,57,.18);}
  button.btn:active{transform:translateY(1px);box-shadow:none;}
  button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--paper-line);}
  button.btn.ghost:hover{border-color:var(--ink);box-shadow:none;}
  button.btn.pine{background:linear-gradient(135deg,var(--pine),var(--pine-dark));border-color:var(--pine);}
  button.btn.danger{background:transparent;color:var(--alert);border-color:var(--alert-tint);}
  button.btn.danger:hover{background:var(--alert-tint);}
  button.btn.small{padding:6px 11px;font-size:12.5px;border-radius:6px;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  input[type=text],input[type=password],textarea,select{
    font-family:var(--font-body);
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    background:var(--white);
    color:var(--ink);
    width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--pine);outline-offset:1px;}
  label.field-label{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin:0 0 5px;
  }
  .field{margin-bottom:14px;}

  .card{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:var(--shadow);
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .sim-card:hover, .list-row:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
  .materia-grupo h3{
    display:flex;align-items:center;gap:10px;
  }
  .materia-grupo h3::before{
    content:"";width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--pine));
    flex:none;
  }

  .name-gate{
    max-width:420px;
    margin:40px auto;
    padding:26px;
    text-align:center;
  }
  .name-gate h2{font-family:var(--font-display);font-size:22px;margin:0 0 6px;}
  .grid-simulados{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
  }
  .sim-card{
    padding:18px;
    position:relative;
    border-style:dashed;
  }
  .sim-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .sim-card h3{font-family:var(--font-display);font-size:18px;margin:0 0 6px;font-weight:600;}
  .sim-card p{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;min-height:20px;}
  .sim-card .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-bottom:12px;}
  .empty-state{
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:var(--font-mono);
    font-size:13px;
    border:1px dashed var(--paper-line);
    border-radius:var(--radius);
  }

  .quiz-header{margin-bottom:18px;}
  .quiz-header .eyebrow{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--pine);}
  .progress-bar{height:6px;border-radius:100px;background:var(--paper-line);overflow:hidden;margin-top:10px;}
  .progress-bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--pine),var(--ochre));}
  .question-card{padding:20px;margin-bottom:14px;position:relative;transition:box-shadow .15s ease;}
  .question-card.marcada{
    border-left:5px solid var(--alert);
    background:linear-gradient(90deg, var(--alert-tint) 0%, var(--paper-card) 42px);
    box-shadow:var(--shadow-lg);
  }
  .btn-marcar{font-family:var(--font-mono);letter-spacing:.02em;}
  .question-card .qnum{font-family:var(--font-mono);font-size:11px;color:var(--pine);margin-bottom:6px;}
  .question-card p.enunciado{font-size:16px;font-weight:600;margin:0 0 14px;}
  .texto-apoio{
    margin:0 0 14px;padding:14px 16px;border:1px solid var(--paper-line);border-left:3px solid var(--water);
    border-radius:8px;background:var(--paper-card);color:var(--ink-soft);
    font-size:14px;line-height:1.6;white-space:pre-wrap;
  }
  .texto-apoio::before{content:"Texto de apoio";display:block;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--water);margin-bottom:6px;}
  .opcao{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
    background:var(--white);
    font-size:14px;
  }
  .opcao:hover{border-color:var(--pine);}
  .opcao.selected{border-color:var(--pine);background:var(--pine-tint);font-weight:600;}
  .opcao input{accent-color:var(--pine);}
  .opcao.correta{border-color:var(--pine);background:var(--pine-tint);}
  .opcao.errada{border-color:var(--alert);background:var(--alert-tint);}
  .quiz-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}

  .result-hero{
    padding:28px;
    text-align:center;
    margin-bottom:20px;
  }
  .result-hero .score{
    font-family:var(--font-display);
    font-size:42px;
    font-weight:700;
    color:var(--pine-dark);
    line-height:1;
  }
  .result-hero .score small{font-size:16px;color:var(--ink-soft);font-weight:500;}
  .review-item{padding:16px 18px;margin-bottom:10px;}
  .review-item .tag-descritor{
    font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--water);background:var(--water-tint);padding:2px 8px;border-radius:100px;display:inline-block;margin-bottom:8px;
  }

  .login-gate{max-width:380px;margin:50px auto;padding:28px;text-align:center;}
  .login-gate h2{font-family:var(--font-display);margin:0 0 4px;font-size:22px;}

  .subtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .subtabs button{
    font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    background:var(--white);border:1px solid var(--paper-line);border-radius:100px;
    padding:7px 14px;cursor:pointer;color:var(--ink-soft);
  }
  .subtabs button.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data-table th{
    text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-soft);border-bottom:1px solid var(--paper-line);padding:8px 10px;
  }
  table.data-table td{padding:10px;border-bottom:1px solid var(--paper-line);vertical-align:top;}
  table.data-table tr:last-child td{border-bottom:none;}

  .switch{position:relative;display:inline-block;width:38px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:#C9C4AE;border-radius:100px;transition:.15s;}
  .switch .slider::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:white;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--pine);}
  .switch input:checked + .slider::before{transform:translateX(16px);}

  .list-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 16px;border-bottom:1px solid var(--paper-line);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .info h4{margin:0 0 3px;font-family:var(--font-display);font-size:15.5px;font-weight:600;}
  .list-row .info p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .row-actions{display:flex;align-items:center;gap:8px;flex:none;}

  form.panel-form{padding:18px;margin-bottom:22px;}
  form.panel-form .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:600px){form.panel-form .grid-2{grid-template-columns:1fr;}}

  .opcao-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .opcao-row input[type=radio]{accent-color:var(--pine);flex:none;}
  .opcao-row input[type=text]{flex:1;}
  .opcao-row .letra{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);width:16px;}

  .tipo-pergunta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .questao-editor-box{padding:14px;border:1px solid var(--paper-line);border-radius:10px;background:rgba(255,255,255,.34);}
  .matching-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:9px;}
  .matching-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:9px;}
  .matching-label{padding:9px 11px;border:1px solid var(--paper-line);border-radius:7px;background:var(--white);font-size:13px;}
  .match-answer{font-size:13px;}
  .texto-resposta{min-height:90px;resize:vertical;}
  .quiz-text-answer{min-height:100px;resize:vertical;}
  .quiz-matching{display:grid;gap:10px;}
  .quiz-match-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;}
  .quiz-match-left{padding:11px 12px;border:1px solid var(--paper-line);border-radius:8px;background:var(--white);font-size:14px;font-weight:600;}
  @media(max-width:600px){.tipo-pergunta-grid,.matching-grid,.matching-row,.quiz-match-row{grid-template-columns:1fr;}}

  .foto-preview-wrap{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:4px;}
  .foto-preview{max-width:220px;max-height:150px;border-radius:8px;border:1px solid var(--paper-line);display:block;object-fit:cover;}
  input[type=file]{
    font-family:var(--font-body);font-size:13px;padding:8px;border:1px dashed var(--paper-line);
    border-radius:7px;background:var(--white);width:100%;cursor:pointer;
  }
  .question-photo{margin-bottom:14px;}
  .question-photo img{max-width:100%;max-height:320px;border-radius:8px;display:block;border:1px solid var(--paper-line);object-fit:contain;background:var(--white);cursor:zoom-in;transition:box-shadow .15s ease, transform .15s ease;}
  .question-photo img:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
  .review-item .question-photo img{max-height:220px;}

  .fx-lightbox{position:fixed;inset:0;background:rgba(15,20,26,.92);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9999;cursor:zoom-out;animation:fxFadeIn .15s ease;}
  .fx-lightbox img{max-width:98vw;max-height:96vh;width:auto;height:auto;border-radius:10px;box-shadow:var(--shadow-lg);object-fit:contain;background:var(--white);cursor:default;}
  .fx-lightbox .fx-lightbox-close{position:fixed;top:16px;right:16px;width:46px;height:46px;border-radius:50%;border:none;background:var(--paper-card);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;box-shadow:var(--shadow-lg);z-index:10000;}
  .fx-lightbox .fx-lightbox-close:hover{background:var(--white);}
  @keyframes fxFadeIn{from{opacity:0}to{opacity:1}}

  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{padding:16px;}
  .stat-card .num{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--pine-dark);}
  .stat-card .lbl{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.05em;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .label{width:150px;flex:none;font-size:13px;font-weight:600;}
  .bar-track{flex:1;height:10px;background:var(--paper-line);border-radius:100px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--alert);}
  .bar-row .pct{width:44px;flex:none;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);}

  .chart-bars-wrap{position:relative;}
  .chart-bars-wrap::before,.chart-bars-wrap::after{content:'';position:absolute;top:10px;bottom:0;width:26px;pointer-events:none;opacity:0;transition:opacity .2s ease;z-index:1;}
  .chart-bars-wrap::before{left:0;background:linear-gradient(to right,var(--paper-card),transparent);}
  .chart-bars-wrap::after{right:0;background:linear-gradient(to left,var(--paper-card),transparent);}
  .chart-bars-wrap.can-scroll-left::before{opacity:1;}
  .chart-bars-wrap.can-scroll-right::after{opacity:1;}
  .chart-scroll-hint{display:none;align-items:center;justify-content:center;gap:5px;font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);opacity:.8;margin-bottom:4px;}
  .chart-bars-wrap.is-scrollable .chart-scroll-hint{display:flex;}
  .chart-bars-wrap.is-scrollable.scrolled .chart-scroll-hint{display:none;}
  .chart-scroll-hint .arrow{display:inline-block;animation:chartHintNudge 1.2s ease-in-out infinite;}
  @keyframes chartHintNudge{0%,100%{transform:translateX(0);}50%{transform:translateX(4px);}}

.ger-enun{font-size:14px;line-height:1.35;min-width:0}
.ger-pct{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ger-sub{font-size:12px;color:var(--ink-soft);text-align:right}
.mini-bar{display:block;height:10px;border-radius:99px;background:var(--paper-line);overflow:hidden}.mini-bar>span{display:block;height:100%;border-radius:99px}
.ger-duas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ger-caixa{padding:14px 16px}.ger-caixa h4{margin:0 0 8px;font-size:14px}.ger-caixa h4 small{font-weight:400;color:var(--ink-soft)}
.ger-caixa.baixo{border-top:4px solid var(--alert)}.ger-caixa.ok{border-top:4px solid var(--pine)}
.ger-aluno{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--paper-line);font-size:14px}.ger-aluno:last-child{border-bottom:0}
.ger-caixa .ger-linha{grid-template-columns:1fr 90px 44px;padding:8px 0}.ger-caixa .ger-linha>.ger-enun{grid-column:auto}
.ger-todos{margin-top:12px}.ger-todos summary{cursor:pointer;padding:10px;font-weight:600;font-size:13.5px}
.ger-coment{display:grid;gap:8px;margin-top:10px}.ger-coment blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--ochre);background:var(--ochre-tint);border-radius:0 8px 8px 0}
.ger-coment p{margin:0 0 3px;font-size:13.5px}.ger-coment small{color:var(--ink-soft)}
@media(max-width:700px){.ger-hero{flex-direction:column;text-align:center}.ger-duas{grid-template-columns:1fr}.ger-linha,.ger-linha.estatica{grid-template-columns:1fr 70px 44px}.ger-linha>.ger-enun{grid-column:1/-1}.ger-sub{display:none}}
.chart-bars{justify-content:space-evenly}
.rel-box .section-head{display:none}
.rel-box>.card{margin-top:0}
/* ===== Editor de texto rico ===== */
.rte{border:1.5px solid var(--paper-line);border-radius:10px;background:var(--white);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.rte:focus-within{border-color:var(--pine);box-shadow:0 0 0 4px rgba(169,134,73,.22)}
.rte-bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 10px;background:var(--pine-tint);border-bottom:1px solid var(--paper-line)}
.rte-bar button{min-width:32px;height:32px;padding:0 9px;border:1px solid var(--paper-line);background:var(--white);color:var(--ink);border-radius:7px;cursor:pointer;font:600 13px var(--font-body);line-height:1}
.rte-bar button:hover{border-color:var(--ochre);background:var(--ochre-tint)}
.rte-bar select{min-height:32px!important;height:32px;padding:0 8px!important;font-size:12.5px!important;border-radius:7px!important;width:auto!important}
.rte-bar .sep{width:1px;height:22px;background:var(--paper-line);margin:0 4px}
.rte-cor{position:relative;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--paper-line);border-radius:7px;background:var(--white);font-weight:700;cursor:pointer;overflow:hidden}
.rte-cor input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;min-height:0!important;padding:0!important}
.rte-cor.dest{color:#e0b800}
.rte-area{padding:12px 14px;outline:none;line-height:1.6;font-size:15px;color:var(--ink);max-height:420px;overflow:auto}
.rte-area:empty:before{content:attr(data-placeholder);color:var(--ink-soft);opacity:.55}
.rte-area ul,.rte-out ul{padding-left:22px}.rte-area ol,.rte-out ol{padding-left:22px}
.rte-out p,.rte-out div{margin:0 0 .4em}
.vf-ed-row input[type=text]{flex:1}.vf-radio{display:inline-flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
.vf-radio input{min-height:0!important;width:16px!important;height:16px!important;padding:0!important;border-radius:50%!important;margin:0}
.vf-linha{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px dashed var(--paper-line)}
.vf-linha:last-child{border-bottom:0}.vf-txt{flex:1;line-height:1.5}
.vf-btns{display:flex;gap:8px}
.vf-btn{width:48px;height:42px;border-radius:10px;border:1.5px solid var(--paper-line);background:var(--white);color:var(--ink);font:700 16px var(--font-body);cursor:pointer;transition:all .12s}
.vf-btn:hover{border-color:var(--ochre)}.vf-btn.on{background:var(--pine);border-color:var(--pine);color:#fbf5e8}
.c-par{background:var(--ochre-tint);color:#8a5c22;font-weight:700}
.tent-q .ico.par{background:var(--ochre-tint);color:#8a5c22}
</style>

let chartLabelTipEl = null;
function esconderChartLabelTip(){
  if (chartLabelTipEl){ chartLabelTipEl.classList.remove('show'); }
}
document.addEventListener('click', (ev)=>{
  const label = ev.target.closest?.('.chart-bar-label');
  if (!label){ esconderChartLabelTip(); return; }
  ev.stopPropagation();
  const texto = label.dataset.fullLabel || label.textContent || '';
  if (!chartLabelTipEl){
    chartLabelTipEl = document.createElement('div');
    chartLabelTipEl.className = 'chart-label-tip';
    document.body.appendChild(chartLabelTipEl);
  }
  chartLabelTipEl.textContent = texto;
  chartLabelTipEl.classList.add('show');
  const r = label.getBoundingClientRect();
  const tipW = 220;
  let left = r.left + r.width/2 - tipW/2;
  left = Math.max(8, Math.min(left, window.innerWidth - tipW - 8));
  chartLabelTipEl.style.left = left + 'px';
  chartLabelTipEl.style.top = Math.max(8, r.top - 8) + 'px';
  chartLabelTipEl.style.transform = 'translateY(-100%)';
});
window.addEventListener('scroll', esconderChartLabelTip, true);
window.addEventListener('resize', ()=>{ esconderChartLabelTip(); atualizarChartsScrollUX(); });

function atualizarChartsScrollUX(){
  document.querySelectorAll('.chart-bars-wrap[data-chart-scroll]').forEach(wrap=>{
    const track = wrap.querySelector('.chart-bars');
    if (!track) return;
    const podeRolar = track.scrollWidth > track.clientWidth + 2;
    wrap.classList.toggle('is-scrollable', podeRolar);
    if (!podeRolar){
      wrap.classList.remove('can-scroll-left','can-scroll-right','scrolled');
      return;
    }
    if (track.dataset.scrollUxLigado) {
      atualizarSetasChart(wrap, track);
      return;
    }
    track.dataset.scrollUxLigado = '1';
    track.addEventListener('scroll', ()=>{
      wrap.classList.add('scrolled');
      atualizarSetasChart(wrap, track);
    }, {passive:true});
    atualizarSetasChart(wrap, track);
  });
}
function atualizarSetasChart(wrap, track){
  wrap.classList.toggle('can-scroll-left', track.scrollLeft > 4);
  wrap.classList.toggle('can-scroll-right', track.scrollLeft < track.scrollWidth - track.clientWidth - 4);
}

function aplicarTema(){
  const escuro = localStorage.getItem('temaSite') === 'escuro';

    botao.querySelector('span:last-child').textContent = escuro ? 'Tema claro' : 'Tema escuro';
    botao.setAttribute('aria-pressed', escuro ? 'true' : 'false');
  }
}

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uid(){
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9);
}
async function hashSenha(senha){
  const dados=new TextEncoder().encode(String(senha));
  const buffer=await crypto.subtle.digest('SHA-256',dados);
  return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function senhaConfere(senha,hash){
  if(!hash) return false;
  return (await hashSenha(senha))===hash;
}

const FILA_RESULTADOS_KEY = 'filaResultadosPendentes';
function lerFilaResultadosPendentes(){
  try{
    const raw = localStorage.getItem(FILA_RESULTADOS_KEY);
    const lista = raw ? JSON.parse(raw) : [];
    return Array.isArray(lista) ? lista : [];
  }catch(e){ return []; }
}
function gravarFilaResultadosPendentes(lista){
  try{ localStorage.setItem(FILA_RESULTADOS_KEY, JSON.stringify(lista)); }catch(e){}
}
function enfileirarResultadoPendente(resultado){
  if (!resultado?.id) return;
  const fila = lerFilaResultadosPendentes().filter(r=>r.id!==resultado.id);
  fila.push(resultado);
  gravarFilaResultadosPendentes(fila);
}
function removerResultadoPendente(id){
  const fila = lerFilaResultadosPendentes().filter(r=>r.id!==id);
  gravarFilaResultadosPendentes(fila);
}
async function salvarResultadoDireto(resultado){
  if (!resultado?.id) return;
  const json = JSON.stringify(resultado);
  const resultadoLimpo = JSON.parse(json);
  enfileirarResultadoPendente(resultadoLimpo);
  if (resultadosGravados.get(resultado.id) === json){
    removerResultadoPendente(resultado.id);
    return;
  }
  let tentativas = 0;
  while (true){
    try{
      await setDoc(doc(resultadosColRef, resultado.id), resultadoLimpo);
      resultadosGravados.set(resultado.id, json);
      removerResultadoPendente(resultado.id);
      return;
    }catch(err){
      tentativas++;
      console.error('Firebase: falha ao salvar resultado', err);
      if (tentativas >= 5){
        toast('Sem conexão no momento — seu resultado ficou salvo neste aparelho e será enviado automaticamente assim que a internet voltar.');
        return; // continua na fila local; flushFilaResultadosPendentes() tenta de novo depois
      }
      await new Promise(r=>setTimeout(r,1200*tentativas));
    }
  }
}
let flushandoFilaResultados = false;
async function flushFilaResultadosPendentes(){
  if (flushandoFilaResultados) return;
  const fila = lerFilaResultadosPendentes();
  if (!fila.length) return;
  flushandoFilaResultados = true;
  try{
    for (const resultado of fila){
      try{
        await setDoc(doc(resultadosColRef, resultado.id), resultado);
        resultadosGravados.set(resultado.id, JSON.stringify(resultado));
        removerResultadoPendente(resultado.id);
      }catch(err){
        console.error('Firebase: falha ao reenviar resultado pendente', err);
      }
    }
  } finally {
    flushandoFilaResultados = false;
  }
}
window.addEventListener('online', ()=>flushFilaResultadosPendentes());
setInterval(()=>flushFilaResultadosPendentes(), 25000);

let migracaoSenhasExecutada=false;

async function migrarSenhasLegadas(){
  if(migracaoSenhasExecutada) return;
  migracaoSenhasExecutada=true;
  let mudou=false;
  for(const a of state.alunos){
    if(a.senha && !a.senhaHash){ a.senhaEntrega=a.senha; a.senhaHash=await hashSenha(a.senha); delete a.senha; mudou=true; }
  }
  for(const p of state.professores){
    if(p.senha && !p.senhaHash){ p.senhaHash=await hashSenha(p.senha); delete p.senha; mudou=true; }
  }
  if(mudou) await salvarDados();
  senhasProntas=true;
  if(configCarregado) render();
}

/* Monta o documento config/app exatamente como o salvarDados grava */
function montarConfigAtual(){
  return {
    alunos:state.alunos.map(x=>{const y={...x};delete y.senha;return y;}),
    professores:state.professores.map(x=>{const y={...x};delete y.senha;return y;}),
    turmas:state.turmas.map(x=>({...x,alunoIds:[...(x.alunoIds||[])],simuladoIds:[...(x.simuladoIds||[])]})),
    preferenciasProfessores: {...(state.preferenciasProfessores||{})},
    avisos: Array.isArray(state.avisos) ? state.avisos : []
  };
}
/* Registra o que já está no servidor, para o salvarDados NÃO regravar documentos iguais (economiza escritas) */
function registrarGravados(snap, mapa, lista){
  try{
    const por=new Map(lista.map(x=>[x?.id,x]));
    snap.docChanges().forEach(ch=>{
      const id=ch.doc.id;
      if(ch.type==='removed'){ mapa.delete(id); return; }
      const obj=por.get(id);
      if(obj) mapa.set(id, JSON.stringify(obj));
    });
  }catch(e){ console.warn('registrarGravados:',e); }
}

function escutarDados(){
  onSnapshot(configDocRef, snap=>{

    if (snap.metadata.hasPendingWrites) {
      return;
    }
    const data = snap.exists() ? snap.data() : {};
    state.alunos = Array.isArray(data.alunos) ? data.alunos : [];
    state.professores = Array.isArray(data.professores) ? data.professores : [];
    state.turmas = Array.isArray(data.turmas) ? data.turmas : [];
    state.preferenciasProfessores = data.preferenciasProfessores && typeof data.preferenciasProfessores==='object' ? data.preferenciasProfessores : (state.preferenciasProfessores||{});
    state.avisos = Array.isArray(data.avisos) ? data.avisos : (state.avisos||[]);
    state.alunos.forEach(a=>{
      if (!Array.isArray(a.turmaIds)) a.turmaIds = a.turmaId ? [a.turmaId] : [];
      a.login = String(a.login ?? '').trim();
      a.nome = String(a.nome ?? '').trim();
    });
    state.professores.forEach(p=>{
      p.login = String(p.login ?? '').trim();
      p.nome = String(p.nome ?? '').trim();
      if (p.ativo === undefined) p.ativo = true;
    });
    migrarSenhasLegadas();
    state.turmas.forEach(t=>{
      if (!Array.isArray(t.alunoIds)) t.alunoIds = [];
      if (!Array.isArray(t.simuladoIds)) t.simuladoIds = [];
    });
    ultimaConfiguracaoGravada = JSON.stringify(montarConfigAtual());
    configCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase);

  onSnapshot(simuladosColRef, snap=>{
    simuladosRemotoIds = new Set(snap.docs.map(d=>d.id));
    state.simulados = snap.docs.map(d=>{
      const s = {...d.data()};
      s.conteudo = s.conteudo || 'Geral';
      s.valorTotal = Number(s.valorTotal ?? 10);
      s.instrucoes = s.instrucoes || '';
      return s;
    });
    registrarGravados(snap, simuladosGravados, state.simulados);
    simuladosCarregado = true;
    atualizarAssinaturasEscopo();
    aoAtualizarDados();
  }, tratarErroFirebase);

  onSnapshot(alunosColRef, snap=>{
    alunosRemotoIds = new Set(snap.docs.map(d=>d.id));
    if (snap.docs.length) {
      state.alunos = snap.docs.map(d=>d.data());
      state.alunos.forEach(a=>{
        if(!Array.isArray(a.turmaIds)) a.turmaIds = a.turmaId ? [a.turmaId] : [];
        a.login = String(a.login ?? '').trim();
        a.nome = String(a.nome ?? '').trim();
      });
    }
    registrarGravados(snap, alunosGravados, state.alunos);
    alunosCarregado = true;
    atualizarAssinaturasEscopo();
    aoAtualizarDados();
  }, tratarErroFirebase);

  atualizarAssinaturasEscopo();
}

// --- Assinaturas de "perguntas" e "resultados" com escopo dinâmico ---
// Objetivo: quando um ALUNO está logado, ele só precisa das próprias tentativas
// (resultados) e das perguntas dos simulados ativos que pode fazer — em vez de
// sincronizar as coleções inteiras (que crescem sem limite com o tempo de uso).
// Gestão e professores continuam com acesso completo (poucos usuários, não
// multiplicam o custo de leitura como os alunos multiplicam).
let escopoDadosAtualChave = null;
let unsubsPerguntas = [];
let unsubsResultados = [];

function pararAssinaturas(lista){
  lista.forEach(fn=>{ try{ fn(); }catch(_){} });
  lista.length = 0;
}

function fragmentarArray(arr, tamanho){
  const partes = [];
  for (let i=0; i<arr.length; i+=tamanho) partes.push(arr.slice(i, i+tamanho));
  return partes;
}

function calcularEscopoDadosAtual(){
  const papel = papelAtual();
  if (papel === 'gestao' || papel === 'professor') return {tipo:'tudo'};
  if (state.view === 'aluno' && state.alunoAuthed){
    const aluno = state.alunos.find(a=>a.id===state.alunoAuthed.id) || state.alunoAuthed;
    const idsSimulados = new Set(simuladosDisponiveisParaAluno(aluno).map(s=>s.id));
    if (state.quizSimuladoId) idsSimulados.add(state.quizSimuladoId);
    return {tipo:'aluno', alunoId: aluno.id, idsSimulados: [...idsSimulados].sort()};
  }
  // Ninguém autenticado ainda (tela de login): não precisa de perguntas nem resultados.
  return {tipo:'nenhum'};
}

function atualizarAssinaturasEscopo(){
  if (!alunosCarregado || !simuladosCarregado) return;
  const escopo = calcularEscopoDadosAtual();
  const chave = JSON.stringify(escopo);
  if (chave === escopoDadosAtualChave) return;
  escopoDadosAtualChave = chave;

  pararAssinaturas(unsubsPerguntas);
  pararAssinaturas(unsubsResultados);
  perguntasCarregado = false;
  resultadosCarregado = false;
  state.perguntas = [];
  state.resultados = [];
  perguntasRemotoIds = new Set();
  resultadosRemotoIds = new Set();

  if (escopo.tipo === 'nenhum'){
    perguntasCarregado = true;
    resultadosCarregado = true;
    aoAtualizarDados();
    return;
  }

  if (escopo.tipo === 'tudo'){
    unsubsPerguntas.push(onSnapshot(perguntasColRef, snap=>{
      perguntasRemotoIds = new Set(snap.docs.map(d=>d.id));
      state.perguntas = snap.docs.map(d=>{
        const p={...d.data()};
        p.enunciado=String(p.enunciado ?? '');
        p.textoApoio=String(p.textoApoio ?? '');
        p.descritor=String(p.descritor ?? '');
        p.habilidade=String(p.habilidade ?? '');
        p.tipo=p.tipo || 'multipla';
        return p;
      });
      registrarGravados(snap, perguntasGravadas, state.perguntas);
      perguntasCarregado = true;
      aoAtualizarDados();
    }, tratarErroFirebase));

    unsubsResultados.push(onSnapshot(resultadosColRef, snap=>{
      resultadosRemotoIds = new Set(snap.docs.map(d=>d.id));
      state.resultados = snap.docs.map(d=>d.data());
      registrarGravados(snap, resultadosGravados, state.resultados);
      resultadosCarregado = true;
      aoAtualizarDados();
    }, tratarErroFirebase));
    return;
  }

  // Escopo de aluno: resultados só dele; perguntas só dos simulados que ele pode acessar.
  unsubsResultados.push(onSnapshot(query(resultadosColRef, where('alunoId','==', escopo.alunoId)), snap=>{
    resultadosRemotoIds = new Set(snap.docs.map(d=>d.id));
    state.resultados = snap.docs.map(d=>d.data());
    resultadosCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase));

  if (!escopo.idsSimulados.length){
    perguntasCarregado = true;
    aoAtualizarDados();
  } else {
    const chunks = fragmentarArray(escopo.idsSimulados, 30);
    const perguntasPorChunk = new Map();
    const chunksProntos = new Set();
    chunks.forEach((chunkIds, idx)=>{
      unsubsPerguntas.push(onSnapshot(query(perguntasColRef, where('simuladoId','in', chunkIds)), snap=>{
        perguntasPorChunk.set(idx, snap.docs.map(d=>{
          const p={...d.data()};
          p.enunciado=String(p.enunciado ?? '');
          p.textoApoio=String(p.textoApoio ?? '');
          p.descritor=String(p.descritor ?? '');
          p.habilidade=String(p.habilidade ?? '');
          p.tipo=p.tipo || 'multipla';
          return p;
        }));
        chunksProntos.add(idx);
        state.perguntas = chunks.flatMap((_,i)=>perguntasPorChunk.get(i)||[]);
        perguntasRemotoIds = new Set(state.perguntas.map(p=>p.id));
        if (chunksProntos.size === chunks.length) perguntasCarregado = true;
        aoAtualizarDados();
      }, tratarErroFirebase));
    });
  }
}

function limparReferenciasInexistentes(){
  let mudou=false;
  const alunoIds=new Set(state.alunos.map(a=>a.id));
  const simIds=new Set(state.simulados.map(s=>s.id));
  state.turmas.forEach(t=>{
    const alunos=Array.isArray(t.alunoIds)?t.alunoIds:[];
    const simulados=Array.isArray(t.simuladoIds)?t.simuladoIds:[];
    const novosAlunos=alunos.filter(id=>alunoIds.has(id));
    const novosSimulados=simulados.filter(id=>simIds.has(id));
    if(novosAlunos.length!==alunos.length||novosSimulados.length!==simulados.length)mudou=true;
    t.alunoIds=novosAlunos;
    t.simuladoIds=novosSimulados;
  });
  state.alunos.forEach(a=>{
    if(!Array.isArray(a.turmaIds))a.turmaIds=[];
    const novas=a.turmaIds.filter(id=>state.turmas.some(t=>t.id===id));
    if(novas.length!==a.turmaIds.length)mudou=true;
    a.turmaIds=novas;
  });
  return mudou;
}

async function salvarDados(){
  salvarEstadoLocal();
  configSalvarNovamente=true;
  if(configSalvando)return;
  configSalvando=true;
  while(configSalvarNovamente){
    configSalvarNovamente=false;
    const configAtual=montarConfigAtual();
    const escritas=[];
    const configJson=JSON.stringify(configAtual);
    try{
      if(configJson!==ultimaConfiguracaoGravada){
        await setDoc(configDocRef,configAtual);
        ultimaConfiguracaoGravada=configJson;
      }
      const idsLocaisAlunos=new Set();
      const alunosPendentes=new Map();
      for(const a of state.alunos){
        if(!a?.id)continue;
        idsLocaisAlunos.add(a.id);
        const json=JSON.stringify(a);
        if(alunosGravados.get(a.id)!==json){
          escritas.push(setDoc(doc(alunosColRef,a.id),a));
          alunosPendentes.set(a.id,json);
        }
      }
      const podeExcluir = (carregado, idsLocais, idsRemotos) => carregado && !(idsLocais.size===0 && idsRemotos.size>0);

      if (podeExcluir(alunosCarregado, idsLocaisAlunos, alunosRemotoIds)) {
        for(const id of alunosRemotoIds){
          if(!idsLocaisAlunos.has(id)){
            escritas.push(deleteDoc(doc(alunosColRef,id)));
            alunosGravados.delete(id);
          }
        }
      } else if (idsLocaisAlunos.size===0 && alunosRemotoIds.size>0) {
        console.warn('Sincronização de alunos abortada: lista local vazia com dados no servidor. Nada foi excluído.');
      }

      const idsLocaisSimulados=new Set();
      const simuladosPendentes=new Map();
      for(const s of state.simulados){
        if(!s?.id)continue;
        idsLocaisSimulados.add(s.id);
        const json=JSON.stringify(s);
        if(simuladosGravados.get(s.id)!==json){
          escritas.push(setDoc(doc(simuladosColRef,s.id),s));
          simuladosPendentes.set(s.id,json);
        }
      }
      if (podeExcluir(simuladosCarregado, idsLocaisSimulados, simuladosRemotoIds)) {
        for(const id of simuladosRemotoIds){
          if(!idsLocaisSimulados.has(id)){
            escritas.push(deleteDoc(doc(simuladosColRef,id)));
            simuladosGravados.delete(id);
          }
        }
      } else if (idsLocaisSimulados.size===0 && simuladosRemotoIds.size>0) {
        console.warn('Sincronização de simulados abortada: lista local vazia com dados no servidor. Nada foi excluído.');
      }

      const idsLocaisPerguntas=new Set();
      const perguntasPendentes=new Map();
      for(const p of state.perguntas){
        if(!p?.id)continue;
        idsLocaisPerguntas.add(p.id);
        const json=JSON.stringify(p);
        if(perguntasGravadas.get(p.id)!==json){
          escritas.push(setDoc(doc(perguntasColRef,p.id),p));
          perguntasPendentes.set(p.id,json);
        }
      }
      if (podeExcluir(perguntasCarregado, idsLocaisPerguntas, perguntasRemotoIds)) {
        for(const id of perguntasRemotoIds){
          if(!idsLocaisPerguntas.has(id)){
            escritas.push(deleteDoc(doc(perguntasColRef,id)));
            perguntasGravadas.delete(id);
          }
        }
      } else if (idsLocaisPerguntas.size===0 && perguntasRemotoIds.size>0) {
        console.warn('Sincronização de perguntas abortada: lista local vazia com dados no servidor. Nada foi excluído.');
      }
      const idsLocaisResultados=new Set();
      const resultadosPendentes=new Map();
      for(const r of state.resultados){
        if(!r?.id)continue;
        idsLocaisResultados.add(r.id);
        const json=JSON.stringify(r);
        if(resultadosGravados.get(r.id)!==json){
          escritas.push(setDoc(doc(resultadosColRef,r.id),JSON.parse(json)));
          resultadosPendentes.set(r.id,json);
        }
      }
      if (podeExcluir(resultadosCarregado, idsLocaisResultados, resultadosRemotoIds)) {
        for(const id of resultadosRemotoIds){
          if(!idsLocaisResultados.has(id)){
            escritas.push(deleteDoc(doc(resultadosColRef,id)));
            resultadosGravados.delete(id);
          }
        }
      } else if (idsLocaisResultados.size===0 && resultadosRemotoIds.size>0) {
        console.warn('Sincronização de resultados abortada: lista local vazia com dados no servidor. Nada foi excluído.');
      }
      if(escritas.length)await Promise.all(escritas);
      for(const [id,json] of simuladosPendentes) simuladosGravados.set(id,json);
      for(const [id,json] of alunosPendentes) alunosGravados.set(id,json);
      for(const [id,json] of perguntasPendentes) perguntasGravadas.set(id,json);
      for(const [id,json] of resultadosPendentes) resultadosGravados.set(id,json);
      falhasSeguidasSalvar = 0;
    }catch(err){
      console.error('Firebase: falha ao salvar',err);
      falhasSeguidasSalvar++;
      if(falhasSeguidasSalvar>=5){
        toast('Não foi possível salvar os dados no servidor. Verifique sua internet e tente novamente.');
        configSalvarNovamente=false;
        break;
      }
      configSalvarNovamente=true;
      await new Promise(r=>setTimeout(r,1200*falhasSeguidasSalvar));
    }
  }
  configSalvando=false;
  salvarEstadoLocal();
}

function comprimirImagem(file, maxLado=900, qualidade=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler imagem'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Falha ao processar imagem'));
      img.onload = () => {
        let {width, height} = img;
        if (width > maxLado || height > maxLado){
          const escala = maxLado / Math.max(width, height);
          width = Math.round(width * escala);
          height = Math.round(height * escala);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  return alunosAlvo.filter(a=>tentativasDoAluno(a.id, simulado.id)===0).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

function simuladoPodeSerIniciado(simulado, aluno){
  if (!simulado || !aluno) return {ok:false, motivo:'Simulado indisponível.'};
  if (simulado.ativo === false) return {ok:false, motivo:'Este simulado não está disponível.'};
  const agora=Date.now();
  if (simulado.abertura && agora < simulado.abertura) return {ok:false, motivo:'Abertura: '+new Date(simulado.abertura).toLocaleString('pt-BR')};
  if (simulado.encerramento && agora > simulado.encerramento) return {ok:false, motivo:'Este simulado já foi encerrado.'};
  const extras = Number(aluno.tentativasExtras?.[simulado.id]) || 0;
  if (simulado.maxTentativas && tentativasDoAluno(aluno.id,simulado.id) >= simulado.maxTentativas + extras) return {ok:false, motivo:'Você já atingiu o limite de tentativas.'};
  if (!perguntasDoSimulado(simulado.id).length) return {ok:false, motivo: perguntasCarregado ? 'Este simulado ainda não possui perguntas.' : 'Carregando perguntas…'};
  return {ok:true};
}

}

let calcAberta = false;
let calcDisplay = '0';
let calcArmazenado = null;
let calcOperadorPendente = null;
let calcAguardandoOperando = false;
function resetarCalculadora(){
  calcAberta = false;
  calcDisplay = '0';
  calcArmazenado = null;
  calcOperadorPendente = null;
  calcAguardandoOperando = false;
}
function calcFormatarResultado(n){
  if (!isFinite(n)) return 'Erro';
  return String(parseFloat(n.toPrecision(12)));
}
function calcCalcular(a,b,op){
  switch(op){
    case '+': return a+b;
    case '-': return a-b;
    case '×': return a*b;
    case '÷': return b===0 ? NaN : a/b;
    default: return b;
  }
}
function calcPressionar(tecla){
  if (/^[0-9]$/.test(tecla)){
    if (calcAguardandoOperando || calcDisplay==='Erro'){ calcDisplay = tecla; calcAguardandoOperando=false; }
    else calcDisplay = calcDisplay==='0' ? tecla : calcDisplay+tecla;
    return;
  }
  if (tecla==='.'){
    if (calcAguardandoOperando || calcDisplay==='Erro'){ calcDisplay='0.'; calcAguardandoOperando=false; return; }
    if (!calcDisplay.includes('.')) calcDisplay += '.';
    return;
  }
  if (tecla==='C'){ calcDisplay='0'; calcArmazenado=null; calcOperadorPendente=null; calcAguardandoOperando=false; return; }
  if (tecla==='back'){
    if (calcDisplay==='Erro'){ calcDisplay='0'; return; }
    calcDisplay = calcDisplay.length>1 ? calcDisplay.slice(0,-1) : '0';
    return;
  }
  if (tecla==='sinal'){
    if (calcDisplay==='Erro') return;
    calcDisplay = calcDisplay.startsWith('-') ? calcDisplay.slice(1) : (calcDisplay==='0'?'0':'-'+calcDisplay);
    return;
  }
  if (tecla==='%'){
    if (calcDisplay==='Erro') return;
    calcDisplay = calcFormatarResultado(parseFloat(calcDisplay)/100);
    return;
  }
  if (tecla==='+'||tecla==='-'||tecla==='×'||tecla==='÷'){
    if (calcDisplay==='Erro') return;
    const valorAtual = parseFloat(calcDisplay);
    if (calcArmazenado===null){ calcArmazenado = valorAtual; }
    else if (calcOperadorPendente && !calcAguardandoOperando){
      calcArmazenado = calcCalcular(calcArmazenado, valorAtual, calcOperadorPendente);
      calcDisplay = calcFormatarResultado(calcArmazenado);
    }
    calcOperadorPendente = tecla;
    calcAguardandoOperando = true;
    return;
  }
  if (tecla==='='){
    if (calcOperadorPendente===null || calcArmazenado===null || calcDisplay==='Erro') return;
    const valorAtual = parseFloat(calcDisplay);
    const resultado = calcCalcular(calcArmazenado, valorAtual, calcOperadorPendente);
    calcDisplay = calcFormatarResultado(resultado);
    calcArmazenado=null; calcOperadorPendente=null; calcAguardandoOperando=true;
    return;
  }
}

function ligarCalculadoraEventos(){
  const fab = document.getElementById('calc-fab');
  const painel = document.getElementById('calc-panel');
  if (!fab || !painel) return;
  fab.addEventListener('click', ()=>{
    calcAberta = !calcAberta;
    painel.classList.toggle('aberta', calcAberta);
  });
  document.getElementById('calc-close')?.addEventListener('click', ()=>{
    calcAberta = false;
    painel.classList.remove('aberta');
  });
  painel.querySelectorAll('[data-calc]').forEach(btn=>{
    btn.addEventListener('click', ()=>{

      const tela = document.getElementById('calc-display');
      if (tela) tela.textContent = calcDisplay;
    });
  });
}

      if(sim.impedirSaida && !confirm('Este simulado não pode ser interrompido nem descartado depois de iniciado — você só poderá enviar as respostas ao final. Deseja começar agora?')) return;
      state.quizSimuladoId = btn.dataset.id;
      state.quizRespostas = {};
      resetarCalculadora();
      let ids=perguntasDoSimulado(sim.id).map(p=>p.id);
      if(sim.aleatorio!==false) ids=embaralhar(ids);
      state.quizPerguntaIds=ids;
      state.quizOrdemOpcoes={};
      state.quizIniciadoEm=Date.now();
      state.quizFimEm=sim.tempoMin ? Date.now()+sim.tempoMin*60000 : null;
      state.quizPausado=false;
      salvarEstadoLocal();
      render();
    });
  });
}

function normalizarRespostaTexto(valor){
  return String(valor ?? '').trim().toLocaleLowerCase('pt-BR')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ');
}
function opcoesVisiveisDaPergunta(p){
  const todas = Array.isArray(p.opcoes) ? p.opcoes : [];
  let ultimaPreenchida = -1;
  todas.forEach((o,i)=>{ if(o && String(o).trim()) ultimaPreenchida = i; });
  let limite = Math.max(Math.min(todas.length,4), ultimaPreenchida+1);
  if ((p.tipo||'multipla')==='multipla_selecao'){
    const maxCorreta = (p.respostasCorretas||[]).map(Number).reduce((m,v)=>Math.max(m,v),-1);
    if (maxCorreta+1>limite) limite = Math.min(todas.length, maxCorreta+1);
  } else {
    const correta = Number(p.respostaCorreta);
    if (Number.isFinite(correta) && correta+1>limite) limite = Math.min(todas.length, correta+1);
  }
  limite = Math.min(limite, todas.length);
  return todas.slice(0, limite);
}
function respostaPreenchidaPergunta(p, resposta){
  if(resposta === undefined || resposta === null) return false;
  if(p.tipo === 'texto') return String(resposta).trim().length > 0;
  if(p.tipo === 'associacao'){
    const pares = Array.isArray(p.pares) ? p.pares : [];
    return pares.length > 0 && pares.every((_,i)=>resposta?.[i] !== undefined && resposta?.[i] !== '');
  }
  if(p.tipo === 'multipla_selecao') return Array.isArray(resposta) && resposta.length > 0;
  if(p.tipo === 'vf_afirmacoes'){
    const af = Array.isArray(p.afirmacoes) ? p.afirmacoes : [];
    return af.length > 0 && Array.isArray(resposta) && af.every((_,i)=>resposta[i]===0||resposta[i]===1);
  }
  if(p.tipo === 'ordenacao'){
    const itens = Array.isArray(p.itens) ? p.itens : [];
    return Array.isArray(resposta) && resposta.length === itens.length;
  }
  return resposta !== '';
}
function pontosDe(d){ if(!d) return 0; if(typeof d.pontos==='number') return d.pontos; return d.acertou?1:0; }
function somaPontos(lista){ return Math.round(lista.reduce((a,d)=>a+pontosDe(d),0)*100)/100; }
function fmtPts(n){ return String(Math.round((Number(n)||0)*100)/100).replace('.',','); }
function pontuarPergunta(p, resposta){
  const tipo=p.tipo||'multipla';
  if(tipo==='vf_afirmacoes'){
    const af=Array.isArray(p.afirmacoes)?p.afirmacoes:[];
    if(!af.length||!Array.isArray(resposta)) return 0;
    const certas=af.filter((a,i)=>(resposta[i]===0||resposta[i]===1)&&Number(resposta[i])===Number(a.correta)).length;
    return Math.round(certas/af.length*10000)/10000;
  }
  return corrigirPergunta(p,resposta)?1:0;
}
function corrigirPergunta(p, resposta){
  const tipo=p.tipo || 'multipla';
  if(tipo==='texto'){
    const aceitas=Array.isArray(p.respostasAceitas) && p.respostasAceitas.length
      ? p.respostasAceitas : [p.respostaTexto||''];
    return aceitas.map(normalizarRespostaTexto).filter(Boolean).includes(normalizarRespostaTexto(resposta));
  }
  if(tipo==='verdadeiro_falso') return String(resposta)===String(p.respostaCorreta);
  if(tipo==='vf_afirmacoes'){
    const af=Array.isArray(p.afirmacoes)?p.afirmacoes:[];
    return af.length>0 && Array.isArray(resposta) && af.every((a,i)=>Number(resposta[i])===Number(a.correta) && (resposta[i]===0||resposta[i]===1));
  }
  if(tipo==='associacao'){
    const pares=Array.isArray(p.pares)?p.pares:[];
    if(!Array.isArray(resposta) || resposta.length!==pares.length) return false;
    return pares.every((par,i)=>Number(resposta[i])===Number(par.correta));
  }
  if(tipo==='multipla_selecao'){
    const corretas=(Array.isArray(p.respostasCorretas)?p.respostasCorretas:[]).map(Number).sort();
    const dadas=(Array.isArray(resposta)?resposta:[]).map(Number).sort();
    return corretas.length>0 && corretas.length===dadas.length && corretas.every((v,i)=>v===dadas[i]);
  }
  if(tipo==='ordenacao'){
    const itens=Array.isArray(p.itens)?p.itens:[];
    if(!Array.isArray(resposta) || resposta.length!==itens.length) return false;
    return resposta.every((v,i)=>Number(v)===i);
  }
  return Number(resposta)===Number(p.respostaCorreta);
}
/* ===== Editor de texto rico (negrito, itálico, fonte, tamanho...) ===== */
const FONTES_RICO=[['','Fonte'],['Georgia, serif','Georgia'],['Arial, Helvetica, sans-serif','Arial'],['"Times New Roman", serif','Times New Roman'],['"Courier New", monospace','Courier New'],['Verdana, sans-serif','Verdana'],['"Trebuchet MS", sans-serif','Trebuchet']];
const TAMANHOS_RICO=[12,14,16,18,20,24,28,32,40];
function sanitizarHtmlRico(html){
  const doc=new DOMParser().parseFromString('<body>'+String(html||'')+'</body>','text/html');
  const OK=new Set(['B','STRONG','I','EM','U','S','STRIKE','SUB','SUP','BR','P','DIV','SPAN','UL','OL','LI','H2','H3','BLOCKQUOTE','FONT']);
  const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','NOSCRIPT','TEMPLATE','LINK','META']);
  const PROPS=new Set(['color','background-color','font-size','font-family','font-weight','font-style','text-decoration','text-decoration-line','text-align']);
  const limpa=node=>{
    const out=document.createDocumentFragment();
    node.childNodes.forEach(ch=>{
      if(ch.nodeType===3){ out.appendChild(document.createTextNode(ch.nodeValue)); return; }
      if(ch.nodeType!==1) return;
      const tag=ch.tagName;
      if(DROP.has(tag)) return;
      if(!OK.has(tag)){ out.appendChild(limpa(ch)); return; }
      const el=document.createElement(tag==='FONT'?'span':tag.toLowerCase());
      if(tag==='FONT'){ const c=ch.getAttribute('color'); if(c) el.style.color=c; const f=ch.getAttribute('face'); if(f) el.style.fontFamily=f; }
      const st=ch.style;
      for(let i=0;i<st.length;i++){
        const prop=st[i]; if(!PROPS.has(prop)) continue;
        const val=st.getPropertyValue(prop);
        if(/url\(|expression|javascript|@import/i.test(val)) continue;
        el.style.setProperty(prop,val);
      }
      el.appendChild(limpa(ch)); out.appendChild(el);
    });
    return out;
  };
  const box=document.createElement('div'); box.appendChild(limpa(doc.body)); return box.innerHTML;
}
function htmlRico(texto, html){
  return html ? sanitizarHtmlRico(html) : esc(texto||'').replace(/\n/g,'<br>');
}
function criarEditorRico(host, opts){

  host.classList.add('rte');

    <button type="button" data-cmd="bold" title="Negrito"><b>N</b></button><button type="button" data-cmd="italic" title="Itálico"><i>I</i></button><button type="button" data-cmd="underline" title="Sublinhado"><u>S</u></button><button type="button" data-cmd="strikeThrough" title="Tachado"><s>T</s></button><span class="sep"></span>

    <button type="button" data-cmd="superscript" title="Sobrescrito">x²</button><button type="button" data-cmd="subscript" title="Subscrito">x₂</button><button type="button" data-cmd="removeFormat" title="Limpar formatação">Limpar</button>
  </div><div class="rte-area" contenteditable="true" spellcheck="true" data-placeholder="${esc(placeholder)}" style="min-height:${altura}px"></div>`;
  const area=host.querySelector('.rte-area');
  area.innerHTML=sanitizarHtmlRico(html);
  let sel=null;
  document.addEventListener('selectionchange',()=>{
    const s=window.getSelection();
    if(s&&s.rangeCount&&area.contains(s.anchorNode)) sel=s.getRangeAt(0).cloneRange();
  });
  const restaurar=()=>{ area.focus(); if(sel){ const s=window.getSelection(); s.removeAllRanges(); s.addRange(sel); } };
  const sync=()=>onChange(area);
  const exec=(cmd,val)=>{ restaurar(); try{ document.execCommand('styleWithCSS',false,true); }catch(_){} document.execCommand(cmd,false,val); sync(); };
  host.querySelector('.rte-bar').addEventListener('mousedown',e=>{ if(e.target.closest('button')) e.preventDefault(); });
  host.querySelectorAll('[data-cmd]').forEach(b=>b.addEventListener('click',()=>exec(b.dataset.cmd)));
  host.querySelector('[data-rte="fonte"]').addEventListener('change',e=>{ if(e.target.value) exec('fontName',e.target.value); e.target.value=''; });
  host.querySelector('[data-rte="tamanho"]').addEventListener('change',e=>{
    const px=e.target.value; e.target.value=''; if(!px) return;
    exec('fontSize','7');
    area.querySelectorAll('font[size="7"]').forEach(f=>{ const sp=document.createElement('span'); sp.style.fontSize=px+'px'; while(f.firstChild) sp.appendChild(f.firstChild); f.replaceWith(sp); });
    area.querySelectorAll('span[style*="xxx-large"]').forEach(sp=>{ sp.style.fontSize=px+'px'; });
    sync();
  });
  host.querySelector('[data-rte="cor"]').addEventListener('input',e=>exec('foreColor',e.target.value));
  host.querySelector('[data-rte="destaque"]').addEventListener('input',e=>exec('hiliteColor',e.target.value));
  area.addEventListener('input',sync);
  area.addEventListener('paste',e=>{
    e.preventDefault();
    const h=e.clipboardData.getData('text/html'), t=e.clipboardData.getData('text/plain');
    document.execCommand(h?'insertHTML':'insertText',false,h?sanitizarHtmlRico(h):t);
    sync();
  });
  sync();
  return { area, getHtml:()=>sanitizarHtmlRico(area.innerHTML).replace(/<div><br><\/div>/g,'<br>'), getTexto:()=>area.innerText.replace(/ /g,' ').trim() };
}

function rotuloTipoPergunta(tipo){

    verdadeiro_falso:'Verdadeiro ou falso',

    vf_afirmacoes:'V/F — várias afirmações',

  })[tipo] || 'Múltipla escolha';
}
function resumoRespostaErro(d){
  const tipo=d.tipo||'multipla';
  if(tipo==='texto'){
    return `<p style="margin:5px 0">Sua resposta: ${d.respostaAluno==null||d.respostaAluno===''?'Não respondida':esc(d.respostaAluno)}</p><p style="margin:0">Resposta esperada: ${esc(d.respostaTexto||d.respostasAceitas?.[0]||'—')}</p>`;
  }
  if(tipo==='verdadeiro_falso'){
    return `<p style="margin:5px 0">Sua resposta: ${d.respostaAluno==null?'Não respondida':(Number(d.respostaAluno)===0?'Verdadeiro':'Falso')}</p><p style="margin:0">Resposta correta: ${Number(d.respostaCorreta)===0?'Verdadeiro':'Falso'}</p>`;
  }
  if(tipo==='vf_afirmacoes'){
    const af=Array.isArray(d.afirmacoes)?d.afirmacoes:[]; const dada=Array.isArray(d.respostaAluno)?d.respostaAluno:[];
    const vf=v=>v===0?'V':(v===1?'F':'—');
    return af.map((a,i)=>`<p style="margin:4px 0">${Number(dada[i])===Number(a.correta)?'✓':'✕'} ${esc(a.texto)} — resposta: <strong>${vf(dada[i])}</strong> · correta: <strong>${vf(Number(a.correta))}</strong></p>`).join('');
  }
  if(tipo==='associacao'){
    const pares=Array.isArray(d.pares)?d.pares:[];
    return pares.map((par,idx)=>{
      const alunoIdx=Array.isArray(d.respostaAluno)?d.respostaAluno[idx]:'';
      return `<p style="margin:4px 0"><strong>${esc(par.esquerda||'Item')}</strong> → ${esc(pares[Number(alunoIdx)]?.direita||'Não respondido')}</p>`;
    }).join('');
  }
  if(tipo==='multipla_selecao'){
    const opcoes=d.opcoes||[]; const dadas=(Array.isArray(d.respostaAluno)?d.respostaAluno:[]).map(Number); const corretas=(d.respostasCorretas||[]).map(Number);
    return `<p style="margin:5px 0">Sua resposta: ${dadas.length?dadas.map(i=>String.fromCharCode(65+i)).join(', '):'Não respondida'}</p><p style="margin:0">Resposta correta: ${corretas.map(i=>String.fromCharCode(65+i)).join(', ')}</p>`;
  }
  if(tipo==='ordenacao'){
    const itens=Array.isArray(d.itens)?d.itens:[]; const dada=Array.isArray(d.respostaAluno)?d.respostaAluno:[];
    return `<p style="margin:5px 0">Sua ordem: ${dada.map(i=>esc(itens[Number(i)]??'')).join(' → ')}</p><p style="margin:0">Ordem correta: ${itens.map(esc).join(' → ')}</p>`;
  }
  return `<p style="margin:5px 0">Sua resposta: ${d.respostaAluno==null?'Não respondida':esc(d.opcoes?.[d.respostaAluno])}</p><p style="margin:0">Resposta correta: ${esc(d.opcoes?.[d.respostaCorreta])}</p>`;
}

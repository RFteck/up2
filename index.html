              <span class="order-texto">${esc(itens[idx]??'')}</span>
              <span class="order-btns">
                <button type="button" class="order-up" data-pergunta="${p.id}" data-pos="${pos}" ${pos===0?'disabled':''} aria-label="Mover para cima">▲</button>
                <button type="button" class="order-down" data-pergunta="${p.id}" data-pos="${pos}" ${pos===ordemAtual.length-1?'disabled':''} aria-label="Mover para baixo">▼</button>
              </span>
            </div>`).join('')}
        </div>`;
    }else{
      const opcoes=opcoesVisiveisDaPergunta(p);
      const ordem=state.quizOrdemOpcoes[p.id] || (simulado.aleatorio!==false ? embaralhar(opcoes.map((_,j)=>j)) : opcoes.map((_,j)=>j));
      state.quizOrdemOpcoes[p.id]=ordem;
      corpo=ordem.map((idx,pos)=>{const op=opcoes[idx]??'';return `<label class="opcao ${state.quizRespostas[p.id]===idx?'selected':''}" data-pergunta="${p.id}" data-idx="${idx}"><input type="radio" name="q-${p.id}" ${state.quizRespostas[p.id]===idx?'checked':''}/><span>${String.fromCharCode(65+pos)}) ${esc(op)}</span></label>`}).join('');
    }
    return `<div class="card question-card">
      <p class="qnum">Questão ${i+1} de ${perguntas.length}</p>
      ${p.textoApoio ? `<div class="texto-apoio">${htmlRico(p.textoApoio,p.textoApoioHtml)}</div>` : ''}
      <div class="enunciado rte-out">${htmlRico(p.enunciado,p.enunciadoHtml)}</div>
      ${p.tipo ? `<span class="badge off" style="margin-bottom:10px;">${esc(rotuloTipoPergunta(tipo))}</span>` : ''}
      ${fotosDaPergunta(p).map((foto,j)=>`<div class="question-photo"><img src="${foto}" alt="Imagem ${j+1} da questão ${i+1}" /></div>`).join('')}
      ${corpo}
    </div>`;
  }).join('');

  if (quizTimerId) { clearInterval(quizTimerId); quizTimerId=null; }
  const atualizarTimer=()=>{
    if(!simulado.tempoMin || !state.quizFimEm) return;
    const restante=state.quizFimEm-Date.now();
    const timer=document.getElementById('quiz-timer');
    if(timer) timer.textContent='Tempo restante: '+formatarTempo(restante);
    if(restante<=0){ clearInterval(quizTimerId); quizTimerId=null; finalizarQuiz(true); }
  };
  if(simulado.tempoMin){ atualizarTimer(); quizTimerId=setInterval(atualizarTimer,1000); }

  if (document.__upQuizExitHandler) document.removeEventListener('up-quiz-saiu-da-aba', document.__upQuizExitHandler);
  document.__upQuizExitHandler = ()=>{
    if (state.quizSimuladoId === simulado.id && simulado.finalizarAoSair && !state.quizResultado){
      finalizarQuiz(true, 'troca_aba');
    }
  };
  document.addEventListener('up-quiz-saiu-da-aba', document.__upQuizExitHandler);

  qWrap.querySelectorAll('.opcao:not(.opcao-multi)').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.quizRespostas[el.dataset.pergunta] = Number(el.dataset.idx);
      salvarEstadoLocal();
      renderQuiz();
    });
  });
  qWrap.querySelectorAll('.vf-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.vfp, i=Number(el.dataset.vfi), v=Number(el.dataset.vfv);
      const p=perguntas.find(x=>x.id===id); const n=(p?.afirmacoes||[]).length;
      const atual=Array.isArray(state.quizRespostas[id])?[...state.quizRespostas[id]]:[];
      while(atual.length<n) atual.push('');
      atual[i]=(atual[i]===v)?'':v;
      state.quizRespostas[id]=atual;
      salvarEstadoLocal();
      renderQuiz();
    });
  });
  qWrap.querySelectorAll('.opcao-multi').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.pergunta, idx=Number(el.dataset.idx);
      const atual=Array.isArray(state.quizRespostas[id])?[...state.quizRespostas[id]].map(Number):[];
      const pos=atual.indexOf(idx);
      if(pos>=0) atual.splice(pos,1); else atual.push(idx);
      state.quizRespostas[id]=atual;
      salvarEstadoLocal();
      renderQuiz();
    });
  });
  qWrap.querySelectorAll('.order-up, .order-down').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.pergunta, pos=Number(el.dataset.pos);
      const alvo=el.classList.contains('order-up') ? pos-1 : pos+1;
      const arr=Array.isArray(state.quizRespostas[id])?[...state.quizRespostas[id]]:[];
      if(alvo<0||alvo>=arr.length) return;
      [arr[pos],arr[alvo]]=[arr[alvo],arr[pos]];
      state.quizRespostas[id]=arr;
      salvarEstadoLocal();
      renderQuiz();
    });
  });
  qWrap.querySelectorAll('.quiz-text-answer').forEach(el=>{
    el.addEventListener('input',()=>{
      state.quizRespostas[el.dataset.pergunta]=el.value;
      salvarEstadoLocal();
      const q=perguntas.find(x=>x.id===el.dataset.pergunta);
      const n=perguntas.filter(x=>respostaPreenchidaPergunta(x,state.quizRespostas[x.id])).length;
      document.getElementById('btn-enviar-quiz').textContent = n<perguntas.length ? 'Enviar mesmo assim' : 'Enviar respostas';
      document.querySelector('.progress-bar span').style.width=(perguntas.length?Math.round(n/perguntas.length*100):0)+'%';
    });
  });
  qWrap.querySelectorAll('.dnd-item').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',JSON.stringify({id:el.dataset.pergunta,source:Number(el.dataset.dndSource)}));
      el.classList.add('dragging');
    });
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  });
  qWrap.querySelectorAll('.dnd-target').forEach(el=>{
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('drag-over'); e.dataTransfer.dropEffect='move'; });
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault();
      el.classList.remove('drag-over');
      let data;
      try{ data=JSON.parse(e.dataTransfer.getData('text/plain')); }catch(_){ return; }
      const id=el.dataset.pergunta, target=Number(el.dataset.dndTarget), source=Number(data.source);
      if(data.id!==id || !Number.isFinite(source)||!Number.isFinite(target)) return;
      if(!Array.isArray(state.quizRespostas[id])) state.quizRespostas[id]=[];
      const anterior=state.quizRespostas[id].findIndex(v=>Number(v)===target);
      if(anterior>=0) state.quizRespostas[id][anterior]='';
      state.quizRespostas[id][source]=target;
      salvarEstadoLocal();
      const n=perguntas.filter(x=>respostaPreenchidaPergunta(x,state.quizRespostas[x.id])).length;
      document.querySelector('.progress-bar span').style.width=(perguntas.length?Math.round(n/perguntas.length*100):0)+'%';
      renderQuiz();
    });
    el.addEventListener('click',()=>{
      const id=el.dataset.pergunta, target=Number(el.dataset.dndTarget);
      const pares=perguntas.find(x=>x.id===id)?.pares||[];
      const source=pares.findIndex((_,i)=>!Array.isArray(state.quizRespostas[id]) || state.quizRespostas[id][i]==='' || state.quizRespostas[id][i]===undefined);
      if(source<0)return;
      if(!Array.isArray(state.quizRespostas[id]))state.quizRespostas[id]=[];
      state.quizRespostas[id][source]=target;
      salvarEstadoLocal();
      renderQuiz();
    });
  });

  document.getElementById('btn-sair-quiz')?.addEventListener('click', ()=>{
    if(!confirm('Tem certeza? Suas respostas serão descartadas e não poderão ser recuperadas.')) return;
    if (document.__upQuizExitHandler){
      document.removeEventListener('up-quiz-saiu-da-aba', document.__upQuizExitHandler);
      document.__upQuizExitHandler = null;
    }
    state.quizSimuladoId = null;
    state.quizRespostas = {};
    state.quizPerguntaIds=[]; state.quizFimEm=null; state.quizIniciadoEm=null; state.quizPausado=false;
    salvarEstadoLocal(); render();
  });

  document.getElementById('btn-continuar-depois-quiz')?.addEventListener('click', ()=>{
    state.quizPausado = true;
    salvarEstadoLocal();
    render();
  });

  let envioEmAndamento = false;
  async function finalizarQuiz(forced=false, motivo=null){
    if (envioEmAndamento) return;
    envioEmAndamento = true;
    const porTrocaDeAba = motivo === 'troca_aba';
    const botaoEnviar = document.getElementById('btn-enviar-quiz');
    if (botaoEnviar){ botaoEnviar.disabled = true; botaoEnviar.textContent = 'Enviando…'; }
    if(quizTimerId) { clearInterval(quizTimerId); quizTimerId=null; }
    if (document.__upQuizExitHandler){
      document.removeEventListener('up-quiz-saiu-da-aba', document.__upQuizExitHandler);
      document.__upQuizExitHandler = null;
    }
    try{
      const detalhes = perguntas.map(p=>{
        const respostaAluno = state.quizRespostas[p.id];
        let acertou = false, pontos = 0;
        if (!porTrocaDeAba){
          try{ pontos = pontuarPergunta(p,respostaAluno); acertou = pontos>=1; }
          catch(erroCorrecao){ console.error('Falha ao corrigir questão', p?.id, erroCorrecao); acertou = false; pontos = 0; }
        }
        return {
          perguntaId: p.id,
          enunciado: p.enunciado,
          textoApoio: p.textoApoio || '',
          enunciadoHtml: p.enunciadoHtml || '',
          textoApoioHtml: p.textoApoioHtml || '',
          afirmacoes: p.afirmacoes || [],
          tipo: p.tipo||'multipla',
          opcoes: p.opcoes || [],
          pares: p.pares || [],
          respostaTexto: p.respostaTexto || '',
          respostasAceitas: p.respostasAceitas || [],
          respostasCorretas: p.respostasCorretas || [],
          itens: p.itens || [],
          descritor: p.descritor || '',
          habilidade: p.habilidade || '',
          foto: p.foto || '',
          fotos: p.fotos || [],
          respostaAluno,
          respostaCorreta: p.respostaCorreta,
          acertou,
          pontos
        };
      });
      const acertos = porTrocaDeAba ? 0 : somaPontos(detalhes);
      const detalhesParaSalvar = detalhes.map(d=>{
        const {foto, fotos, ...resto} = d;
        return resto;
      });
      const idTentativa = 'res_'+simulado.id+'_'+(state.alunoAuthed?.id||'aluno')+'_'+(state.quizIniciadoEm||Date.now());
      const resultado = {
        id: idTentativa, simuladoId: simulado.id, simuladoTitulo: simulado.titulo,
        alunoId: state.alunoAuthed?.id, alunoNome: state.alunoAuthed?.nome,
        alunoLogin: state.alunoAuthed?.login, data: Date.now(), acertos,
        total: perguntas.length, nota: porTrocaDeAba ? 0 : (perguntas.length ? Number((acertos/perguntas.length*10).toFixed(1)) : 0),
        detalhes: detalhesParaSalvar,
        trocaAba: porTrocaDeAba,
        avaliacao: null
      };
      state.resultados = state.resultados.filter(r=>r.id!==idTentativa);
      state.resultados.unshift(resultado);
      state.quizResultado = {...resultado, detalhes};
      state.quizSimuladoId = null; state.quizRespostas = {};
      state.quizPerguntaIds=[]; state.quizFimEm=null; state.quizIniciadoEm=null; state.quizPausado=false;
      salvarEstadoLocal();
      render();
      window.scrollTo({top:0, left:0, behavior:'smooth'});
      salvarComAvisoDeAtraso(salvarResultadoDireto(resultado), 'Salvando seu resultado no servidor…');
    }catch(erro){
      console.error('Falha ao finalizar o simulado', erro);
      envioEmAndamento = false;
      if (botaoEnviar){ botaoEnviar.disabled = false; botaoEnviar.textContent = 'Enviar respostas'; }
      toast('Não foi possível concluir o envio. Suas respostas continuam salvas neste aparelho — tente enviar novamente.');
      salvarEstadoLocal();
      return;
    }
    envioEmAndamento = false;
  }
  document.getElementById('btn-enviar-quiz').addEventListener('click', ()=>{
    if (envioEmAndamento) return;
    const faltam = perguntas.length - perguntas.filter(p=>respostaPreenchidaPergunta(p,state.quizRespostas[p.id])).length;
    if (faltam > 0){
      const aviso = faltam === 1
        ? 'Você deixou 1 questão sem responder. Ela será considerada errada. Quer enviar mesmo assim?'
        : `Você deixou ${faltam} questões sem responder. Elas serão consideradas erradas. Quer enviar mesmo assim?`;
      if (!confirm(aviso)) return;
    }
    finalizarQuiz(false);
  });
}

function renderQuizResultado(){
  const r = state.quizResultado;
  const nota = r.total ? (r.acertos/r.total*10) : 0;
  if (r.trocaAba){
    app.innerHTML = `
      <div class="card result-hero">
        <p class="muted" style="font-size:13px;">${esc(r.simuladoTitulo)}</p>
        <div class="score selo selo-baixo">0<small>/${r.total}</small></div>
        <p style="margin-top:10px;font-weight:700;color:var(--alert);">Simulado encerrado: você saiu da aba.</p>
        <p class="muted" style="margin-top:6px;">Como este simulado exige permanecer na aba até o fim, ao sair dela ele foi finalizado automaticamente e todas as questões foram consideradas erradas. A revisão questão a questão não fica disponível neste caso.</p>
        <button class="btn pine" id="btn-voltar-lista" style="margin-top:10px;">Voltar aos simulados</button>
      </div>
    `;
    document.getElementById('btn-voltar-lista').addEventListener('click', ()=>{
      state.quizResultado = null; render();
    });
    return;
  }
  const jaAvaliou = !!(r.avaliacao && r.avaliacao.dificuldade);
  const opcoesAvaliacao = [
    {v:'muito_facil', label:'Muito fácil', emoji:''},
    {v:'facil', label:'Fácil', emoji:''},
    {v:'medio', label:'Médio', emoji:''},
    {v:'dificil', label:'Difícil', emoji:''},
    {v:'muito_dificil', label:'Muito difícil', emoji:''}
  ];
  app.innerHTML = `
    <div class="card result-hero">
      <p class="muted" style="font-size:13px;">${esc(r.simuladoTitulo)}</p>
      <div class="score selo ${nota>=7?'selo-alto':nota>=5?'selo-medio':'selo-baixo'}">${r.acertos}<small>/${r.total}</small></div>
      <p class="muted" style="margin-top:8px;">Parabéns, ${esc(r.alunoNome)}! Confira abaixo a revisão das questões.</p>
      <button class="btn pine" id="btn-voltar-lista" style="margin-top:10px;">Voltar aos simulados</button>
    </div>
    <div class="card" id="card-avaliacao-simulado" style="margin-bottom:18px;">
      ${jaAvaliou ? `
        <h3 style="margin:0 0 6px;font-size:15px;">Obrigado por avaliar este simulado!</h3>
        <p class="muted" style="margin:0;">Sua avaliação: ${esc(opcoesAvaliacao.find(o=>o.v===r.avaliacao.dificuldade)?.label || r.avaliacao.dificuldade)}${r.avaliacao.comentario ? ' — "'+esc(r.avaliacao.comentario)+'"' : ''}</p>
      ` : `
        <h3 style="margin:0 0 10px;font-size:15px;">Como foi este simulado para você?</h3>
        <div class="subtabs" id="avaliacao-dificuldade" style="margin-bottom:10px;">
          ${opcoesAvaliacao.map(o=>`<button type="button" data-dificuldade="${o.v}">${o.emoji} ${o.label}</button>`).join('')}
        </div>
        <textarea id="avaliacao-comentario" placeholder="Quer deixar algum comentário para o(a) professor(a)? (opcional)" style="width:100%;min-height:60px;font-family:var(--font-body);padding:10px;border-radius:8px;border:1px solid var(--paper-line);"></textarea>
        <div style="margin-top:10px;">
          <button class="btn pine small" id="btn-enviar-avaliacao" disabled>Enviar avaliação</button>
          <button class="btn ghost small" id="btn-pular-avaliacao">Agora não</button>
        </div>
      `}
    </div>
    <h2 style="font-family:var(--font-display);font-size:19px;">Revisão</h2>
    ${r.detalhes.map((d,i)=>{
      const tipo=d.tipo||'multipla';
      let respostaHtml='';
      if(tipo==='texto'){
        respostaHtml=`<p style="margin:5px 0">Sua resposta: ${d.respostaAluno==null||d.respostaAluno===''?'Não respondida':esc(d.respostaAluno)}</p>
          <p style="margin:0">Resposta esperada: ${esc(d.respostaTexto||d.respostasAceitas?.[0]||'—')}</p>`;
      }else if(tipo==='associacao'){
        const pares=Array.isArray(d.pares)?d.pares:[];
        respostaHtml=pares.map((par,idx)=>{
          const alunoIdx=Array.isArray(d.respostaAluno)?d.respostaAluno[idx]:'';
          return `<div style="padding:5px 0;"><strong>${esc(par.esquerda||'Item')}</strong> → ${esc(pares[Number(alunoIdx)]?.direita||'Não respondido')} ${Number(alunoIdx)===Number(par.correta)?'✓':'✕'}</div>`;
        }).join('');
      }else if(tipo==='vf_afirmacoes'){
        const af=Array.isArray(d.afirmacoes)?d.afirmacoes:[]; const dada=Array.isArray(d.respostaAluno)?d.respostaAluno:[];
        const vf=v=>v===0||v==='0'?'V':(v===1||v==='1'?'F':'—');
        const nOk=af.filter((a,i)=>Number(dada[i])===Number(a.correta)&&(dada[i]===0||dada[i]===1)).length;
        respostaHtml=`<p style="margin:0 0 8px;font-weight:600;">Você acertou ${nOk} de ${af.length} afirmações (${fmtPts(af.length?nOk/af.length:0)} ponto)</p>`+af.map((a,i)=>{const ok=Number(dada[i])===Number(a.correta)&&(dada[i]===0||dada[i]===1);return `<div class="opcao ${ok?'correta':'errada'}" style="cursor:default;">${i+1}. ${esc(a.texto)} — sua resposta: <strong>${vf(dada[i])}</strong>${ok?' ✓':` ✕ (correta: <strong>${vf(Number(a.correta))}</strong>)`}</div>`;}).join('');
      }else if(tipo==='verdadeiro_falso'){
        respostaHtml=`<p style="margin:5px 0">Sua resposta: ${d.respostaAluno==null?'Não respondida':(Number(d.respostaAluno)===0?'Verdadeiro':'Falso')}</p>
          <p style="margin:0">Resposta correta: ${Number(d.respostaCorreta)===0?'Verdadeiro':'Falso'}</p>`;
      }else if(tipo==='multipla_selecao'){
        const opcoes=d.opcoes||[];
        const corretas=(d.respostasCorretas||[]).map(Number);
        const dadas=(Array.isArray(d.respostaAluno)?d.respostaAluno:[]).map(Number);
        respostaHtml=opcoes.map((op,idx)=>{
          let cls=''; if(corretas.includes(idx))cls='correta'; else if(dadas.includes(idx))cls='errada';
          return `<div class="opcao ${cls}" style="cursor:default;">${String.fromCharCode(65+idx)}) ${esc(op)} ${corretas.includes(idx)?' ✓':''} ${(dadas.includes(idx)&&!corretas.includes(idx))?' ✕ (sua resposta)':''}</div>`;
        }).join('');
      }else if(tipo==='ordenacao'){
        const itens=Array.isArray(d.itens)?d.itens:[];
        const dada=Array.isArray(d.respostaAluno)?d.respostaAluno:[];
        respostaHtml=`<p style="margin:5px 0 8px;font-weight:600;">Sua ordem:</p>` +
          dada.map((idx,pos)=>`<div class="opcao ${Number(idx)===pos?'correta':'errada'}" style="cursor:default;">${pos+1}) ${esc(itens[Number(idx)]??'')}</div>`).join('') +
          `<p style="margin:10px 0 5px;font-weight:600;">Ordem correta:</p>` +
          itens.map((it,pos)=>`<div class="opcao" style="cursor:default;">${pos+1}) ${esc(it)}</div>`).join('');
      }else{
        const opcoes=d.opcoes||[];
        respostaHtml=opcoes.map((op,idx)=>{
          let cls=''; if(idx===d.respostaCorreta)cls='correta'; else if(idx===d.respostaAluno)cls='errada';
          return `<div class="opcao ${cls}" style="cursor:default;">${String.fromCharCode(65+idx)}) ${esc(op)} ${idx===d.respostaCorreta?' ✓':''} ${(idx===d.respostaAluno && !d.acertou)?' ✕ (sua resposta)':''}</div>`;
        }).join('');
      }
      return `<div class="card review-item">
        ${d.descritor ? `<span class="tag-descritor">Descritor: ${esc(d.descritor)}</span>` : ''}
        ${d.habilidade ? `<span class="badge" style="margin-left:6px;background:var(--accent-tint);color:var(--accent);">Habilidade: ${esc(d.habilidade)}</span>` : ''}
        <div class="rte-out" style="font-weight:600;margin:6px 0 10px;">${i+1}. ${htmlRico(d.enunciado,d.enunciadoHtml)}</div>
        ${fotosDaPergunta(d).map((foto,j)=>`<div class="question-photo"><img src="${foto}" alt="Imagem ${j+1} da questão ${i+1}" /></div>`).join('')}
        ${respostaHtml}
      </div>`;
    }).join('')}
  `;
  document.getElementById('btn-voltar-lista').addEventListener('click', ()=>{
    state.quizResultado = null; render();
  });

  if (!jaAvaliou){
    let dificuldadeEscolhida = null;
    const grupoDificuldade = document.getElementById('avaliacao-dificuldade');
    const btnEnviarAvaliacao = document.getElementById('btn-enviar-avaliacao');
    grupoDificuldade?.querySelectorAll('[data-dificuldade]').forEach(b=>{
      b.addEventListener('click', ()=>{
        dificuldadeEscolhida = b.dataset.dificuldade;
        grupoDificuldade.querySelectorAll('[data-dificuldade]').forEach(x=>x.classList.toggle('active', x===b));
        if (btnEnviarAvaliacao) btnEnviarAvaliacao.disabled = false;
      });
    });
    document.getElementById('btn-enviar-avaliacao')?.addEventListener('click', async ()=>{
      if (!dificuldadeEscolhida) return;
      const comentario = document.getElementById('avaliacao-comentario')?.value.trim() || '';
      const avaliacao = {dificuldade: dificuldadeEscolhida, comentario, enviadaEm: Date.now()};
      const alvo = state.resultados.find(x=>x.id===r.id);
      if (alvo) alvo.avaliacao = avaliacao;
      state.quizResultado = {...state.quizResultado, avaliacao};
      salvarEstadoLocal();
      toast('Obrigado pela avaliação!');
      render();
      if (alvo) salvarComAvisoDeAtraso(salvarResultadoDireto(alvo), 'Enviando sua avaliação…');
    });
    document.getElementById('btn-pular-avaliacao')?.addEventListener('click', ()=>{
      document.getElementById('card-avaliacao-simulado')?.remove();
    });
  }
}

function papelAtual(){

/* ---------- descritores em blocos (vermelho = pior, azul = melhor) ---------- */
function corDescritor(acerto){
  const R=[168,48,38], M=[234,222,198], B=[40,94,146];
  const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
  const t=Math.max(0,Math.min(100,acerto));
  const c = t<=50 ? R.map((v,i)=>lerp(v,M[i],t/50)) : M.map((v,i)=>lerp(v,B[i],(t-50)/50));
  const lum = .299*c[0]+.587*c[1]+.114*c[2];
  return {bg:`rgb(${c[0]},${c[1]},${c[2]})`, fg: lum<150 ? '#fff' : '#2e2418'};
}
function blocosDescritores(lista, vazio='Ainda não há respostas registradas.'){
  const itens = lista.filter(x=>x.total>0).map(x=>({...x, acerto: Math.round((x.total-x.erros)/x.total*100)})).sort((a,b)=>a.acerto-b.acerto || b.total-a.total);
  if (!itens.length) return `<p class="muted">${vazio}</p>`;
  return `<div class="desc-legenda"><span>Mais erros</span><i></i><span>Mais acertos</span></div>
  <div class="desc-grid">${itens.map(x=>{const c=corDescritor(x.acerto);return `<div class="desc-bloco" style="background:${c.bg};color:${c.fg}" title="${esc(x.nome)} — ${x.acerto}% de acerto (${x.total-x.erros} de ${x.total})"><b>${x.acerto}%</b><span class="nm">${esc(x.nome)}</span><small>${x.total-x.erros} de ${x.total} acerto(s)</small></div>`}).join('')}</div>`;
}

function baixarArquivo(nome, conteudo, tipo='text/plain;charset=utf-8'){
  const blob = new Blob([conteudo], {type: tipo});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportarSimuladoParaImpressao(simulado){
  const perguntas = perguntasDoSimulado(simulado.id);
  if (!perguntas.length){ toast('Este simulado ainda não tem perguntas.'); return; }
  const letras = ['A','B','C','D','E','F','G','H','I','J'];
  const corpoPerguntas = perguntas.map((p,i)=>{
    const fotos = fotosDaPergunta(p).map(f=>`<img src="${f}" style="max-width:320px;display:block;margin:8px 0;" />`).join('');
    let alternativas = '';
    if ((p.tipo||'multipla')==='multipla'){
      alternativas = (p.opcoes||[]).map((o,j)=>`<div style="margin:4px 0;">(&nbsp;&nbsp;) ${letras[j]}) ${esc(o)}</div>`).join('');
    } else if (p.tipo==='verdadeiro_falso'){
      alternativas = `<div style="margin:4px 0;">(&nbsp;&nbsp;) Verdadeiro</div><div style="margin:4px 0;">(&nbsp;&nbsp;) Falso</div>`;
    } else if (p.tipo==='vf_afirmacoes'){
      alternativas = (p.afirmacoes||[]).map(a=>`<div style="margin:5px 0;">(&nbsp;&nbsp;) V &nbsp; (&nbsp;&nbsp;) F &nbsp; ${esc(a.texto)}</div>`).join('');
    } else if (p.tipo==='multipla_selecao'){
      alternativas = (p.opcoes||[]).map((o,j)=>`<div style="margin:4px 0;">[&nbsp;&nbsp;] ${letras[j]}) ${esc(o)}</div>`).join('');
    } else if (p.tipo==='texto'){
      alternativas = `<div style="margin:10px 0;border-bottom:1px solid #999;height:24px;"></div><div style="margin:10px 0;border-bottom:1px solid #999;height:24px;"></div>`;
    } else if (p.tipo==='ordenacao' || p.tipo==='associacao'){
      alternativas = (p.itens||p.opcoes||[]).map(o=>`<div style="margin:4px 0;">• ${esc(typeof o==='string'?o:(o?.texto||''))}</div>`).join('');
    }
    return `
      <div style="page-break-inside:avoid;margin-bottom:22px;">
        <div style="font-weight:700;margin:0 0 6px;">${i+1}. ${htmlRico(p.enunciado,p.enunciadoHtml)}</div>
        ${p.textoApoio?`<div style="font-size:13px;color:#444;border-left:3px solid #ccc;padding-left:10px;margin:6px 0 10px;">${htmlRico(p.textoApoio,p.textoApoioHtml)}</div>`:''}
        ${fotos}
        <div style="margin-left:6px;">${alternativas}</div>
      </div>`;
  }).join('');
  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8" />
  <title>${esc(simulado.titulo)}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;padding:28px;max-width:800px;margin:0 auto;}
    h1{font-size:20px;margin:0 0 4px;}
    .meta{font-size:13px;color:#555;margin-bottom:6px;}
    .cabecalho{border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:20px;}
    .campos{display:flex;gap:24px;margin-top:10px;font-size:13px;}
    @media print{ body{padding:0;} }
  </style></head><body>
    <div class="cabecalho">
      <h1>${esc(simulado.titulo)}</h1>
      <div class="meta">${esc(simulado.conteudo||'')}${simulado.tempoMin?` · Tempo: ${simulado.tempoMin} min`:''} · Valor: ${simulado.valorTotal??10}</div>
      ${simulado.instrucoes?`<p style="font-size:13px;">${esc(simulado.instrucoes)}</p>`:''}
      <div class="campos">
        <div>Nome: ______________________________________</div>
        <div>Data: ____/____/______</div>
      </div>
    </div>
    ${corpoPerguntas}
  </body></html>`;
  const janela = window.open('', '_blank');
  if (!janela){ toast('Permita pop-ups para exportar o PDF.'); return; }
  janela.document.write(html);
  janela.document.close();
  janela.onload = ()=>{ janela.focus(); janela.print(); };
  toast('Use a opção "Salvar como PDF" na janela de impressão.');
}

function alunosFiltradosPorTurma(filtro='todas') {
  if (filtro === 'todas') return state.alunos;
  return state.alunos.filter(a=>turmasDoAluno(a.id).some(t=>t.id===filtro));
}

function resultadosFiltradosPorTurma(filtro='todas') {

  
  const simIds = simuladoIdsVisiveis();
  const simuladosExistentesIds = new Set(state.simulados.map(s=>s.id));
  let base = state.resultados.filter(r=>simIds.has(r.simuladoId) || !simuladosExistentesIds.has(r.simuladoId));
  if (filtro === 'todas') return base;
  const ids = new Set(alunosFiltradosPorTurma(filtro).map(a=>a.id));
  return base.filter(r=>ids.has(r.alunoId));
}

function resultadosDoRelatorioAtual(turmaId=state.relatorioTurmaId, aplicarSim=(arguments.length===0)) {
  const simuladosAtuais = new Map(state.simulados.map(s=>[s.id,s]));
  const perguntasAtuais = new Map(state.perguntas.map(p=>[p.id,p]));
  return resultadosFiltradosPorTurma(turmaId)
    .filter(r=>!aplicarSim || !state.relatorioSimuladoId || state.relatorioSimuladoId==='todos' || r.simuladoId===state.relatorioSimuladoId)
    .map(r=>{
      const detalhes=Array.isArray(r.detalhes)?r.detalhes.map(d=>{
        const p=perguntasAtuais.get(d.perguntaId);
        if(!p) return {...d, excluida:true};
        return {
          ...d,
          enunciado:p.enunciado ?? d.enunciado ?? '',
          textoApoio:p.textoApoio ?? d.textoApoio ?? '',
          enunciadoHtml:p.enunciadoHtml ?? d.enunciadoHtml ?? '',
          textoApoioHtml:p.textoApoioHtml ?? d.textoApoioHtml ?? '',
          afirmacoes:Array.isArray(p.afirmacoes)?p.afirmacoes:(d.afirmacoes||[]),
          descritor:p.descritor ?? d.descritor ?? '',
          habilidade:p.habilidade ?? d.habilidade ?? '',
          tipo:p.tipo ?? d.tipo,
          opcoes:Array.isArray(p.opcoes)?p.opcoes:(d.opcoes||[]),
          pares:Array.isArray(p.pares)?p.pares:(d.pares||[]),
          itens:Array.isArray(p.itens)?p.itens:(d.itens||[]),
          respostasCorretas:Array.isArray(p.respostasCorretas)?p.respostasCorretas:(d.respostasCorretas||[]),
          respostaTexto:p.respostaTexto ?? d.respostaTexto ?? '',
          respostasAceitas:Array.isArray(p.respostasAceitas)?p.respostasAceitas:(d.respostasAceitas||[]),
          fotos:fotosDaPergunta(p).length?fotosDaPergunta(p):fotosDaPergunta(d),
          foto:p.foto||d.foto||''
        };
      }):[];
      const acertos = Number(r.acertos ?? somaPontos(detalhes) ?? 0);
      const total = Number(r.total ?? detalhes.length ?? 0);
      return {
        ...r,
        detalhes,
        acertos,
        total,
        nota: r.nota != null ? Number(r.nota) : (total ? Number((acertos/total*10).toFixed(1)) : 0),
        simuladoExcluido: !simuladosAtuais.has(r.simuladoId)
      };
    });
}

  content.querySelectorAll('[data-action="del-aluno"]').forEach(el=>el.addEventListener('click',()=>{if(papel!=='gestao')return;const a=state.alunos.find(x=>x.id===el.dataset.id);if(!a)return;if(!confirm(`Desativar ${a.nome}? O aluno poderá ser reativado pela Gestão.`))return;a.ativo=false;a.arquivadoEm=Date.now();a.turmasAntesDesativacao=turmasDoAluno(a.id).map(t=>t.id);state.turmas.forEach(t=>t.alunoIds=(t.alunoIds||[]).filter(id=>id!==a.id));salvarDados();render();}));
}

function renderTeacherGestao(content){
  const editando = state.editingProfessorId ? state.professores.find(p=>p.id===state.editingProfessorId) : null;
  const totalAlunos = state.alunos.filter(a=>a.ativo!==false).length;

  content.innerHTML = `
    <div class="card" style="padding:18px;margin-bottom:16px;">
      <div class="section-head"><div><h2 style="font-size:17px;margin:0">Sede / negócio</h2><p class="muted" style="margin:4px 0 0">Visão geral do que a equipe já lançou na plataforma.</p></div></div>
      <div class="stat-cards" style="margin:0;">

        <div class="card stat-card"><div class="num">${totalAlunos}</div><div class="lbl">Alunos</div></div>
        <div class="card stat-card"><div class="num">${totalSimulados}</div><div class="lbl">Simulados lançados</div></div>
        <div class="card stat-card"><div class="num">${totalPerguntas}</div><div class="lbl">Perguntas cadastradas</div></div>
      </div>
    </div>

    <form class="card panel-form" id="form-professor">
      <div class="section-head" style="margin-bottom:14px;"><h2 style="font-size:17px;">${editando?'Editar professor(a)':'Cadastrar professor(a)'}</h2></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Nome do(a) professor(a)</label><input type="text" id="pr-nome" placeholder="Ex.: João Souza" value="${esc(editando?.nome||'')}" required /></div>
        <div class="field"><label class="field-label">Login</label><input type="text" id="pr-login" placeholder="Ex.: joao.souza" value="${esc(editando?.login||'')}" required /></div>
      </div>
      <div class="field" style="max-width:320px;"><label class="field-label">Senha</label><input type="text" id="pr-senha" value="${SENHA_PADRAO_PROFESSOR}" required /></div>
      <div style="display:flex;gap:10px;"><button class="btn pine" type="submit">${editando?'Salvar alterações':'Cadastrar professor(a)'}</button>${editando?'<button class="btn ghost" type="button" id="btn-cancelar-edicao-professor">Cancelar</button>':''}</div>
    </form>

    <div class="card">
      ${state.professores.length===0?'<div class="empty-state">Nenhum professor cadastrado ainda.</div>':state.professores.map(p=>`
        <div class="list-row">
          <div class="info">
            <h4>${esc(p.nome)} <span class="badge ${p.ativo!==false?'on':'off'}" style="margin-left:6px;">${p.ativo!==false?'Ativo':'Desativado'}</span></h4>
            <p>login: <strong>${esc(p.login)}</strong></p>
          </div>
          <div class="row-actions">
            <label class="toggle-ativo" style="display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">
              <input type="checkbox" data-action="toggle-ativo-professor" data-id="${p.id}" ${p.ativo!==false?'checked':''} />
              <span>${p.ativo!==false?'Ligado':'Desligado'}</span>
            </label>
            <button class="btn ghost small" data-action="edit-professor" data-id="${p.id}">Editar / trocar senha</button>
            <button class="btn ghost small" data-action="resetar-senha-professor" data-id="${p.id}">Redefinir p/ ${esc(SENHA_PADRAO_PROFESSOR)}</button>
            <button class="btn danger small" data-action="del-professor" data-id="${p.id}">Excluir</button>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="section-head"><div><h2 style="font-size:17px;margin:0">Entrega de acessos dos alunos</h2><p class="muted" style="margin:4px 0 0">Imprima uma lista organizada com nome, login, senha e turma para entregar aos alunos.</p></div></div>
      <div class="grid-2" style="align-items:end;">
        <div class="field">
          <label class="field-label">Turma</label>
          <select id="gestao-turma-impressao">
            <option value="todas">Todas as turmas</option>
            ${state.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}
          </select>
        </div>
        <button class="btn pine" type="button" id="gestao-imprimir-acessos">Imprimir logins e senhas</button>
      </div>
    </div>

    ${(()=>{
      const semDono = state.simulados.filter(s=>!s.professorId);
      if (!semDono.length || !state.professores.length) return '';
      return `
      <div class="card" style="margin-top:16px;">
        <div class="section-head"><div><h2 style="font-size:17px;margin:0">Atribuir responsável aos simulados antigos</h2><p class="muted" style="margin:4px 0 0">Esses simulados ainda não têm um(a) professor(a) responsável e por isso aparecem para todos. Escolha o(a) responsável de cada um para que só ele(a) veja os resultados.</p></div></div>
        <div style="display:grid;gap:10px;">
          ${semDono.map(s=>`
            <div class="list-row">
              <div class="info"><h4>${esc(s.titulo)}</h4><p>${esc(s.conteudo||'Geral')}</p></div>
              <div class="row-actions">
                <select class="fx-dono-simulado" data-id="${s.id}">
                  <option value="">Sem responsável definido</option>
                  ${state.professores.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}
                </select>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
    })()}

    <div class="card" style="margin-top:16px;">
      <div class="section-head"><div><h2 style="font-size:17px;margin:0">Alunos desativados</h2><p class="muted" style="margin:4px 0 0">Somente a Gestão pode reativar ou excluir permanentemente alunos.</p></div><span class="badge off">${state.alunos.filter(a=>a.ativo===false).length} desativado(s)</span></div>
      ${state.alunos.filter(a=>a.ativo===false).length===0?'<div class="empty-state">Nenhum aluno desativado.</div>':state.alunos.filter(a=>a.ativo===false).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(a=>`<div class="list-row"><div class="info"><h4>${esc(a.nome)}</h4><p>login: <strong>${esc(a.login)}</strong> · ${resultadosDoAluno(a.id).length} tentativa(s) preservada(s)</p></div><div class="row-actions"><button class="btn ghost small" data-action="reativar-aluno" data-id="${a.id}">Reativar</button><button class="btn danger small" data-action="excluir-aluno-permanente" data-id="${a.id}">Excluir permanentemente</button></div></div>`).join('')}
    </div>
  `;

  document.getElementById('gestao-imprimir-acessos').addEventListener('click',()=>{
    const senhaProtecao=prompt('Digite a senha para liberar a impressão:');
    if(senhaProtecao!==SENHA_IMPRESSAO_GESTAO){
      toast('Senha incorreta.');
      return;
    }
    const filtro=document.getElementById('gestao-turma-impressao').value;
    const alunosImpressao=state.alunos.filter(a=>filtro==='todas'||turmasDoAluno(a.id).some(t=>t.id===filtro)).slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
    if(!alunosImpressao.length){ toast('Nenhum aluno encontrado.'); return; }
    const linhas=alunosImpressao.map(a=>{
      const turmas=turmasDoAluno(a.id).map(t=>t.nome).join(', ')||'Sem turma';
      const senha=a.senhaEntrega||'Não registrada';
      return `<tr><td>${esc(a.nome)}</td><td>${esc(a.login)}</td><td>${esc(senha)}</td><td>${esc(turmas)}</td></tr>`;
    }).join('');
    const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Acessos dos alunos</title><style>body{font-family:Arial,Helvetica,sans-serif;color:#1C2B39;padding:24px}h1{font-size:20px;margin:0 0 5px}p{color:#555;font-size:13px;margin:0 0 18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #bbb;padding:9px;text-align:left}th{background:#eee}tr:nth-child(even){background:#f7f7f7}@media print{body{padding:10px}button{display:none}}</style></head><body><h1>Acessos dos alunos</h1><p>Gerado em ${new Date().toLocaleString('pt-BR')} · ${alunosImpressao.length} aluno(s)</p><table><thead><tr><th>Aluno</th><th>Login</th><th>Senha</th><th>Turma(s)</th></tr></thead><tbody>${linhas}</tbody></table></body></html>`;
    const janela=window.open('','_blank');
    if(!janela){toast('Permita pop-ups para imprimir a lista.');return;}
    janela.document.open();
    janela.document.write(html);
    janela.document.close();
    janela.focus();
    janela.onload=()=>janela.print();
    setTimeout(()=>{try{janela.print();}catch(e){}},500);
  });

  document.getElementById('form-professor').addEventListener('submit', async e=>{
    e.preventDefault();
    const nome = document.getElementById('pr-nome').value.trim();
    const login = document.getElementById('pr-login').value.trim().toLowerCase();
    const senha = document.getElementById('pr-senha').value.trim();
    if (nome.length < 2){ toast('Digite o nome completo do(a) professor(a).'); return; }
    if (login.length < 2){ toast('Digite um login válido.'); return; }
    if (/\s/.test(login)){ toast('O login não pode conter espaços.'); return; }
    if (senha.length < 4){ toast('A senha deve ter pelo menos 4 caracteres.'); return; }
    const loginEmUso = state.professores.some(p=>String(p.login??'').trim().toLowerCase()===login && p.id!==state.editingProfessorId);
    if (loginEmUso){ toast('Esse login já está sendo usado por outro professor.'); return; }
    const eraEdicao = !!state.editingProfessorId;
    if (eraEdicao){
      const prof = state.professores.find(p=>p.id===state.editingProfessorId);
      if (!prof){ state.editingProfessorId=null; render(); return; }
      Object.assign(prof,{nome,login});
      prof.senhaHash=await hashSenha(senha);
      delete prof.senha;
      state.editingProfessorId = null;
    } else {
      state.professores.push({id:uid(), nome, login, senhaHash:await hashSenha(senha), ativo:true, criadoEm:Date.now()});
    }
    toast(eraEdicao ? 'Professor(a) atualizado(a).' : 'Professor(a) cadastrado(a).');
    render();
    salvarDados();
  });
  const cancelBtn = document.getElementById('btn-cancelar-edicao-professor');
  if (cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingProfessorId=null; render(); });

  content.querySelectorAll('[data-action="edit-professor"]').forEach(el=>el.addEventListener('click', ()=>{
    state.editingProfessorId = el.dataset.id;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  }));
  content.querySelectorAll('[data-action="toggle-ativo-professor"]').forEach(el=>el.addEventListener('change', ()=>{
    const p = state.professores.find(x=>x.id===el.dataset.id);
    if (!p) return;
    p.ativo = el.checked;
    salvarDados();
    toast(p.ativo ? 'Acesso ligado.' : 'Acesso desligado.');
    render();
  }));
  content.querySelectorAll('[data-action="resetar-senha-professor"]').forEach(el=>el.addEventListener('click', async ()=>{
    const p = state.professores.find(x=>x.id===el.dataset.id);
    if (!p) return;
    if (!confirm(`Redefinir a senha de ${p.nome} para "${SENHA_PADRAO_PROFESSOR}"?`)) return;
    p.senhaHash = await hashSenha(SENHA_PADRAO_PROFESSOR);
    delete p.senha;
    salvarDados();
    toast('Senha redefinida.');
    render();
  }));
  content.querySelectorAll('[data-action="del-professor"]').forEach(el=>el.addEventListener('click', ()=>{
    const p = state.professores.find(x=>x.id===el.dataset.id);
    if (!confirm(`Excluir o acesso de ${p?p.nome:'este professor'}?`)) return;
    const profArquivar=state.professores.find(x=>x.id===el.dataset.id);
    if(profArquivar){ profArquivar.ativo=false; profArquivar.arquivadoEm=Date.now(); }
    if (state.professorAuthed?.id===el.dataset.id) state.professorAuthed = null;
    toast('Professor(a) arquivado(a).');
    render();
    salvarDados();
  }));
  content.querySelectorAll('.fx-dono-simulado').forEach(el=>el.addEventListener('change', ()=>{
    const sim = state.simulados.find(s=>s.id===el.dataset.id);
    if (!sim) return;
    sim.professorId = el.value || null;
    salvarDados();
    toast(el.value ? 'Responsável definido.' : 'Responsável removido.');
    render();
  }));
  content.querySelectorAll('[data-action="reativar-aluno"]').forEach(el=>el.addEventListener('click',()=>{
    const a=state.alunos.find(x=>x.id===el.dataset.id);if(!a)return;
    a.ativo=true;delete a.arquivadoEm;const ids=Array.isArray(a.turmasAntesDesativacao)?a.turmasAntesDesativacao:[];state.turmas.forEach(t=>{if(ids.includes(t.id)){if(!Array.isArray(t.alunoIds))t.alunoIds=[];if(!t.alunoIds.includes(a.id))t.alunoIds.push(a.id);}});a.turmaIds=ids;delete a.turmasAntesDesativacao;salvarDados();render();
  }));
  content.querySelectorAll('[data-action="excluir-aluno-permanente"]').forEach(el=>el.addEventListener('click',()=>{
    const a=state.alunos.find(x=>x.id===el.dataset.id);if(!a)return;
    const qtd=resultadosDoAluno(a.id).length;
    if(!confirm(`Excluir permanentemente ${a.nome}? ${qtd} resultado(s) também serão apagados. Esta ação não pode ser desfeita.`))return;
    removerAlunoPermanentemente(a.id);salvarDados();render();
  }));

}

function renderTeacherTurmas(content){
  if (!state.turmaSelecionadaId && state.turmas.length) state.turmaSelecionadaId = state.turmas[0].id;
  const turma = state.turmas.find(t=>t.id===state.turmaSelecionadaId) || null;

  const alunosDaTurma = state.alunos.filter(a=>a.ativo!==false).slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

  content.innerHTML = `
    <form class="card panel-form" id="form-nova-turma">
      <div class="section-head" style="margin-bottom:14px;"><h2 style="font-size:17px;">Criar nova turma</h2></div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label">Nome da turma</label>
          <input type="text" id="turma-nome" placeholder="Ex.: 9º Ano A" required />
        </div>
        <div style="display:flex;align-items:end;">
          <button class="btn pine" type="submit">Criar turma</button>
        </div>
      </div>
    </form>

    ${state.turmas.length===0 ? `<div class="empty-state">Nenhuma turma criada ainda. Crie uma turma para começar a organizar os alunos e liberar simulados.</div>` : `
      <div class="field" style="max-width:420px;">
        <label class="field-label">Selecionar turma</label>
        <select id="select-turma-gerenciar">
          ${state.turmas.map(t=>`<option value="${t.id}" ${t.id===state.turmaSelecionadaId?'selected':''}>${esc(t.nome)}</option>`).join('')}
        </select>
      </div>

      ${turma ? `<div class="card" style="margin-bottom:18px;">
        <div class="section-head"><h2 style="font-size:17px;">Dados da turma</h2></div>
        <form id="form-editar-turma" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;">
          <div class="field" style="min-width:260px;flex:1;margin:0;">
            <label class="field-label">Nome</label>
            <input type="text" id="editar-turma-nome" value="${esc(turma.nome)}" required />
          </div>
          <button class="btn ghost" type="submit">Salvar nome</button>
        </form>
      </div>` : ''}

      <div class="card" style="margin-bottom:18px;">
        <div class="section-head"><h2 style="font-size:17px;">Simulados liberados</h2></div>
        ${simuladosVisiveis().length===0 ? `<p class="muted">Cadastre simulados primeiro na aba "Simulados".</p>` : `
          <p class="muted" style="font-size:12.5px;margin-top:-8px;margin-bottom:14px;">Marque os simulados que esta turma poderá fazer. A liberação é exclusiva desta turma.</p>
          <div style="display:grid;gap:10px;">
            ${simuladosVisiveis().map(s=>{
              const checked = (turma?.simuladoIds||[]).includes(s.id);
              const qtd = perguntasDoSimulado(s.id).length;
              return `<label style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--paper-line);border-radius:10px;cursor:pointer;">
                <input type="checkbox" data-action="toggle-simulado-turma" data-id="${s.id}" ${checked?'checked':''} />
                <span><strong>${esc(s.titulo)}</strong><small class="muted" style="display:block;">${esc(s.conteudo||'Geral')} · ${qtd} pergunta(s)</small></span>
              </label>`;
            }).join('')}
          </div>`}
      </div>

      <div class="card">
        <div class="section-head"><h2 style="font-size:17px;">Alunos da turma</h2></div>
        ${state.alunos.length===0 ? `<p class="muted">Cadastre alunos primeiro na aba "Alunos".</p>` : (()=>{
          const idsNaTurma = new Set(turma?.alunoIds||[]);
          const nesta = alunosDaTurma.filter(a=>idsNaTurma.has(a.id));
          const outros = alunosDaTurma.filter(a=>!idsNaTurma.has(a.id));
          const linha = a => {
            const checked = idsNaTurma.has(a.id);
            return `<label style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--paper-line);border-radius:10px;cursor:pointer;">
              <input type="checkbox" data-action="toggle-aluno-turma" data-id="${a.id}" ${checked?'checked':''} />
              <span><strong>${esc(a.nome)}</strong><small class="muted" style="display:block;">${esc(a.login)}</small></span>
            </label>`;
          };
          return `
            <p class="muted" style="font-size:12.5px;margin-top:-8px;margin-bottom:10px;">${nesta.length} aluno(s) nesta turma.</p>
            <div style="display:grid;gap:10px;">
              ${nesta.length ? nesta.map(linha).join('') : '<p class="muted" style="margin:0;">Nenhum aluno nesta turma ainda.</p>'}
            </div>
            ${outros.length ? `
              <div class="section-head" style="margin-top:18px;margin-bottom:6px;"><h2 style="font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);">Outros alunos (marque para adicionar)</h2></div>
              <div style="display:grid;gap:10px;">${outros.map(linha).join('')}</div>
            ` : ''}
          `;
        })()}
      </div>

      <div class="card" style="margin-top:18px;">
        <div class="section-head"><h2 style="font-size:17px;">Resumo da turma</h2>
          ${papelAtual()==='gestao'?'<button class="btn danger small" id="btn-excluir-turma">Excluir turma</button>':''}
        </div>
        <p class="muted" style="margin:0;">${esc(turma?.nome||'')} · ${(turma?.alunoIds||[]).length} aluno(s) · ${(turma?.simuladoIds||[]).length} simulado(s) liberado(s)</p>
      </div>
    `}
  `;

  document.getElementById('form-nova-turma').addEventListener('submit', e=>{
    e.preventDefault();
    const nome = document.getElementById('turma-nome').value.trim();
    if (!nome) return;
    const turma = {id:uid(), nome, alunoIds:[], simuladoIds:[], criadoEm:Date.now()};
    state.turmas.unshift(turma);
    state.turmaSelecionadaId = turma.id;
    salvarDados();
    toast('Turma criada.');
    e.target.reset();
    render();
  });

  const select = document.getElementById('select-turma-gerenciar');
  if (select) select.addEventListener('change', ()=>{ state.turmaSelecionadaId = select.value; render(); });

  const editarTurma = document.getElementById('form-editar-turma');
  if (editarTurma) editarTurma.addEventListener('submit', e=>{
    e.preventDefault();
    const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
    const nome = document.getElementById('editar-turma-nome').value.trim();
    if (!t || !nome) return;
    const repetida = state.turmas.some(x=>x.id!==t.id && x.nome.trim().toLowerCase()===nome.toLowerCase());
    if (repetida){ toast('Já existe uma turma com esse nome.'); return; }
    t.nome = nome;
    salvarDados();
    render();
  });

  content.querySelectorAll('[data-action="toggle-aluno-turma"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
      const aluno = state.alunos.find(a=>a.id===el.dataset.id);
      if (!t || !aluno) return;
      if (!Array.isArray(t.alunoIds)) t.alunoIds=[];
      if (!Array.isArray(aluno.turmaIds)) aluno.turmaIds=[];
      if (el.checked){
        if (!t.alunoIds.includes(aluno.id)) t.alunoIds.push(aluno.id);
        if (!aluno.turmaIds.includes(t.id)) aluno.turmaIds.push(t.id);
      } else {
        t.alunoIds = t.alunoIds.filter(id=>id!==aluno.id);
        aluno.turmaIds = aluno.turmaIds.filter(id=>id!==t.id);
      }
      salvarDados();
      render();
    });
  });

  content.querySelectorAll('[data-action="toggle-simulado-turma"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
      if (!t) return;
      if (!Array.isArray(t.simuladoIds)) t.simuladoIds=[];
      if (el.checked){
        if (!t.simuladoIds.includes(el.dataset.id)) t.simuladoIds.push(el.dataset.id);
      } else {
        t.simuladoIds = t.simuladoIds.filter(id=>id!==el.dataset.id);
      }
      salvarDados();
      render();
    });
  });

  const excluir = document.getElementById('btn-excluir-turma');
  if (excluir) excluir.addEventListener('click', ()=>{
    if(papelAtual()!=='gestao') return;
    const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
    if (!t) return;
    if (!confirm(`Excluir a turma "${t.nome}"? Os alunos continuarão cadastrados, mas deixarão de pertencer a esta turma.`)) return;
    state.alunos.forEach(a=>{ if (Array.isArray(a.turmaIds)) a.turmaIds=a.turmaIds.filter(id=>id!==t.id); });
    state.turmas = state.turmas.filter(x=>x.id!==t.id);
    state.turmaSelecionadaId = state.turmas[0]?.id || null;
    salvarDados();
    toast('Turma excluída.');
    render();
  });
}

        </div>
        <div class="field"><label class="field-label">Data de abertura</label><input type="datetime-local" id="ns-abertura" value="${editando?.abertura ? new Date(editando.abertura).toISOString().slice(0,16) : ''}" /></div>
        <div class="field"><label class="field-label">Data de encerramento</label><input type="datetime-local" id="ns-encerramento" value="${editando?.encerramento ? new Date(editando.encerramento).toISOString().slice(0,16) : ''}" /></div>
        <div class="field" style="display:flex;align-items:center;gap:10px;"><input type="checkbox" id="ns-aleatorio" ${editando ? (editando.aleatorio!==false?'checked':'') : 'checked'} /><label for="ns-aleatorio">Embaralhar questões e alternativas</label></div>

          const linhaSimulado = s => `
        <div class="list-row">
          <div class="info">
            <h4>${esc(s.titulo)} <span class="badge ${s.ativo?'on':'off'}" style="margin-left:6px;">${s.ativo?'Ativo':'Inativo'}</span></h4>

            <button class="btn ghost small" data-action="exportar-pdf-simulado" data-id="${s.id}">Exportar PDF</button>
            <button class="btn danger small" data-action="del-simulado" data-id="${s.id}">Excluir</button>

        </div>
        ${state.simuladoPendentesId===s.id ? (()=>{
          const pendentes = alunosPendentesSimulado(s);
          return `<div class="card" style="margin:-6px 0 14px;background:var(--paper);padding:14px 18px;">
            <strong style="font-size:13px;">Ainda não fizeram "${esc(s.titulo)}" (${pendentes.length})</strong>
            <div style="margin-top:8px;">
              ${pendentes.length===0 ? '<p class="muted" style="font-size:12.5px;margin:0;">Todos os alunos das turmas vinculadas já fizeram, ou nenhuma turma está vinculada a este simulado.</p>' :
                pendentes.map(a=>`<div style="padding:6px 0;border-bottom:1px solid var(--paper-line);font-size:13px;">${esc(a.nome)} <span class="muted">— ${esc(turmasDoAluno(a.id).map(t=>t.nome).join(', ')||'Sem turma')}</span></div>`).join('')}
            </div>
          </div>`;
        })() : ''}`;
          const materiasProf = [...new Set(meusSimulados.map(s=>s.conteudo||'Geral'))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
          return materiasProf.map(materia=>`
            <div class="materia-grupo" style="margin-bottom:24px;">
              <h3 style="font-family:var(--font-display);font-size:16px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--paper-line);">${esc(materia)}
                <span class="badge off" style="margin-left:8px;">${meusSimulados.filter(s=>(s.conteudo||'Geral')===materia).length} simulado(s)</span>

      }

    const conteudo = document.getElementById('ns-conteudo').value.trim() || 'Geral';
    const instrucoes = document.getElementById('ns-instrucoes').value.trim();
    const valorTotal = Math.max(0, Number(document.getElementById('ns-valor').value)||10);

    const maxTentativas = Math.max(0, Number(document.getElementById('ns-tentativas').value)||0);

    if (abertura && encerramento && encerramento <= abertura) { toast('A data de encerramento deve ser depois da abertura.'); return; }

    if (foiEdicao){
      const sim = state.simulados.find(s=>s.id===state.editingSimuladoId);
      if (!sim) return;
      Object.assign(sim,{titulo,descricao,conteudo,instrucoes,valorTotal,tempoMin,maxTentativas,abertura,encerramento,aleatorio,finalizarAoSair,impedirSaida,calculadora});
      state.editingSimuladoId=null;

      const papel = papelAtual();

      toast(foiEdicao ? 'Simulado atualizado.' : 'Simulado adicionado.');

      state.editingSimuladoId=el.dataset.id;
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });

  content.querySelectorAll('[data-action="toggle-ativo"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const sim = state.simulados.find(s=>s.id===el.dataset.id);
      if (!sim) return;
      sim.ativo = el.checked;
      const texto = el.parentElement?.querySelector('span');
      if (texto) texto.textContent = sim.ativo ? 'Ligado' : 'Desligado';
      salvarDados();
      toast(sim.ativo ? 'Simulado ligado.' : 'Simulado desligado.');
      render();
    });
  });
  content.querySelectorAll('[data-action="duplicar-simulado"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const original = state.simulados.find(s=>s.id===el.dataset.id);
      if (!original) return;
      const novoId = uid();
      state.simulados.unshift({
        ...original,
        id: novoId,
        titulo: original.titulo + ' — cópia',
        ativo: false,
        criadoEm: Date.now()
      });
      const perguntasOriginais = perguntasDoSimulado(original.id);
      perguntasOriginais.forEach(p=>{
        state.perguntas.push({...p, id:uid(), simuladoId:novoId});
      });
      state.turmas.forEach(t=>{
        if (Array.isArray(t.simuladoIds) && t.simuladoIds.includes(original.id)) t.simuladoIds.push(novoId);
      });
      salvarDados();
      toast('Simulado duplicado.');
      render();
    });
  });

  content.querySelectorAll('[data-action="quem-nao-fez"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.simuladoPendentesId = state.simuladoPendentesId === el.dataset.id ? null : el.dataset.id;
      render();
    });
  });
  content.querySelectorAll('[data-action="exportar-pdf-simulado"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const sim = state.simulados.find(s=>s.id===el.dataset.id);
      if (sim) exportarSimuladoParaImpressao(sim);
    });
  });
  content.querySelectorAll('[data-action="ir-perguntas"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.perguntasFiltroSimuladoId = el.dataset.id;
      state.teacherTab = 'perguntas';
      render();
    });
  });
  content.querySelectorAll('[data-action="del-simulado"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.id;
      const sim=state.simulados.find(s=>s.id===id);
      if (!sim) return;
      if (!confirm(`Arquivar o simulado "${sim.titulo}"? Os resultados e as questões serão preservados.`)) return;
      sim.ativo=false;
      sim.arquivado=true;
      sim.arquivadoEm=Date.now();
      state.turmas.forEach(t=>t.simuladoIds=(t.simuladoIds||[]).filter(x=>x!==id));
      if (state.perguntasFiltroSimuladoId===id) state.perguntasFiltroSimuladoId=simuladosVisiveis()[0]?.id||null;
      salvarDados();
      toast('Simulado arquivado.');
      render();
    });
  });
}

function renderTeacherBanco(content){

  const todasPerguntas = state.perguntas.filter(p=>idsVisiveis.has(p.simuladoId));

  content.innerHTML = `

    <div class="field" style="max-width:480px;margin-bottom:10px;">
      <label class="field-label" for="banco-busca">Buscar</label>

    </div>` : ''}
    <div class="card" id="banco-lista"></div>
  `;

  const lista = document.getElementById('banco-lista');
  function desenhar(){
    const q = (state.bancoBusca||'').trim().toLowerCase();
    const filtradas = !q ? todasPerguntas : todasPerguntas.filter(p=>{
      const campos = `${p.descritor||''} ${p.habilidade||''} ${p.enunciado||''} ${simuladosMapa.get(p.simuladoId)?.titulo||''}`.toLowerCase();
      return campos.includes(q);
    });
    lista.innerHTML = `<p class="muted" style="font-size:12.5px;margin:14px 18px 4px;">${filtradas.length} pergunta(s) encontrada(s)${q?` para "${esc(state.bancoBusca)}"`:''}.</p>` +
      (filtradas.length===0 ? `<div class="empty-state" style="margin:16px;">Nenhuma pergunta encontrada.</div>` :
        filtradas.map(p=>{
          const sim = simuladosMapa.get(p.simuladoId);
          return `
          <div class="list-row">
            <div class="info">
              <h4>${esc(p.enunciado)}</h4>
              <p>${p.descritor?`<span class="badge on" style="margin-right:6px;">Descritor: ${esc(p.descritor)}</span>`:'<span class="muted">Sem descritor</span>'}${p.habilidade?`<span class="badge info" style="margin-right:6px;">Habilidade: ${esc(p.habilidade)}</span>`:''} <span class="badge off">${esc(rotuloTipoPergunta(p.tipo||'multipla'))}</span> <span class="badge off">${esc(sim?.titulo||'Simulado removido')}</span></p>
            </div>
            <div class="row-actions">
              ${sim?`<button class="btn ghost small" data-action="banco-ir-simulado" data-id="${sim.id}">Ver no simulado</button>`:''}
            </div>
          </div>`;
        }).join(''));
    lista.querySelectorAll('[data-action="banco-ir-simulado"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.perguntasFiltroSimuladoId = btn.dataset.id;
        state.teacherTab = 'perguntas';
        render();
      });
    });
  }
  desenhar();

  const buscaInput = document.getElementById('banco-busca');
  buscaInput.addEventListener('input', ()=>{ state.bancoBusca = buscaInput.value; desenhar(); });
  content.querySelectorAll('[data-descritor]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.bancoBusca = btn.dataset.descritor; buscaInput.value = state.bancoBusca; desenhar(); });
  });
}
